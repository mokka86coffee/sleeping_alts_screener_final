/* Куб стоит третьим элементом в .row-s, справа от FLOW.
   flex:0 0 — ширина фиксирована, чтобы он не отбирал место
   у ленты FLOW, которая тянется по flex:1. */
.g-cube{flex:0 0 300px;display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  /* Палитра куба. Сменить эти четыре значения — сменить породу целиком.
     По умолчанию янтарь, в тон ряду FLOW рядом.
     Синий вариант: #1a2030 / #2e3850 / #A8C4FF / #4A72E0 / #78A0FF */
  --cb-dark:#22201a; --cb-rock:#3a352a; --cb-lit:#F5D089;
  --cb-glow:#D9A441; --cb-spec:#FFCF80}

/* Анимируем сам элемент svg, а не группу внутри: результат фильтров
   растеризуется один раз и дальше вращается композитором. Поворот
   внутренней группы заставлял бы пересчитывать feTurbulence
   и feDisplacementMap на каждом кадре. */
.cb{display:block;width:100%;height:auto;overflow:visible;
  will-change:transform;transform-origin:50% 55%;
  animation:cb-sway 7s ease-in-out infinite}

/* Покачивание ±4°: предмет читается живым, но это не выглядит вращением.
   Не нужна анимация — убери строку animation выше, картинка останется. */
@keyframes cb-sway{
  0%,100%{transform:rotate(-4deg)}
  50%    {transform:rotate(4deg)}
}

@media (prefers-reduced-motion:reduce){.cb{animation:none}}

@media (max-width:1240px){
  .g-cube{flex:0 0 220px}
}
@media (max-width:760px){
  /* На узком экране ряд и так переносится — декор только мешает */
  .g-cube{display:none}
}

/* ── Карточка монеты ────────────────────────────────────────
   Без подложки: панель отсекала кусок сцены и превращала наведение
   в «окно поверх экрана». Читаемость держат тень текста и тонкие
   разделители, как у подписей звёзд.

   Композиция из двух частей: слева вертикальная колонка с тем, что
   отвечает на «что это за монета», справа горизонтальная полоса с тем,
   что отвечает на «что с ней сейчас». Разные вопросы — разные оси. */
/* Цвет в карточке.
   ТОН (золото при score ≥ 90, иначе зелёный) отвечает ровно на один
   вопрос — топ это или нет, и живёт только на кольце и подписи паттерна.
   Остальным величинам цвет назначен по их природе, а не по качеству
   монеты: цена — зелёный/ржавый по знаку, объём — синий, фандинг — по
   знаку, служебное — серый. Иначе карточка красится целиком в один цвет
   и перестаёт читаться.

   Шрифты тоже разведены: цифры моноширинные, подписи — тот же тонкий
   гротеск, что на всём экране. Разная гарнитура делает то же, что разный
   цвет, только не тратя палитру. */
.ob-scard{--up:#48A97C;--dn:#FF6B35;--vol:#63A6E0;--mut:#8b929c;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.ob-scard{position:absolute;left:50%;top:50%;z-index:6;
  display:flex;align-items:stretch;gap:16px;
  padding:2px;pointer-events:none;
  transform:translate(-50%,-50%) scale(.97);opacity:0;
  text-shadow:0 1px 10px rgba(4,4,7,.95),0 0 3px rgba(4,4,7,.9);
  transition:opacity .2s ease,transform .28s cubic-bezier(.2,.9,.25,1.1)}
.ob-scard.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* Затемнение под карточкой. Смещено влево и вытянуто: правая половина
   карточки и так лежит на тёмном центре, а левая колонка попадает на
   светлый край ленты, где сквозь неё просвечивают дуги и подписи звёзд.
   Радиальный градиент без резкой границы — панель отсекала бы кусок
   сцены, а здесь фон просто густеет. */
.ob-scard::before{content:'';position:absolute;left:-46%;top:50%;
  width:150%;height:280%;transform:translateY(-50%);z-index:-1;
  background:radial-gradient(ellipse 55% 50% at 38% 50%,
    rgba(4,4,7,.93),rgba(4,4,7,.72) 45%,rgba(4,4,7,0) 78%);
  pointer-events:none}
/* --- левая колонка: идентичность --- */
.ob-sc-id{flex:0 0 128px;display:flex;flex-direction:column;gap:9px}
.ob-sc-hd{display:flex;align-items:flex-start;gap:9px}
.ob-sc-t{font-size:16px;font-weight:200;letter-spacing:3px;color:var(--t1);
  display:block;line-height:1}
.ob-sc-sec{font-size:8px;letter-spacing:1.3px;color:#6a6f79;margin-top:4px;
  display:block;line-height:1.3}
.ob-sc-ring{flex:0 0 auto;width:40px;height:40px;overflow:visible}
.ob-sc-ring circle{fill:none;stroke-width:2.2}
.ob-sc-ring .trk{stroke:rgba(200,220,232,.12)}
.ob-sc-ring .val{stroke:var(--tone);stroke-linecap:round}
.ob-sc-ring text{font-size:12px;font-weight:200;fill:var(--t1)}
.ob-sc-tags{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ob-sc-tag{font-size:8px;letter-spacing:1px;color:#8b929c}
.ob-sc-tag u{text-decoration:none;font-family:var(--mono);color:#c8ccd4}
.ob-sc-tag.up{color:var(--up)}
.ob-sc-tag.ath u{color:#c98f78}
/* Гейт пройден — нейтральная отметка, она не должна тянуть внимание */
.ob-sc-tag.low{color:#8b929c}
/* Превышение порога роста — тем же ржавым, что и остальные риски */
.ob-sc-tag.over{color:var(--dn);border-color:rgba(255,107,53,.35)}
/* ── Два уровня карточки ──────────────────────────────────
   Краткий вид по наведению, подробный по клику. Смысл не в экономии
   места: подробная карточка требует чтения, а решение принимается по
   трём вещам — что делать, как идёт цена, сколько до уровня. Всё
   остальное нужно, только когда решение уже под вопросом. */
.ob-scard.brief .ob-sc-det{display:none}
.ob-sc-det{display:flex;align-items:stretch;gap:16px}
.ob-scard.full .ob-sc-brief{display:none}
.ob-sc-brief{width:196px;text-align:center;padding:4px 2px}
.ob-b-t{font-size:19px;font-weight:200;letter-spacing:5px;color:var(--t1)}
.ob-b-act{margin-top:9px;font-size:11px;letter-spacing:1.6px}
.ob-b-act.go{color:var(--up)}
.ob-b-act.wait{color:#8b929c}
/* График крупнее, чем в подробной: здесь он несёт основную нагрузку */
.ob-sc-brief .ob-sc-spark{width:100%;height:52px;margin-top:14px}
.ob-b-lvl{margin-top:8px;font-size:9px;letter-spacing:1.4px;color:#5b606a}
.ob-b-lvl b{font-family:var(--mono);font-weight:400;font-size:11px;
  color:var(--dn)}
.ob-sc-brief .ob-sc-risk{justify-content:center;margin-top:9px}
/* Подсказка про клик — почти невидима, появляется при наведении */
.ob-b-more{margin-top:13px;font-size:7px;letter-spacing:2.6px;color:#3a3d45;
  transition:color .25s ease}
.ob-scard.brief:hover .ob-b-more,.ob-star:hover ~ .ob-scard .ob-b-more{
  color:#5b606a}
/* Вывод — самая крупная строка левой колонки: карточка должна отвечать
   «что делать», а не «какие числа». Остальное её обосновывает. */
.ob-sc-act{margin-top:10px;font-size:11px;letter-spacing:1.6px}
.ob-sc-act.go{color:var(--up)}
.ob-sc-act.wait{color:#8b929c}
/* Риск ржавым, а не красным: это предупреждение, а не запрет */
.ob-sc-risk{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.ob-sc-risk span{font-size:8px;letter-spacing:1px;color:var(--dn);
  border:1px solid rgba(255,107,53,.35);border-radius:5px;padding:1px 5px}
.ob-sc-spark .wk{fill:none;stroke-width:1;opacity:.45}
.ob-sc-spark .d3{fill:none;stroke-width:1.6}
/* Уровень инвалидации: пунктир, потому что это граница, а не величина */
.ob-sc-spark .stop{stroke:var(--dn);stroke-width:.8;stroke-dasharray:3 3;
  opacity:.55}
.ob-sc-spark .hit{fill:none;stroke:#cfe0f0;stroke-width:1;opacity:.8}
.ob-sc-chip{font-size:8.5px;letter-spacing:1.6px;color:var(--tone);
  padding-top:7px;border-top:1px solid rgba(200,220,232,.1);align-self:stretch}
/* --- правая полоса: состояние --- */
.ob-sc-st{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;
  padding-left:16px;border-left:1px solid rgba(200,220,232,.1)}
/* Объёмы в строку, а не столбиком: три горизонта — это одна величина
   в трёх масштабах, и рядом они сравниваются взглядом без чтения. */
.ob-sc-vols{display:flex;gap:14px}
.ob-sc-v{min-width:44px}
.ob-sc-v i{font-style:normal;display:block;font-size:7px;letter-spacing:2px;
  color:#5b606a}
.ob-sc-v b{display:block;font-family:var(--mono);font-weight:400;font-size:13px;
  letter-spacing:0;color:#cfe0f0;font-variant-numeric:tabular-nums;margin-top:2px}
.ob-sc-v s{text-decoration:none;display:block;height:2px;margin-top:4px;
  background:rgba(200,220,232,.1);position:relative}
.ob-sc-v s u{position:absolute;inset:0 auto 0 0;background:var(--vol);
  opacity:.9;display:block}
.ob-sc-v.off b{color:#3a3d45}
.ob-sc-v.off s u{display:none}
/* Засечка на дорожке — объём на момент попадания в журнал.
   Один и тот же трек несёт обе величины: заливка это «сейчас»,
   риска «тогда». Две отдельные полосы удвоили бы блок и заставили
   сравнивать глазом два ряда вместо одного. */
.ob-sc-v s e{position:absolute;top:-2px;bottom:-2px;width:1px;
  background:#cfe0f0;opacity:.55;display:block}
.ob-sc-v em{font-style:normal;display:block;font-family:var(--mono);
  font-size:8px;letter-spacing:0;color:#5b606a;margin-top:3px;
  font-variant-numeric:tabular-nums}
/* Стрелка направления: ускорение или затухание относительно входа */
.ob-sc-v b span{font-family:inherit;font-size:9px;margin-left:2px}
.ob-sc-v.gain b span{color:var(--vol)}
.ob-sc-v.fade b span{color:#6b7280}
.ob-sc-row{display:flex;align-items:flex-end;gap:14px}
.ob-sc-p7{font-family:var(--mono);font-size:20px;font-weight:300;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.ob-sc-p7.up{color:var(--up)}
.ob-sc-p7.dn{color:var(--dn)}
.ob-sc-pd{font-size:8px;letter-spacing:1px;color:#8b929c;margin-top:5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ob-sc-pd b{font-family:var(--mono);font-weight:400;color:#c8ccd4}
.ob-sc-pd b.up{color:var(--up)}
.ob-sc-pd b.dn{color:var(--dn)}
.ob-sc-spark{width:128px;height:40px;display:block;overflow:visible}
.ob-sc-foot{display:flex;align-items:center;gap:14px;font-size:8px;
  letter-spacing:1.1px;color:#5b606a;white-space:nowrap}
.ob-sc-foot b{font-family:var(--mono);font-weight:400;font-size:9.5px;
  color:#c8ccd4;font-variant-numeric:tabular-nums}
.ob-sc-fund{display:flex;align-items:center;gap:7px}
.ob-sc-fund s{text-decoration:none;width:52px;height:2px;
  background:rgba(200,220,232,.1);position:relative;display:block}
.ob-sc-fund s u{position:absolute;top:-2px;width:6px;height:6px;
  border-radius:2px;display:block}
.ob-sc-fund.pos u{background:var(--dn)}
.ob-sc-fund.pos b{color:var(--dn)}
.ob-sc-fund.neg u{background:var(--vol)}
.ob-sc-fund.neg b{color:var(--vol)}
/* Остаток 14-дневного окна — тонкая линия под всей правой полосой */
.ob-sc-life{height:1px;background:rgba(200,220,232,.1);position:relative}
.ob-sc-life u{position:absolute;inset:0 auto 0 0;background:var(--mut);
  opacity:.45;display:block}
/* Текстовая сводка вместо колонок с числами. Причина не в экономии:
   таблица заставляет сравнивать, а связный текст — читать. На экране,
   который живёт минуту, второе быстрее.

   Печатается построчно: каждая строка набирается открытым текстом, а
   по завершении подменяется размеченной версией — так подсветка
   тикеров и чисел не мешает набору. */
.obf-in{width:min(660px,88vw)}
.obf-text{margin-top:26px;min-height:210px}
.obf-p{font-size:14px;line-height:2.05;letter-spacing:.6px;color:#9aa3ae;
  margin:0 0 4px}
.obf-p .t{color:var(--t1);letter-spacing:2px}
.obf-p .n{font-family:var(--mono);color:#c8ccd4}
.obf-p .up{color:#48A97C}
.obf-p .dn{color:#FF6B35}
.obf-p .gd{color:var(--gd)}
.obf-p .mut{color:#5b606a}
/* Капитализация — контекст к имени: моноширинная, приглушённая,
   мельче тикера. Уточняет масштаб, не участвует в сравнении. */
.obf-p .obf-cap{font-family:var(--mono);font-size:11px;letter-spacing:0;
  color:#5b606a}
/* Предупреждение о выходных — единственная строка, которая говорит не
   о монетах, а о том, стоит ли вообще действовать сегодня */
.obf-p .warn{color:var(--dn);letter-spacing:1.4px}
.obf-p .sp{display:inline-block;width:64px;height:14px;vertical-align:-3px;
  margin:0 4px}
.obf-p .sp polyline{fill:none;stroke-width:1.2;stroke-dasharray:120;
  stroke-dashoffset:120;animation:obf-draw .9s ease-out forwards}
/* Каретка бежит по последней набираемой строке */
.obf-p.typing::after{content:'';display:inline-block;width:7px;height:14px;
  background:var(--am);vertical-align:-2px;margin-left:3px;opacity:.85;
  animation:obf-blink .8s step-end infinite}
/* Тикер — ссылка на TradingView. Наследует цвет, чтобы не выглядеть
 как обычная синяя ссылка среди остального текста; подчёркивание
 появляется только при наведении — сигнал кликабельности, а не шум. */
.ob-tv{color:inherit;text-decoration:none;border-bottom:1px solid transparent;
transition:border-color .2s ease}
.ob-tv:hover{border-color:currentColor}
/* ── Сцена лидеров ───────────────────────────────────────────
   Шире колонки текста: .obf-in держит 660px под чтение, а сцене
   нужен размах — при узком контейнере столбики схлопываются в
   частокол, и ни имя, ни ряд цены внутри не читаются. */
.obf-podium{width:min(1180px,94vw);margin:30px auto 0;
  margin-left:calc(50% - min(590px,47vw));position:relative}
.pd-svg{width:100%;height:auto;display:block;overflow:visible}
.obf-podium-cap{margin-top:10px;text-align:center;font-size:7px;
  letter-spacing:3px;text-transform:uppercase;color:#3C362D}
/* Превью сцены в сводке — по тому же порогу, что и сама сцена:
   прятать вход на экран, который на этом устройстве открывается,
   значит прятать дверь в существующую комнату. */
@media (max-width:760px){
  .obf-podium,.obf-podium-cap{display:none}
}
/* Сцена снимается только на телефонах. На планшете она читается:
   в альбоме это полный цилиндр, в портрете — сетка панелей из
   медиазапроса podium.py. Порог 900 отрезал iPad целиком, хотя
   объяснять там нечего — места хватает. */
@media (max-width:760px){
  .ob-podium{display:none}
}

/* ── Экран лидеров ───────────────────────────────────────────
   Третий экран в очереди: сводка → лидеры → дашборд. Своим слоем, а
   не блоком внутри сводки: там центрирование без прокрутки, и сцена
   в шестьсот пикселей высотой просто не помещается в окно.

   Материал тот же, что у сводки, вплоть до градиента подложки —
   переход между экранами должен читаться как смена содержимого, а
   не как переход в другое приложение. */
/* Второе описание зала: правило из render/podium.py идёт позже и
   перекрывает его, но расходиться они не должны — иначе однажды
   поменяют одно и будут искать, почему поведение прежнее. */
.ob-podium{position:fixed;inset:0;z-index:41;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 50% 46%,#0d0b09,#050406 70%);
  opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity .5s ease, visibility 0s linear .5s}
.ob-podium.on{opacity:1;pointer-events:auto;visibility:visible;
  transition:opacity .5s ease, visibility 0s}
.obp-in{width:min(1240px,96vw)}
.obp-h{font-size:11px;letter-spacing:.58em;text-transform:uppercase;
  color:#6E6656;text-align:center;text-indent:.58em}
.obp-scene{margin-top:18px}
.pd-svg{width:100%;height:auto;display:block;overflow:visible}
.obp-cap{margin-top:12px;text-align:center;font-size:7px;
  letter-spacing:3px;text-transform:uppercase;color:#3C362D}
.obp-foot{margin-top:26px;text-align:center;font-size:7px;
  letter-spacing:3px;text-transform:uppercase;color:#2E2A24}
/* Причина пустой сцены. Пустой экран неотличим от сломанного
   модуля — а отличать надо, и в первую очередь себе. */
.obp-empty{max-width:46ch;margin:60px auto;text-align:center;
  font-size:12px;line-height:1.7;color:#5E564A}

/* ── Появление ──
   Сцена собирается снизу вверх и по слоям: основание, затем столбики
   от левого края к правому, потом линии и звёзды. Порядок повторяет
   порядок чтения — глаз успевает понять устройство сцены прежде, чем
   она станет плотной.

   Задержка приходит инлайном через --d: считать её в CSS нечем, а
   таблица задержек в скрипте дублировала бы порядок столбиков. */
@keyframes pd-rise{
  from{opacity:0;transform:translateY(26px)}
  to  {opacity:1;transform:none}
}
@keyframes pd-grow{
  from{opacity:0;transform:scaleY(.04)}
  to  {opacity:1;transform:none}
}
@keyframes pd-pop{
  0%  {opacity:0;transform:scale(.2)}
  62% {opacity:1;transform:scale(1.16)}
  100%{opacity:1;transform:none}
}
@keyframes pd-draw{to{stroke-dashoffset:0}}
@keyframes pd-fade{from{opacity:0}to{opacity:1}}

.pd-rise{opacity:0;animation:pd-rise .78s cubic-bezier(.18,.72,.22,1) forwards;
  animation-delay:var(--d,0s)}
/* transform-box обязателен: без него точка отсчёта у SVG-элемента
   берётся от начала координат холста, и столбик не растёт из
   основания, а уезжает за кадр. */
.pd-grow{opacity:0;transform-box:fill-box;transform-origin:bottom;
  animation:pd-grow .8s cubic-bezier(.18,.72,.22,1) forwards;
  animation-delay:var(--d,0s)}
.pd-pop{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:pd-pop .62s cubic-bezier(.2,1.5,.4,1) forwards;
  animation-delay:var(--d,0s)}
.pd-fade{opacity:0;animation:pd-fade 1.1s ease forwards;
  animation-delay:var(--d,0s)}
.pd-px{stroke-dasharray:420;stroke-dashoffset:420;
  animation:pd-draw 1.5s cubic-bezier(.3,.7,.2,1) forwards;
  animation-delay:var(--d,0s)}

@media (prefers-reduced-motion:reduce){
  .pd-rise,.pd-grow,.pod-pop,.pd-pop,.pd-fade{
    opacity:1!important;animation:none!important;transform:none!important}
  .pd-px{stroke-dashoffset:0!important;animation:none!important}
}

/* Вторая копия того же правила — след повторно применённого патча.
   Порог поднят и здесь: пока копия жива, она перекрывает первую.
   Убрать дубликат целиком — работа для fix_css_dedup.py. */
@media (max-width:760px){
  .ob-podium{display:none}
}

.obf-foot,.obf-bar{opacity:0;transition:opacity .6s ease}
.obf-foot.on,.obf-bar.on{opacity:1}
.ob{position:relative;height:88vh;min-height:560px;max-height:900px;
  overflow:hidden;
  /* Выход из сетки .screen на всю ширину окна. Блок остаётся ВНУТРИ #dash:
     showPane() вешает .hide на #dash целиком, и вынеси мы орбиту наружу —
     её пришлось бы прятать отдельной правкой в DASH_JS.
     Отрицательный margin-top съедает верхний padding .screen, чтобы
     экран начинался от края окна, а не с отступом. */
  width:100vw;margin-left:calc(50% - 50vw);margin-top:-34px;margin-bottom:44px}
.ob > svg{position:absolute;inset:0;width:100%;height:100%}
/* Затемнение слева. Карточка монеты и подписи узлов живут в левой
   половине, а лента дуг там же самая светлая — текст ложился прямо
   на золото. Градиент гасит фон, но не трогает содержимое: он лежит
   под слоем подписей (z-index 3) и над сценой. */
.ob::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(4,4,7,.78) 0%,rgba(4,4,7,.55) 18%,rgba(4,4,7,.22) 36%,transparent 52%)}
/* Подписи узлов — HTML поверх SVG: у отчёта своя гарнитура и трекинг,
   текст внутри SVG жил бы по своим правилам и не совпал бы с блоками. */
.ob-lab{position:absolute;transform:translate(-50%,-50%);text-align:center;
  cursor:pointer;user-select:none;white-space:nowrap;z-index:3;
  transition:opacity .3s ease}
/* Названия категорий держим приглушёнными: они постоянны от прогона
   к прогону и в чтении не нуждаются — подсвечиваются при наведении
   и у активного узла. Верхний слой экрана отдан монетам, они меняются. */
.ob-lab-n{font-size:8px;font-weight:300;letter-spacing:3.5px;color:var(--m2);
  opacity:.6;transition:color .3s ease,opacity .3s ease}
.ob-lab-v{font-size:20px;font-weight:200;letter-spacing:2px;margin-top:2px;
  color:var(--c,var(--t3));opacity:.5;transition:opacity .3s ease}
.ob-lab:hover .ob-lab-n,.ob-lab.on .ob-lab-n{opacity:1}
.ob-lab:hover .ob-lab-n,.ob-lab.on .ob-lab-n{color:var(--c,var(--am-l))}
.ob-lab:hover .ob-lab-v,.ob-lab.on .ob-lab-v{opacity:1}
/* Невыбранные притухают, но не исчезают — орбита должна читаться целиком */
.ob.picked .ob-lab:not(.on){opacity:.42}
/* ── Легенда стратегий ───────────────────────────────────────
   Внизу слева. Цвет звезды перестал быть украшением и несёт
   подкейс, а шесть подкейсов на память не читаются — без подписи
   палитра превращается в шум.

   Сгруппирована по стадиям, а не одним списком из шести: список
   объяснил бы только цвет, группировка объясняет заодно, почему
   холодные и тёплые оттенки стоят рядом. Одной подписью две вещи.

   Скрывается вместе с ядром на тех же состояниях: когда открыта
   карточка монеты или выбрана звезда, объяснение палитры мешает,
   а не помогает. */
/* pointer-events включены: легенда обязана ловить наведение, иначе
   свёрнутую не раскрыть. Блок маленький и стоит в углу, звёздам он
   не мешает. */
.ob-leg{position:absolute;left:22px;bottom:22px;z-index:3;
  width:212px;padding:12px 14px 13px;border-radius:10px;
  background:rgba(6,8,12,.62);backdrop-filter:blur(9px);
  border:1px solid rgba(255,255,255,.05);pointer-events:auto;
  transition:opacity .35s ease,background .3s ease}

/* Свёрнутое состояние. Тело схлопывается, шапка с точками остаётся —
   она и есть тот заметный элемент на месте легенды. Наведение
   возвращает всё обратно.

   max-height, а не display: скачок высоты без перехода читается как
   подёргивание блока, а анимировать display нельзя. Потолок взят с
   запасом под шесть стратегий с тикерами. */
/* Свёрнута по умолчанию, раскрывается наведением. Состояние орбиты
   на это больше не влияет: палитра не меняется от того, открыта
   карточка или нет, и привязывать к этому вид легенды было незачем. */
.ob-leg-body{overflow:hidden;max-height:0;opacity:0;
  transition:max-height .3s ease,opacity .25s ease}
.ob-leg:hover .ob-leg-body{max-height:520px;opacity:1}

/* В свёрнутом виде подложка чуть плотнее и рамка теплее: полоска
   должна читаться как живой элемент, к которому имеет смысл
   подвести курсор, а не как остаток панели. Теперь это состояние по
   умолчанию, а наведение возвращает обычный материал. */
.ob-leg{background:rgba(10,12,17,.72);
  border-color:rgba(255,217,138,.16)}
.ob-leg:hover{background:rgba(6,8,12,.72);
  border-color:rgba(255,255,255,.05)}

.ob-leg-h{display:flex;align-items:center;gap:8px;
  font-size:7px;letter-spacing:3px;text-transform:uppercase;
  color:#43434e;margin-bottom:9px;transition:margin .3s ease}
.ob-leg-h{margin-bottom:0}
.ob-leg:hover .ob-leg-h{margin-bottom:9px}

/* Ряд точек в шапке. Виден всегда, но работает как опознавательный
   знак именно в свёрнутом виде. */
.ob-leg-dots{display:flex;gap:4px;margin-left:auto}
.ob-leg-dots i{width:5px;height:5px;border-radius:50%;
  box-shadow:0 0 5px currentColor}
.ob-leg-g{margin-bottom:9px}
.ob-leg-g:last-child{margin-bottom:0}
.ob-leg-s{font-size:7px;letter-spacing:1.6px;color:#5a5a66;
  margin-bottom:5px}
.ob-leg-r{display:flex;align-items:center;gap:7px;margin-bottom:4px;
  font-size:8.5px;letter-spacing:.6px;color:var(--m2)}
.ob-leg-r:last-child{margin-bottom:0}
/* Точка светится своим цветом через currentColor: цвет задаётся
   один раз в разметке и работает и на заливку, и на свечение. */
.ob-leg-d{width:6px;height:6px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 6px currentColor}
.ob-leg-n{color:var(--t1);opacity:.82}

/* Список тикеров стратегии. Отступ слева ровно под точкой и зазором,
   чтобы колонка названий и колонка монет читались как одна вещь.
   Цвет наследует стратегию, но приглушён: это перечисление, а не
   заголовок. */
.ob-leg-c{margin:2px 0 7px 13px;font-size:8px;letter-spacing:.8px;
  line-height:1.5;opacity:.62;word-break:break-word}
.ob-leg-g .ob-leg-c:last-child{margin-bottom:0}

/* Точка стратегии в чипе карточки монеты. Карточка называет фигуру
   словом, звезда — цветом, и связать их глазами было нечем. */
.ob-sc-dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-right:5px;vertical-align:middle;
  box-shadow:0 0 5px currentColor}

@media (max-width:900px){
  /* На узком экране легенда съедает поле звёзд, ради которых экран
     и существует. Прячем целиком, а не ужимаем: половина легенды
     объясняет хуже, чем её отсутствие. */
  .ob-leg{display:none}
}

.ob-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;width:340px;pointer-events:none;z-index:3;
  transition:opacity .35s ease}
.ob-core-k{font-size:7px;letter-spacing:3px;color:#43434e}
.ob-core-v{font-size:26px;font-weight:200;letter-spacing:6px;color:var(--t1);
  margin-top:5px}
.ob-core-s{font-size:9px;letter-spacing:2px;color:var(--m2);margin-top:12px}
.ob-core-s b{color:var(--gd);font-weight:400}
/* Режим рынка уступает место карточке и возвращается, когда её нет */
.ob.showing .ob-core{opacity:0}
/* Наведение на звезду забирает центр себе: карточка категории и режим
   рынка гаснут, затемняющая подложка остаётся ради читаемости. */
.ob.starred .ob-core{opacity:0}
.ob.starred .ob-card{opacity:0}
.ob.starred .ob-wrap::before{opacity:1}
/* Подписи звёзд уходят под карточку и мешают её читать. Пока карточка
   открыта, гасим их все, кроме той звезды, на которую навели. */
.ob.starred .ob-star{transition:opacity .25s ease}
.ob.starred .ob-star:not(.hot){opacity:.18}
/* Цвет категории приходит инлайновой переменной --c с каждого узла,
   поэтому правила одни на все семь, а палитра живёт в данных. */
.ob-node{cursor:pointer}
.ob-node .ob-ring{fill:none;stroke-width:.9;opacity:.5;transition:opacity .3s ease}
.ob-node .ob-ic{opacity:.8;transition:opacity .3s ease}
.ob-node .ob-glow{opacity:.14;transition:opacity .4s ease}
.ob-node .ob-ping{opacity:0}
.ob-node:hover .ob-ring,.ob-node:hover .ob-ic{opacity:1}
.ob-node.on .ob-ring{opacity:1;stroke-width:1.3}
.ob-node.on .ob-ic{opacity:1}
.ob-node.on .ob-glow{opacity:.5}
/* Пинг только у выбранного: у всех семи сразу экран стал бы мигалкой */
.ob-node.on .ob-ping{animation:ob-ping 2.6s ease-out infinite}
/* Сегмент доли на орбите подсвечивается вместе со своим узлом:
   иначе выделение живёт только на точке, а дуга остаётся ровной. */
.ob-seg{transition:opacity .3s ease,stroke-width .3s ease}
.ob-seg.on{opacity:1;stroke-width:1.4}
/* Выноска от узла к центру — появляется только у активного */
.ob-link{stroke-dasharray:2 4;opacity:0;transition:opacity .35s ease}
.ob-link.on{opacity:.4}
/* Содержимое категории показывается в центре орбиты, а не у узла:
   центр — единственное место, где ничего не перекрывается дугами,
   и взгляд не бегает за кометой по кругу. */
.ob-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:300px;z-index:4;pointer-events:none}
.ob-wrap::before{content:'';position:absolute;left:50%;top:50%;
  width:540px;height:410px;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at center,rgba(6,6,9,.92),
    rgba(6,6,9,.6) 45%,rgba(6,6,9,0) 72%);
  opacity:0;transition:opacity .4s ease;pointer-events:none}
.ob.showing .ob-wrap::before{opacity:1}
/* Карточка узкая: полоса во всю ширину заставляла глаз проделывать
   путь от тикера до значения и терять строку. Ширина ленты сжата
   примерно втрое, тикер и число теперь в одном взгляде. */
.ob-card{position:absolute;left:50%;top:50%;width:150px;
  transform:translate(-50%,-50%) scale(.96);opacity:0;
  transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.25,1.1)}
.ob-card.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ob-card-h{text-align:center;margin-bottom:2px}
.ob-card-n{display:block;font-size:8px;letter-spacing:3.5px;color:var(--c)}
.ob-card-v{display:block;font-size:30px;font-weight:200;letter-spacing:3px;
  color:var(--t1);font-variant-numeric:tabular-nums;margin-top:4px}
.ob-card-note{font-size:10px;letter-spacing:1.6px;color:#5b606a;
  margin-bottom:14px;text-align:center}
/* Заголовок подкейса внутри карточки. Первому не нужен верхний отступ —
   он идёт сразу за подписью категории. */
.ob-card-g{font-size:9px;letter-spacing:2.5px;color:#5b606a;
  margin:13px 0 2px;text-transform:uppercase}
.ob-card-g:first-of-type{margin-top:0}
/* Колонки подогнаны под содержимое: пустота между тикером и полосой
   заставляла глаз делать лишний скачок. Полоса теперь короткая —
   она показывает соотношение, а точное значение стоит рядом цифрой. */
.ob-card-r{display:grid;grid-template-columns:46px 34px 42px;align-items:center;
  gap:7px;margin-top:8px}
.ob-card-k{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}
.ob-card-k s{display:block;font-size:7px;letter-spacing:1.5px;color:#5b606a;
  text-decoration:none;margin-top:1px}
.ob-card-bar{height:2px;background:var(--trk);position:relative}
.ob-card-bar i{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.85}
.ob-card-x{font-size:11px;text-align:right;color:#8b929c;
  font-variant-numeric:tabular-nums}
.ob-card-spark{display:block;width:100%;height:26px;margin-top:10px;opacity:.75}
.ob-chips{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:2px;
  justify-content:center;pointer-events:auto}
/* Три ступени яркости вместо трёх цветов: цвет уже занят категорией,
   а кратность объёма читается светимостью — как в ленте .lead-list. */
.ob-chip{font-size:9px;letter-spacing:1.5px}
.ob-chip[data-coin]{cursor:pointer}
.ob-chip.t0{color:#5f6572}
.ob-chip.t1{color:#8a7c58}
.ob-chip.t2{color:#D4B476}
.ob-chip.t3{color:#FFE0A0;text-shadow:0 0 8px rgba(217,164,65,.4)}
/* ── Звёзды: лидер FLOW и монеты из журнала ──────────────────
   Стоят вне орбиты, чтобы не путаться с узлами категорий.
   Свежесть попадания в журнал несёт размер и яркость, кратность
   объёма — цвет и второй луч. Признаки не спорят за одно свойство. */
.ob-star{cursor:pointer}
.ob-star .ob-ray{transition:opacity .3s ease}
.ob-star:hover .ob-ray{opacity:1}
.ob-star-lbl{font-size:5.7px;letter-spacing:1.2px;
  paint-order:stroke;stroke:rgba(6,6,9,.92);stroke-width:2;
  transition:opacity .25s ease}
.ob-star-lbl.lead{font-size:6.6px;letter-spacing:1.6px}
/* Рост от дна — вторая строка подписи. Цвет наследуется от звезды
   (задаётся при отрисовке), а не берётся зелёным: зелёный на тёмном
   фоне среди золота бьёт по глазам и читается как отдельный статус,
   хотя это просто величина. */
.ob-star-up{font-size:5px;letter-spacing:.6px;font-weight:400;
  paint-order:stroke;stroke:rgba(6,6,9,.92);stroke-width:2.5;
  transition:opacity .25s ease}
.ob-star:hover .ob-star-lbl,.ob-star:hover .ob-star-up{opacity:1}
/* Кольцо только у ×50 и выше: доп. признак, а не украшение у всех */
.ob-star-ring{fill:none;stroke:var(--am-l);stroke-width:.4;opacity:.35;
  animation:ob-halo 4.5s ease-in-out infinite}
@keyframes ob-halo{
  0%,100%{transform:scale(1);opacity:.35}
  50%{transform:scale(1.5);opacity:.08}
}
.ob-star.fresh > *:not(text){
  animation:ob-shine 1.5s ease-in-out infinite;animation-delay:inherit}
/* У выбранного мерцание гасим: оно спорит с радарным пингом */
.ob-star.fresh:hover > *{animation:none}
@keyframes ob-drift{to{transform:rotate(360deg)}}
@keyframes ob-driftBack{to{transform:rotate(-360deg)}}
@keyframes ob-run{to{stroke-dashoffset:-1000}}
@keyframes ob-twinkle{0%,100%{opacity:.15}50%{opacity:.7}}
@keyframes ob-pulse{0%,100%{opacity:.30}50%{opacity:.55}}
@keyframes ob-ping{
  0%{transform:scale(1);opacity:.55}
  70%,100%{transform:scale(2.6);opacity:0}
}
/* Дрейф семейства: оборот за 4 минуты. Крутится группа без фильтров —
   размытая подсветка лежит внутри и на кадр не пересчитывается. */
.ob-spin{transform-origin:500px 281px;animation:ob-drift 240s linear infinite}
/* Встречный слой медленнее и в другую сторону: два одинаковых направления
   читались бы как одно, разница скоростей даёт параллакс. */
.ob-spin-back{transform-origin:500px 281px;
  animation:ob-driftBack 380s linear infinite}
.ob-breathe{animation:ob-pulse 9s ease-in-out infinite}
/* Попутные частицы: те же дуги орбиты коротким штрихом, разные скорости
   и фазы дают ощущение потока, а не одной кометы. */
.ob-mote{animation:ob-run linear infinite}
/* Пылевое облако: бесшовный цикл сдвигом ровно на ширину кадра.
   Содержимое нарисовано дважды со смещением на тот же период (см.
   buildCloud), поэтому в конце прохода вторая копия занимает место
   первой и склейки не видно.

   Собрано из мягких эллипсов, без feTurbulence: шум на движущемся
   слое пересчитывается каждый кадр. На прозрачности в десять
   процентов разница не читается, цена отличается на порядок. */
@keyframes ob-cloudrun{
  from{transform:translateX(0)}
  to  {transform:translateX(1000px)}
}
.ob-cloud{animation:ob-cloudrun 110s linear infinite;
  will-change:transform;pointer-events:none}

/* Летящие кометы. Один набор кадров на все четыре: направление
   задаётся переменными --dx/--dy на самом элементе. Иначе четыре
   кометы означали бы четыре почти одинаковых блока, и правка
   скорости требовала бы четырёх правок вместо одной.

   Цикл 26 секунд, сам пролёт занимает 19% из них — около пяти
   секунд. Четыре кометы со сдвигом на четверть цикла дают пролёт
   примерно раз в шесть с половиной секунд.

   Двигается только transform, фильтров на группе нет: гауссово
   размытие на летящем объекте пересчитывается каждый кадр и стоит
   дороже всей остальной сцены. Свечение головы поэтому радиальный
   градиент, а не blur. */
@keyframes ob-fly{
  0%   {transform:translate(0,0);                 opacity:0}
  1.2% {opacity:1}
  16%  {opacity:1}
  19%  {transform:translate(var(--dx),var(--dy)); opacity:0}
  100% {transform:translate(var(--dx),var(--dy)); opacity:0}
}
.ob-comet{animation:ob-fly 26s linear infinite;
  animation-delay:var(--dly,0s);will-change:transform}


/* Кометы замершего рынка. Показываются только при frozen: сам факт
   учащения трафика и есть сигнал, подписи он не требует.

   display, а не opacity — при скрытии анимация сбрасывается, и при
   возврате состояния кометы стартуют с начала цикла, а не выныривают
   из середины пролёта. */
.ob-comet-risk{display:none}
.ob.frozen .ob-comet-risk{display:block}

/* Два состояния режима — разные узлы, а не подмена текста скриптом:
   подсветка у них разная, и держать её на классе проще, чем
   переключать три свойства из JS. */
.v-frost{display:none}
.ob.frozen .v-live{display:none}
.ob.frozen .v-frost{display:block}

/* Подсветка стоит на PUMP OFF, хотя для рынка это «плохое»
   состояние: она отмечает не оценку рынка, а то, что момент рабочий.
   Свечение тёплое, а не красное — цвет должен звать, а не
   останавливать. Красное здесь несут кометы, они про сам рынок. */
@keyframes ob-frost-glow{
  0%,100%{text-shadow:0 0 22px rgba(245,166,35,.30),
                      0 0 60px rgba(245,166,35,.12)}
  50%    {text-shadow:0 0 30px rgba(245,166,35,.46),
                      0 0 84px rgba(245,166,35,.20)}
}
.v-frost{color:var(--am-n);animation:ob-frost-glow 5.5s ease-in-out infinite}

/* Плашка. Показывается во frozen ИЛИ когда в ней есть пилюля
   выходных: пятница на живом рынке — тоже повод её показать, хотя
   класса frozen тогда нет. Отсюда второе правило через :has(). */
.ob-frost{display:none;margin-top:16px;align-items:center;
  justify-content:center;gap:14px;flex-wrap:wrap}
.ob.frozen .ob-frost{display:flex}
.ob-frost:has(.ob-frost-w){display:flex}

.ob-frost-t{font-size:8px;font-weight:500;letter-spacing:3.4px;
  text-transform:uppercase;color:#E0796B;
  border:1px solid rgba(217,107,94,.35);border-radius:999px;
  padding:4px 11px 3px}
.ob-frost-w{font-size:8px;font-weight:500;letter-spacing:3.4px;
  text-transform:uppercase;color:var(--am);
  border:1px solid rgba(245,166,35,.32);border-radius:999px;
  padding:4px 11px 3px}
.ob-frost-n{font-size:8.5px;font-weight:300;letter-spacing:1.9px;
  color:#8b8a92}
.ob-frost-n b{font-weight:500;color:#D8CFC8}
.ob-frost-n b.sec{color:var(--am-l)}
.ob-core-s b.dn{color:#D96B5E}
.ob-core-s b.mute{color:#5f6169}

@media (prefers-reduced-motion:reduce){
  .ob-spin,.ob-spin-back,.ob-breathe,.ob-dust circle,
  .ob-node .ob-ping,.ob-mote,.ob-star-ring,.ob-star,
  .ob-cloud,.ob-comet,.v-frost,
  .ob-star.fresh > *{animation:none}
}

/* Орбита — только для настольных браузеров.
   На телефонах и планшетах сцену тормозит не анимация, а растеризация:
   при DPR 3 экран во всю ширину это миллионы физических пикселей,
   поверх которых лежат две маски и feTurbulence зерна. Урезанная
   версия выглядела бы хуже и всё равно не летала, поэтому блок
   скрывается целиком — мобильный вариант будет отдельным.

   Признак — грубый указатель, а не ширина: планшет бывает широким
   и медленным. Узкое окно на десктопе тоже отсекаем: орбита в него
   просто не помещается, семь подписей встают друг на друга. */
/* гейт для мобильных в демо снят */




/* Появление по очереди: сводку читают сверху вниз, и порядок показа
   задаёт порядок чтения. Задержка у каждого блока своя, в --d. */
.rise{opacity:0;transform:translateY(6px);
  animation:obf-rise .6s cubic-bezier(.2,.9,.25,1) var(--d,0s) forwards}
@keyframes obf-rise{to{opacity:1;transform:none}}
/* Дыхание фона: экран живёт секунды, статичный прямоугольник за это
   время успевает показаться мёртвым */
.obf-glow{position:absolute;left:50%;top:44%;width:900px;height:560px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(245,166,35,.07),
    rgba(245,166,35,0) 62%);
  animation:obf-breathe 7s ease-in-out infinite}
@keyframes obf-breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
/* Каретка печати: гаснет, когда строка допечатана */
.obf-reg i{display:inline-block;width:2px;height:22px;margin-left:6px;
  background:var(--am);vertical-align:-2px;animation:obf-blink .9s step-end infinite}
.obf-reg.done i{display:none}
@keyframes obf-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.obf-spark{width:84px;height:22px;display:block}
.obf-spark polyline{stroke-dasharray:200;stroke-dashoffset:200;
  animation:obf-draw 1.1s ease-out 1.6s forwards}
@keyframes obf-draw{to{stroke-dashoffset:0}}
/* Отдельная строка «у уровня» — это те, кто решается сегодня */
.obf-near{margin-top:18px;text-align:center;font-size:9px;letter-spacing:1.6px;
  color:#5b606a}
.obf-near b{font-family:var(--mono);font-weight:400;color:var(--dn)}
.obf-near em{font-style:normal;color:var(--t3);letter-spacing:2px}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none;opacity:1;transform:none}
  .obf-glow,.obf-reg i,.obf-spark polyline{animation:none}
  .obf-spark polyline{stroke-dashoffset:0}
}
/* ── Сводка при входе ───────────────────────────────────────
   Экран поверх дашборда: что с рынком и что сегодня смотреть.
   Гаснет сам примерно через минуту, снимается кликом или Esc.

   Собирается из того же дерева фаз, что и карточки: сводка не
   отдельный список, а срез уже существующей логики — иначе она
   начнёт расходиться с карточками при первой же правке порогов. */
.ob-brief{position:fixed;inset:0;z-index:40;display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(1100px 700px at 50% 42%,#0d0d13,#050508 70%);
  opacity:0;pointer-events:none;transition:opacity .5s ease}
.ob-brief.on{opacity:1;pointer-events:auto}
.obf-in{width:min(940px,90vw)}
.obf-date{font-size:8px;letter-spacing:4px;color:#43434e;text-align:center}
/* Строка рынка: только факты, без вывода — режим и аппетит уже
   являются оценкой, дальше идти нельзя */
.obf-mkt{display:flex;justify-content:center;align-items:baseline;gap:22px;
  margin-top:14px;font-size:11px;letter-spacing:1.6px;color:#8b929c}
.obf-mkt b{font-family:var(--mono);font-weight:400;color:var(--t3)}
.obf-mkt .dn{color:#FF6B35}
.obf-mkt .up{color:#48A97C}
.obf-reg{text-align:center;margin-top:10px;font-size:26px;font-weight:200;
  letter-spacing:7px;color:var(--t1)}
.obf-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;
  margin-top:40px}
.obf-col h3{margin:0 0 12px;font-size:8px;letter-spacing:3.4px;
  font-weight:300;color:#5b606a;text-align:center}
.obf-col.go h3{color:var(--up)}
.obf-col.wait h3{color:#8b929c}
.obf-col.hold h3{color:var(--gd)}
.obf-row{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;padding:7px 0;border-top:1px solid rgba(200,220,232,.07)}
.obf-row:first-of-type{border-top:0}
.obf-t{font-size:13px;font-weight:300;letter-spacing:2.4px;color:var(--t1)}
.obf-w{font-size:8.5px;letter-spacing:1px;color:#5b606a}
.obf-v{font-family:var(--mono);font-size:10px;color:#8b929c}
.obf-empty{font-size:9px;letter-spacing:1.4px;color:#3a3d45;text-align:center;
  padding:10px 0}
.obf-foot{margin-top:38px;text-align:center;font-size:7px;letter-spacing:3px;
  color:#3a3d45}
/* Полоса времени: экран уходит сам, и это должно быть видно заранее */
.obf-bar{height:1px;background:rgba(200,220,232,.08);margin-top:12px;
  position:relative;overflow:hidden}
.obf-bar u{position:absolute;inset:0 auto 0 0;background:#5b606a;
  display:block;width:100%;transform-origin:left;
  animation:obf-run var(--lap,60s) linear forwards}
@keyframes obf-run{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.obf-bar u{animation:none}}

/* ── Блок монеты в брифинге ──────────────────────────────
   Рамки нет намеренно: блок держат луч слева, свечение из-под
   содержимого и воздух вокруг. Рамка замыкала бы его в отдельный
   экран, а он — часть чтения, идущая между строк текста. */
/* Прозрачность на самом блоке убрана: раньше он проявлялся целиком,
   и внутренняя очередь была не видна под общим фейдом. Видимость
   теперь решают дочерние элементы, каждый в свой черёд. */
.obf-blk{position:relative;margin:22px 0 24px;padding:18px 8px 16px 22px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;overflow:hidden;
  visibility:hidden}
.obf-blk.on{visibility:visible}

.obf-blk::after{content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(120% 140% at 6% 80%,
    rgba(var(--acc-rgb),.10), rgba(var(--acc-rgb),.03) 42%,
    transparent 72%)}

/* Тикер стоит ЗДЕСЬ и больше нигде: в шапке он дублировался,
   и оба раза читались как разные элементы. */
.obf-ghost{position:absolute;left:20px;top:-10px;
  font-size:96px;font-weight:200;letter-spacing:-2px;line-height:1;
  color:rgba(var(--acc-rgb),.115);pointer-events:none;user-select:none}

.obf-rail{position:absolute;left:0;top:12%;bottom:12%;width:2px;
  border-radius:2px;background:rgba(var(--acc-rgb),.16);overflow:hidden}
.obf-rail u{position:absolute;left:0;width:2px;height:34%;border-radius:2px;
  text-decoration:none;
  background:linear-gradient(180deg,
    transparent, rgb(var(--acc-rgb)), transparent);
  filter:blur(.4px);animation:obf-rail 3.4s ease-in-out infinite}
@keyframes obf-rail{
  0%{transform:translateY(-40%);opacity:0}
  18%{opacity:1} 82%{opacity:1}
  100%{transform:translateY(300%);opacity:0}
}

.obf-bl{position:relative;flex:1 1 300px;min-width:270px;padding-top:26px}
.obf-br{position:relative;display:flex;align-items:center;gap:16px;
  margin-left:auto}

.obf-k{font-size:8px;font-weight:500;letter-spacing:3.2px;
  text-transform:uppercase;color:rgba(var(--acc-rgb),.7);margin-bottom:7px}
.obf-meta{font-size:12px;font-weight:300;color:#8b8a92;letter-spacing:.3px}
.obf-meta b{font-weight:400;color:rgba(var(--acc-rgb),.92)}
/* Имя obf-cap, а не cap: .cap в этом файле — капсула шапки
   дашборда, с рамкой и градиентом. Совпадение имён рисовало
   овал вокруг подписи капитализации. */
.obf-meta .obf-cap{color:#5f6169;font-size:10.5px}

.obf-stat{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.045);
  font-size:10.5px;font-weight:300;color:#8b8a92;letter-spacing:.4px}
.obf-stat b{font-weight:400;color:#c9ccd2;
  font-family:'SF Mono',ui-monospace,monospace}

.obf-mini{display:block;width:214px;height:auto}
.obf-ring{display:block;width:58px;height:58px;flex:none}

/* Прорисовка. Втрое медленнее первого варианта: брифинг читают,
   и быстрый рост линии читается как мигание, а не как появление. */
@keyframes obf-draw{to{stroke-dashoffset:0}}
@keyframes obf-ring{to{stroke-dashoffset:var(--off)}}
@keyframes obf-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes obf-fade{from{opacity:0}to{opacity:1}}
@keyframes obf-pulse{
  0%,100%{transform:scale(1);opacity:.32}
  50%{transform:scale(2.2);opacity:0}
}

/* Начальное состояние. Держится до класса .on: разметка блока
   вставляется в дерево заранее (иначе первый кадр уходит на разбор
   SVG и прорисовка стартует рывком), а анимация обязана начаться
   в момент показа. Без этой развязки кривая дорисовывалась ещё
   во время печати предыдущих строк, и блок появлялся готовым. */
.obf-drawn{stroke-dasharray:700;stroke-dashoffset:700}
.obf-ring circle.v{stroke-dasharray:151;stroke-dashoffset:151}
.obf-wave line{transform-origin:center;transform-box:fill-box;
  transform:scaleY(0)}
.obf-lat{opacity:0}
.obf-blk .obf-k,.obf-blk .obf-meta,.obf-blk .obf-stat{opacity:0}
.obf-blk .obf-ghost{opacity:0}
.obf-blk .obf-rail u{animation:none}

/* Запуск. Все задержки отсчитываются от появления блока. */
.obf-blk.on .obf-drawn{
  animation:obf-draw 4.6s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
.obf-blk.on .obf-ring circle.v{
  animation:obf-ring 3.8s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
.obf-blk.on .obf-wave line{
  animation:obf-grow 1.9s cubic-bezier(.22,.61,.36,1) var(--d,0s) forwards}
.obf-blk.on .obf-lat{
  animation:obf-fade 2.4s ease var(--d,0s) forwards}
.obf-blk.on .obf-pulse{transform-origin:center;transform-box:fill-box;
  animation:obf-pulse 3.6s ease-out infinite}
.obf-blk.on .obf-rail u{
  animation:obf-rail 3.4s ease-in-out infinite}

/* Текст внутри блока — своей очередью, а не разом с графиком.
   Порядок тот же, в каком его читают: роль, потом суть, потом
   числа. Призрак первым: он задаёт, о какой монете речь. */
@keyframes obf-in{
  from{opacity:0;transform:translateY(6px)}
  to  {opacity:1;transform:none}
}
.obf-blk.on .obf-ghost{
  animation:obf-fade 2.2s ease .1s forwards}
.obf-blk.on .obf-k{
  animation:obf-in 1.1s cubic-bezier(.22,.61,.36,1) .5s forwards}
.obf-blk.on .obf-meta{
  animation:obf-in 1.1s cubic-bezier(.22,.61,.36,1) 1.2s forwards}
.obf-blk.on .obf-stat{
  animation:obf-in 1.1s cubic-bezier(.22,.61,.36,1) 2.1s forwards}

@media (prefers-reduced-motion:reduce){
  .obf-blk.on .obf-drawn,.obf-blk.on .obf-ring circle.v,
  .obf-blk.on .obf-wave line,.obf-blk.on .obf-lat,
  .obf-blk.on .obf-rail u,.obf-blk.on .obf-pulse,
  .obf-blk.on .obf-ghost,.obf-blk.on .obf-k,
  .obf-blk.on .obf-meta,.obf-blk.on .obf-stat{animation:none}
  .obf-blk .obf-drawn{stroke-dashoffset:0}
  .obf-blk .obf-wave line{transform:none}
  .obf-blk .obf-lat,.obf-blk .obf-ghost,.obf-blk .obf-k,
  .obf-blk .obf-meta,.obf-blk .obf-stat{opacity:1}
  .obf-blk .obf-ring circle.v{stroke-dashoffset:var(--off)}
}

/* Орбита снимается на мобильных, брифинг остаётся — но графики
   на узком экране встают под текст и съедают половину высоты.
   Текст важнее: он и есть содержание сводки. */
@media (max-width:760px){
  .obf-br{display:none}
  .obf-ghost{font-size:64px}
}

@media (max-width:1240px){
  .row-1{grid-template-columns:1fr 1fr;gap:34px 40px}
  .row-2{grid-template-columns:1fr 1fr;gap:34px 40px}
  .row-2 .g-set{grid-column:1 / -1}
  .fn-line{left:60px;right:80px}
  .fn-node{width:64px}
  .risk-cap{right:auto;left:0}
  .fr-in{grid-template-columns:150px 64px 96px 92px 1fr 92px 86px 84px 96px;
         gap:0 12px;padding:0 20px}
  .fl{max-width:560px}
  .row-s{flex-wrap:wrap}
    .g-lead{flex:1 1 100%;align-items:center;padding-top:0; position:static}
  .lead-list{display:flex;flex-direction:row;flex-wrap:wrap;
    max-width:none;overflow:visible}
  .lead-t.lead-x{opacity:1;transform: translateX(0);pointer-events:auto}
  .lead-hd{align-self:center}
}

@media (max-width:760px){
  .screen{padding:24px 16px 48px}
  .hd{flex-wrap:wrap;gap:16px}
  .cap{margin-left:0;width:100%;justify-content:space-between;gap:12px;padding:0 14px}
  .row-1,.row-2{grid-template-columns:1fr;gap:44px}
  .row-2 .g-set{grid-column:auto}
  .vol-call,.vol-hook,.risk-arc{display:none}
  .fn-nodes{flex-wrap:wrap;justify-content:center;gap:24px}
  .fn-gap{display:none}
  .fn-line{display:none}
  .fn-in{padding:44px 20px 32px}
  .fn-foot{flex-direction:column;gap:8px}
  .set-row{grid-template-columns:1fr 26px 56px;gap:10px;padding:12px 8px}
  .set-in{display:none}
  .pane-hd{flex-wrap:wrap;gap:10px}
  .pane-n{margin-left:0;width:100%}
  /* на узком экране закрепляем только тикер */
  .sx .sx-c-soc,.sx .sx-c-surge{position:static;box-shadow:none}
  .sx .sx-c-sym{box-shadow:10px 0 14px -8px rgba(0,0,0,.85)}
  .sx td,.sx th{padding-left:10px;padding-right:10px}


  .fr-in{grid-template-columns:150px 66px;gap:0 12px;padding:0 22px}
  .fr-price svg{height:34px}
    .fr-c1{grid-column:1}
    .fr-ring{grid-column:2;grid-row:1}
    .fr-c{grid-column:1 / -1;flex-direction:row;align-items:center;
          gap:12px;padding:0;flex-wrap:wrap}
    .fr-btn{grid-column:1 / -1;justify-self:stretch;text-align:center}
    .fl{height:150px}
    .fl-c{font-size:6px;letter-spacing:1.5px}
}

@media (max-width:520px){
  .big{font-size:46px}
  .risk-v{font-size:42px}
  .risk-legs{gap:14px}
  .g-risk{min-height:0}
  .sx .sx-idx{display:none}
  .sx .sx-c-sym{left:0}
  .b3-in{padding-left:20px}
  .b3 .blk-n{display:none}
  .b3-grid{flex-direction:column;align-items:flex-start;gap:12px}
  .rr-nums{gap:16px;width:100%}
  .grid{grid-template-columns:1fr}
}
</style>

<body>

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<div id="coinHost"></div>
<template id="coinTpl">
<style>
:host{all:initial}
*{box-sizing:border-box}
.wrap{position:fixed;inset:0;overflow:hidden;background:#020907;color:#e8fff4;font-family:Inter,system-ui,sans-serif;font-weight:300}
.stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:50% 50%;
  --f-name:Jost,sans-serif;--f-num:Jost,sans-serif;--f-cap:Jost,sans-serif;--f-text:Inter,sans-serif;
  background:radial-gradient(900px 640px at 86% -4%, #1f7a5c 0%, #0f3f31 30%, #062219 55%, #020907 85%),#020907}
.beam{position:absolute;left:900px;top:-80px;width:520px;height:900px;background:linear-gradient(rgba(160,255,214,.22),rgba(160,255,214,0));filter:blur(40px);transform:skewX(-14deg);pointer-events:none;animation:beam 9s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.85;transform:skewX(-14deg)}50%{opacity:1;transform:skewX(-11deg)}}
.floor{position:absolute;left:0;right:0;top:475px;bottom:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(150,225,195,.16) 0, rgba(110,190,160,.13) 5%, rgba(60,140,110,.11) 14%, rgba(20,70,55,.10) 38%, rgba(2,9,7,0) 75%)}
.floor:before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:linear-gradient(90deg,transparent,rgba(190,245,220,.16) 25%,rgba(190,245,220,.16) 75%,transparent);filter:blur(2px)}
.floor:after{content:"";position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(180deg,rgba(160,230,200,.10),transparent);filter:blur(14px)}
.slab{position:absolute;left:330px;top:70px;width:860px;height:720px;transform:perspective(1500px) rotateY(16deg);transform-origin:50% 50%}
.slab svg{display:block;width:860px;height:720px;overflow:visible}
.leaders{position:absolute;inset:0;width:1440px;height:900px;pointer-events:none}
.mono,.cap{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.hd{position:absolute;left:100px;top:40px;display:flex;align-items:baseline;gap:18px}
.hd .t{font-family:var(--f-name);font-size:26px;font-weight:200;letter-spacing:.22em;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.25);text-decoration:none;cursor:pointer;transition:.25s}
.hd .t:hover{color:#ffd98a;text-shadow:0 0 22px rgba(245,169,58,.55)}
.hd .ch{font-size:9px;color:#8fe0b5;letter-spacing:.04em}.hd .ch.dn{color:#ff9f8a}
.hd .st{font-family:var(--f-cap);font-size:7px;letter-spacing:.34em;color:#7fb8a0;text-transform:uppercase}
.hdr{position:absolute;right:100px;top:50px;text-align:right;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.22em;color:#7fb8a0;text-transform:uppercase}
.hdr b{color:#dfe9e4;font-weight:400}
.pos{position:absolute;left:100px;top:96px;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.22em;text-transform:uppercase;color:#7fb8a0;opacity:0;animation:fadein .9s ease .3s forwards}
.pos b{font-weight:400;color:#e8fff4}.pos.mine{color:#f5a93a}.pos.mine b{color:#ffd98a}
.srcs{position:absolute;left:100px;top:118px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:560px;opacity:0;animation:fadein .9s ease .4s forwards}
.src{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-cap);font-size:6.5px;letter-spacing:.2em;text-transform:uppercase;color:#9fd8bf;white-space:nowrap}
.src i{width:5px;height:5px;border-radius:50%;background:#5fe6a8;box-shadow:0 0 6px rgba(95,230,168,.8)}
.src.stale{color:#ff8a70}.src.stale i{background:#ff5a4a;box-shadow:0 0 8px rgba(255,90,74,.9);animation:staleBlink 1.3s ease-in-out infinite}
.src.none{color:#6b7f76}.src.none i{background:transparent;border:1px solid #6b7f76;box-shadow:none}
@keyframes staleBlink{0%,100%{opacity:1}50%{opacity:.3}}
.card .card-src{position:static;margin:-4px 0 8px;opacity:1;animation:none;max-width:none}
.note .num.stale{color:#ff9f8a}.note .num u{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff5a4a;margin-left:8px;vertical-align:middle;box-shadow:0 0 8px rgba(255,90,74,.9);animation:staleBlink 1.3s ease-in-out infinite}
.note .sub.stale{color:#ff8a70;opacity:1}
.back{position:absolute;left:100px;top:78px;font-family:var(--f-cap);font-size:7.5px;letter-spacing:.28em;text-transform:uppercase;color:#7fb8a0;text-decoration:none;opacity:.8}
.back:hover{color:#dfffee}
/* пометки групп */
.note{position:absolute;width:180px;color:#ffcf6e;cursor:default}
.note .row{display:flex;align-items:center;gap:7px;color:#f5a93a;filter:drop-shadow(0 0 5px rgba(255,207,110,.55))}
.note .cap{font-size:7.5px;letter-spacing:.32em;text-transform:uppercase;color:#a9dcc6;font-weight:500}
.note .num{font-family:var(--f-num);font-weight:200;font-size:16px;color:#fff;margin:5px 0 1px;letter-spacing:.02em;text-shadow:0 0 14px rgba(255,207,110,.4)}
.note .unit{font-size:9px;color:#9fd8bf;line-height:1.35}
.note .sub{font-size:8.5px;color:#7fb8a0;line-height:1.35;margin-top:3px;opacity:.85}
.note .sub.hot{color:#f5a93a;opacity:1}
.note:hover .num{color:#ffcf6e}
/* карточка — по центру экрана */
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:460px;max-height:82vh;overflow:auto;
  background:rgba(3,18,14,.8);border:1px solid rgba(127,232,176,.3);color:#e8ecfb;backdrop-filter:blur(14px);border-radius:12px;padding:16px 20px 14px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:9}

    if (bk2 && bk2.entry) pos = '<div class="pos' + (bk2.manual ? ' mine' : '') + '">' + (bk2.manual ? 'твоя позиция' : 'вход журнала') + ' <b>' + px4(bk2.entry) + '</b>' + (has(bk2.chg) ? ' · <b>' + pct(bk2.chg) + '</b> от входа' : '') + (bk2.upX && +bk2.upX >= 1.5 ? ' · ×' + (+bk2.upX).toFixed(1) : '') + (bk2.closed ? ' · закрыта' : '') + '</div>';
    // имя монеты — ссылка на TradingView, бессрочный фьючерс Binance (суффикс .P), в новой вкладке
    var tvSym = 'BINANCE:' + String(s.coin || (String(s.t).toUpperCase() + 'USDT')).toUpperCase().replace(/[^A-Z0-9]/g, '') + '.P';
    var srcs = srcLine();
    var hd = '<div class="hd"><a class="t" href="https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(tvSym) + '" target="_blank" rel="noopener" title="открыть в TradingView · Binance фьючерс">' + esc(s.t) + '</a>' + (chg !== null ? '<span class="ch' + (chg < 0 ? ' dn' : '') + '">' + pct(chg) + ' за сутки</span>' : '') + (s.pattern ? '<span class="st">' + esc(s.pattern) + '</span>' : '') + '</div>' + pos;
    var hdr = '<div class="hdr">' + (s.cap ? 'капитализация <b>' + esc(s.cap) + '</b>' : '') + (has(s.v1d) ? ' · объём к норме <b>×' + (+s.v1d).toFixed(1) + '</b>' : '') + (has(s.fund) ? ' · фандинг <b>' + (+s.fund).toFixed(3) + '%</b>' : '') + '</div>';
    // значки — как в зале: цвет кейса FLOW (GATE_CASE), группа книги (в работе · брать · выходить), лидер, горячая, новая, своя
    var CASE_C = { hidden: ['#d9b96e', 'скрытый спрос'], spring: ['#6b7ae0', 'пружина'], churn: ['#8b93c4', 'перемол'], fuel: ['#f0a878', 'топливо'], dormant: ['#5c6598', 'спячка'], taker: ['#c98ce0', 'смена агрессора'], leverage: ['#ec6f5e', 'плечо'] };
    var GRP_C = { take: ['#6b7ae0', 'брать'], trade: ['#4fc98a', 'в работе'], exit: ['#ec6f5e', 'выходить'] };
    function grpOf(z) { var inBook = !!(z.book && (z.book.usd || z.book.px)); if (inBook) return (z.act && z.act.group) === 'exit' ? 'exit' : 'trade'; return (z.act && z.act.act) === 'брать' ? 'take' : null; }
    function marks(z) { var m = ''; if (z.lead) m += '<em class="ld" title="лидер прогона">★</em>'; if (z.hot) m += '<em class="ht" title="горячая: оборот выше порога">●</em>'; if (z.new) m += '<em class="nw" title="новая в журнале">✦</em>'; var b = BOOK[String(z.t).toUpperCase()]; if (b && b.manual && !b.closed) m += '<em class="my" title="твоя позиция">◆</em>'; return m; }
    var cols = '', per = 14;
    for (i = 0; i < NAMES.length; i += per) cols += '<div class="col">' + NAMES.slice(i, i + per).map(function (c) {
      var z = BY[c], cc = CASE_C[z.st] || ['#7b83b8', 'без кейса'], gr = grpOf(z);
      return '<a href="#' + esc(c) + '" class="' + (c === tick ? 'cur' : '') + '"><i style="background:' + cc[0] + ';box-shadow:0 0 6px ' + cc[0] + '" title="' + cc[1] + '"></i><span>' + esc(c) + '</span>' + marks(z) + (gr ? '<u style="color:' + GRP_C[gr][0] + ';border-color:' + GRP_C[gr][0] + '">' + GRP_C[gr][1] + '</u>' : '') + '</a>';
    }).join('') + '</div>';
    var legend = '<div class="cleg">' + Object.keys(CASE_C).map(function (k) { return '<b><i style="background:' + CASE_C[k][0] + '"></i>' + CASE_C[k][1] + '</b>'; }).join('') + '<s></s><b><em class="ld">★</em>лидер</b><b><em class="ht">●</em>горячая</b><b><em class="nw">✦</em>новая</b><b><em class="my">◆</em>твоя</b></div>';
    var coins = '<div class="coins"><div class="cbtn"><i></i>монеты <b>' + NAMES.length + '</b></div><div class="clist"><div class="ch">монеты журнала · по алфавиту · цвет — кейс, метка — группа книги</div><div class="cols">' + cols + '</div>' + legend + '</div></div>';
    var cs = clockState(), clock = cs ? vessel(cs) : '';
    var aura = '<div class="aura up' + (cs && cs.kind === 'up' ? (cs.live ? ' on' : cs.soon ? ' soon' : '') : '') + '"></div><div class="aura dn' + (cs && cs.kind === 'dn' ? (cs.live ? ' on' : cs.soon ? ' soon' : '') : '') + '"></div>';
    stage.innerHTML = '<div class="beam"></div><div class="floor"></div>' + aura + '<div class="slab"><svg viewBox="0 0 ' + SW + ' ' + SH + '">' + slab + '</svg></div><svg class="leaders" viewBox="0 0 1440 900">' + leaders + '</svg>' +
      hd + hdr + srcs + '<a class="back" href="brief.html">← схема</a>' + coins + notes + dzone + clock + '<div class="replay" id="replay">заново</div><div class="legend">' + (ser.length > 2 ? 'цена · ' + days + ' дневок' + (d0 ? ' · архив' : ' · звезда') : 'ряда цены нет') + ' · наведи на пометку — полная группа</div>' +
      '<div class="atmo"><div class="vig"></div><svg><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg></div>';
    root.getElementById('replay').onclick = function () { build(tick); };
    fit();
  }
  function fit() { var W = root.host.ownerDocument.documentElement.clientWidth || window.innerWidth, H = window.innerHeight; var k = Math.min(W / 1440, H / 900); stage.style.transform = 'translate(-50%,-50%) scale(' + k.toFixed(4) + ')'; }
  function fromHash() { var h = (location.hash || '').replace('#', '').toUpperCase(); return BY[h] ? h : null; }
  function start() {
    var lead = STARS.filter(function (s) { return s.lead; })[0];
    build(fromHash() || (lead && String(lead.t).toUpperCase()) || NAMES[0]);
  }
  window.addEventListener('hashchange', function () { var h = fromHash(); if (h) build(h); });
  window.addEventListener('resize', fit);
  // часы живут: пересчёт раз в минуту — состояние сосуда и сияние
  setInterval(function () { var cs = clockState(); if (!cs) return; var box = root.querySelector('.clockbox'); if (box) box.outerHTML = vessel(cs);
    var up = root.querySelector('.aura.up'), dn = root.querySelector('.aura.dn'); if (up && dn) { up.className = 'aura up' + (cs.kind === 'up' ? (cs.live ? ' on' : cs.soon ? ' soon' : '') : ''); dn.className = 'aura dn' + (cs.kind === 'dn' ? (cs.live ? ' on' : cs.soon ? ' soon' : '') : ''); } }, 60000);
  if (STARS.length) start(); else stage.innerHTML = '<div class="empty">звёзд в сводке нет</div>';
})();
</script>
