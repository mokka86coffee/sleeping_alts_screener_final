<title>Избранное · поток</title>
<style>
/* 25.10 владелец (по картинке со стеклянными узлами поверх портрета): «ты такой дизайн можешь сделать отдельно?» → «делай пока просто отдельно».
   Отдельная страница: группы избранного — стеклянные узлы вокруг портрета, соединены светящимися линиями по пути монеты:
   остальные → шевелятся → скоро → идёт сейчас. Данные — output/fast_state.json (только чтение), обновление раз в 30 с. */
:root { --g: 96,220,130; --gd: 60,170,100; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #04110a; color: #e6f2ea; font-family: "Avenir Next", Futura, "Helvetica Neue", sans-serif; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#links { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: fixed; width: 224px; border-radius: 22px; padding: 10px; background: rgba(255,255,255,.035); border: 1px solid rgba(200,255,220,.10); box-shadow: 0 20px 60px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: default; transition: transform .35s, box-shadow .35s; }
.node::before { content: ""; position: absolute; left: -12px; top: -12px; width: 26px; height: 26px; border-left: 1px solid rgba(200,255,220,.22); border-top: 1px solid rgba(200,255,220,.22); border-top-left-radius: 14px; }
.node:hover { transform: translateY(-3px); box-shadow: 0 24px 70px rgba(0,0,0,.45), 0 0 0 1px rgba(var(--g),.25); }
.in { position: relative; border-radius: 16px; padding: 14px 16px 14px; background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.06); min-height: 108px; }
.node.hot .in { background: linear-gradient(150deg, rgba(var(--g),.55), rgba(40,140,70,.78) 60%, rgba(30,110,55,.85)); border-color: rgba(var(--g),.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.node.hot { width: 260px; box-shadow: 0 20px 70px rgba(0,0,0,.4), 0 0 60px rgba(var(--g),.18); }
.ok { position: absolute; right: 14px; top: 12px; color: rgb(var(--g)); font-size: 12px; }
.node.hot .ok { color: #eaffef; }
.grp { font-size: 9px; letter-spacing: .32em; text-transform: uppercase; color: rgba(220,240,228,.6); }
.node.hot .grp { color: rgba(240,255,245,.85); }
.nm { margin-top: 10px; font: 600 26px "Avenir Next", Futura, sans-serif; letter-spacing: .04em; color: #fff; display: flex; align-items: center; gap: 8px; min-height: 32px; transition: opacity .4s; }
.nm a { color: inherit; text-decoration: none; }
.nm a:hover { text-shadow: 0 0 12px rgba(var(--g),.9); }
.tp { width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle, #fff, #ffe2a0 40%, #ff9f45 75%, rgba(255,140,60,0)); box-shadow: 0 0 8px 2px rgba(255,170,70,.7); animation: tp 1.7s ease-in-out infinite; }
@keyframes tp { 45% { transform: scale(.8); opacity: .75 } 70% { transform: scale(1.15) } }
.sub { margin-top: 6px; font-size: 12px; color: rgba(220,240,228,.75); display: flex; gap: 12px; transition: opacity .4s; }
.sub b { font-weight: 500; color: rgb(var(--g)); }
.node.hot .sub b { color: #fff; }
.cnt { margin-top: 10px; font-size: 9px; letter-spacing: .2em; color: rgba(220,240,228,.45); }
.node.hot .cnt { color: rgba(240,255,245,.7); }
.cap { position: fixed; transform: translate(-50%, 0); font-size: 13px; color: rgba(225,240,230,.85); text-align: center; pointer-events: none; white-space: nowrap; }
.lbl { position: fixed; transform: translate(-50%, -50%); font-size: 10px; color: rgba(225,240,230,.8); padding: 2px 7px; border-radius: 8px; background: rgba(5,20,12,.55); pointer-events: none; white-space: nowrap; }
#list { position: fixed; z-index: 9; display: none; min-width: 260px; max-height: calc(100vh - 24px); overflow: auto; scrollbar-width: none; padding: 12px 10px; border-radius: 16px; background: rgba(6,22,14,.88); border: 1px solid rgba(200,255,220,.14); box-shadow: 0 20px 60px rgba(0,0,0,.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#list::-webkit-scrollbar { display: none; }
#list .h { font-size: 9px; letter-spacing: .32em; color: rgb(var(--g)); padding: 2px 8px 8px; }
#list a { display: flex; align-items: baseline; gap: 12px; padding: 6px 8px; border-radius: 9px; color: inherit; text-decoration: none; white-space: nowrap; }
#list a:hover { background: rgba(var(--g),.12); }
#list a b { font: 600 13px "Avenir Next", Futura, sans-serif; color: #fff; min-width: 70px; display: flex; align-items: center; gap: 6px; }
#list a em { font-style: normal; font-size: 11px; color: rgb(var(--g)); }
#list a u { text-decoration: none; margin-left: auto; font-size: 10.5px; color: rgba(220,240,228,.55); }
#empty { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); font-size: 10px; letter-spacing: .3em; color: rgba(220,240,228,.35); }
</style>

    if (portrait) { const ph = H * .98, pw = ph * GIRL_W / GIRL_H, px = W * .58 - pw / 2, py = H - ph + Math.sin(s0 * .3) * 3;

    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);   // виньетка
  }
  // узлы
  const GR = [
    { key: 'rest', name: 'ОСТАЛЬНЫЕ', fx: .10, fy: .22 },
    { key: 'stir', name: 'ШЕВЕЛЯТСЯ', fx: .47, fy: .20 },
    { key: 'soon', name: 'СКОРО', fx: .16, fy: .60 },
    { key: 'go', name: 'ИДЁТ СЕЙЧАС', fx: .58, fy: .60, hot: true },
  ];
  const grpOf = f => { const g = String(f.group || f.list || '').toLowerCase(); return /ид[её]т сейчас|ход|идут|going/.test(g) ? 'go' : /скоро|близ|soon/.test(g) ? 'soon' : /шевел|stir/.test(g) ? 'stir' : 'rest'; };
  const mult = f => { const m = +f.now > 0 && +f.atl > 0 ? +f.now / +f.atl : 0; return m ? '×' + (m >= 10 ? Math.round(m) : m.toFixed(1).replace('.', ',')) : ''; };
  const cap = f => +f.mcap > 0 ? (+f.mcap >= 1e9 ? (+f.mcap / 1e9).toFixed(2).replace('.', ',') + ' млрд $' : Math.round(+f.mcap / 1e6) + ' млн $') : '';
  const tv = sym => `https://www.tradingview.com/chart/?symbol=BINANCE:${sym}.P`;
  const plural = n => n % 10 === 1 && n % 100 !== 11 ? 'монета' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'монеты' : 'монет';
  let LISTS = { rest: [], stir: [], soon: [], go: [] }; const NODE = {}, IDX = { rest: 0, stir: 0, soon: 0, go: 0 };
  const nodesEl = document.getElementById('nodes');
  GR.forEach(g => { const el = document.createElement('div'); el.className = 'node' + (g.hot ? ' hot' : ''); el.innerHTML = `<div class="in"><span class="ok">✓</span><div class="grp">${g.name}</div><div class="nm"></div><div class="sub"></div><div class="cnt"></div></div>`; nodesEl.appendChild(el);
    const capEl = document.createElement('div'); capEl.className = 'cap'; document.body.appendChild(capEl); NODE[g.key] = { el, capEl, g };
    el.addEventListener('mouseenter', () => showList(g.key)); el.addEventListener('mouseleave', hideListSoon); });
  function fillNode(k) { const N = NODE[k], L = LISTS[k], el = N.el; if (!L.length) { el.querySelector('.nm').innerHTML = '<span style="opacity:.35;font-weight:400;font-size:16px">пока никого</span>'; el.querySelector('.sub').innerHTML = ''; el.querySelector('.cnt').textContent = ''; return; }
    const f = L[IDX[k] % L.length], sym = String(f.sym), nm = sym.replace(/USDT$/, '');
    el.querySelector('.nm').innerHTML = `<a href="${tv(sym)}" target="_blank" rel="noopener">${nm}</a>${f.top ? '<i class="tp"></i>' : ''}`;
    el.querySelector('.sub').innerHTML = `${mult(f) ? `<span><b>${mult(f)}</b> от дна</span>` : ''}${cap(f) ? `<span>КП ${cap(f)}</span>` : ''}`;
    el.querySelector('.cnt').textContent = L.length > 1 ? `${(IDX[k] % L.length) + 1} / ${L.length}` : ''; }
  // список при наведении: весь список узла, клик по имени — TradingView
  const listEl = document.getElementById('list'); let hideT = 0;
  function showList(k) { clearTimeout(hideT); const L = LISTS[k], N = NODE[k]; if (!L.length) return;
    listEl.innerHTML = `<div class="h">${N.g.name} · ${L.length}</div>` + L.map(f => { const sym = String(f.sym), nm = sym.replace(/USDT$/, ''); return `<a href="${tv(sym)}" target="_blank" rel="noopener"><b>${nm}${f.top ? '<i class="tp"></i>' : ''}</b><em>${mult(f)}${mult(f) ? ' от дна' : ''}</em><u>${cap(f) ? 'КП ' + cap(f) : ''}</u></a>`; }).join('');
    const r = N.el.getBoundingClientRect(); listEl.style.display = 'block'; const w = listEl.offsetWidth; let x = r.right + 14; if (x + w > innerWidth - 12) x = Math.max(12, r.left - w - 14); listEl.style.left = x + 'px'; listEl.style.top = '12px'; }
  function hideListSoon() { clearTimeout(hideT); hideT = setTimeout(() => { listEl.style.display = 'none'; }, 260); }
  listEl.addEventListener('mouseenter', () => clearTimeout(hideT)); listEl.addEventListener('mouseleave', hideListSoon);
  // раскладка узлов и линий
  const lg = document.getElementById('lg'); let PATHS = [], LBL = [];
  function layout() {
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    GR.forEach(g => { const N = NODE[g.key], w = g.hot ? 260 : 224; N.el.style.left = Math.round(Math.min(W - w - 20, g.fx * W)) + 'px'; N.el.style.top = Math.round(g.fy * H) + 'px'; });
    requestAnimationFrame(links);
  }
  function port(k, side) { const r = NODE[k].el.getBoundingClientRect(); return side === 'r' ? [r.right - 10, r.top + r.height / 2] : side === 'l' ? [r.left + 10, r.top + r.height / 2] : side === 'b' ? [r.left + r.width / 2, r.bottom - 10] : [r.left + r.width / 2, r.top + 10]; }
  function links() {
    lg.innerHTML = ''; LBL.forEach(l => l.remove()); LBL = []; PATHS = [];
    const pairs = [['rest', 'r', 'stir', 'l'], ['stir', 'b', 'soon', 't'], ['soon', 'r', 'go', 'l']];
    for (const [a, sa, b, sb] of pairs) { const [x1, y1] = port(a, sa), [x2, y2] = port(b, sb), dx = Math.abs(x2 - x1) * .5, dy = Math.abs(y2 - y1) * .5;
      const c1 = sa === 'r' ? [x1 + dx, y1] : sa === 'b' ? [x1, y1 + dy] : [x1, y1], c2 = sb === 'l' ? [x2 - dx, y2] : sb === 't' ? [x2, y2 - dy] : [x2, y2];
      const dd = `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`, hot = b === 'go';
      lg.insertAdjacentHTML('beforeend', `<path d="${dd}" fill="none" stroke="rgba(${hot ? '96,230,130' : '160,230,190'},.55)" stroke-width="6" filter="url(#glow)"/><path d="${dd}" fill="none" stroke="rgba(${hot ? '150,255,170' : '210,240,220'},.85)" stroke-width="1.4"/>`);
      const p = lg.lastElementChild, L = p.getTotalLength(), mid = p.getPointAtLength(L / 2); PATHS.push({ p, L, hot, b });
      const lb = document.createElement('div'); lb.className = 'lbl'; lb.style.left = mid.x + 'px'; lb.style.top = mid.y + 'px'; lb.dataset.k = b; document.body.appendChild(lb); LBL.push(lb); }
    labels();
  }
  function labels() { LBL.forEach(l => { const n = LISTS[l.dataset.k].length; l.textContent = n + ' ' + plural(n); });
    GR.forEach(g => { const N = NODE[g.key], r = N.el.getBoundingClientRect(); N.capEl.style.left = (r.left + r.width / 2) + 'px'; N.capEl.style.top = (r.bottom + 10) + 'px'; N.capEl.textContent = ''; }); }
  // данные
  async function load() { try { const r = await fetch('../output/fast_state.json', { cache: 'no-store' }); if (!r.ok) throw 0; const d = await r.json(), F = (d.favorites || []).filter(f => f && f.sym);
      const L = { rest: [], stir: [], soon: [], go: [] }; F.forEach(f => L[grpOf(f)].push(f)); LISTS = L; Object.keys(NODE).forEach(fillNode); labels();
      document.getElementById('empty').textContent = F.length ? '' : 'избранное пустое'; } catch (e) { document.getElementById('empty').textContent = 'нет данных бота'; } }
  // монеты в узлах листаются раз в 6 с, узлы со сдвигом
  setInterval(() => { Object.keys(NODE).forEach((k, i) => { if (LISTS[k].length > 1) { const el = NODE[k].el, nm = el.querySelector('.nm'), sub = el.querySelector('.sub'); nm.style.opacity = sub.style.opacity = 0; setTimeout(() => { IDX[k]++; fillNode(k); nm.style.opacity = sub.style.opacity = 1; }, 400 + i * 150); } }); }, 6000);
  // огоньки бегут по линиям
  function frame(t) {
    drawBg(t);
    const d = Math.min(devicePixelRatio || 1, 2); ctx.setTransform(d, 0, 0, d, 0, 0); ctx.globalCompositeOperation = 'lighter';
    for (const P of PATHS) for (let k = 0; k < 3; k++) { const u = ((t / 1000) * (P.hot ? .28 : .18) + k / 3) % 1, q = P.p.getPointAtLength(u * P.L), r = P.hot ? 16 : 12, g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r);
      g.addColorStop(0, P.hot ? 'rgba(200,255,210,.95)' : 'rgba(225,245,230,.8)'); g.addColorStop(.3, P.hot ? 'rgba(96,230,130,.45)' : 'rgba(170,230,195,.3)'); g.addColorStop(1, 'rgba(96,230,130,0)'); ctx.fillStyle = g; ctx.fillRect(q.x - r, q.y - r, r * 2, r * 2); }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  buildPortrait(); layout(); addEventListener('resize', layout); load(); setInterval(load, 30000); requestAnimationFrame(frame);
})();
</script>
