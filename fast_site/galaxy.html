<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Избранное · галактика</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#05060a}#cv{position:fixed;inset:0;display:block}</style></head>
<body><canvas id="cv"></canvas>
<script>
(() => {
  // ── общее для трёх «глубинных» страниц (25.10 владелец, по картинкам deep web / галактика / корни: «а такие можно 3 разных?» → «да»)
  //    данные — избранное бота из output/fast_state.json (только чтение, раз в 30 с); наведение на монету — имя, ×N от дна, КП; клик — TradingView
  const TAU = Math.PI * 2, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), ease = q => 1 - Math.pow(1 - q, 3);
  const GRP = [{ k: 'go', name: 'ИДЁТ СЕЙЧАС' }, { k: 'soon', name: 'СКОРО' }, { k: 'stir', name: 'ШЕВЕЛЯТСЯ' }, { k: 'rest', name: 'ОСТАЛЬНЫЕ' }], GI = { go: 0, soon: 1, stir: 2, rest: 3 };
  const grpOf = f => { const g = String(f.group || f.list || '').toLowerCase(); return /ид[её]т сейчас|ход|идут|going/.test(g) ? 'go' : /скоро|близ|soon/.test(g) ? 'soon' : /шевел|stir/.test(g) ? 'stir' : 'rest'; };
  const multOf = f => +f.now > 0 && +f.atl > 0 ? +f.now / +f.atl : 0, multS = m => m ? '×' + (m >= 10 ? Math.round(m) : m.toFixed(1).replace('.', ',')) : '';
  const capS = f => +f.mcap > 0 ? (+f.mcap >= 1e9 ? (+f.mcap / 1e9).toFixed(2).replace('.', ',') + ' млрд $' : Math.round(+f.mcap / 1e6) + ' млн $') : '';
  const tvUrl = sym => `https://www.tradingview.com/chart/?symbol=BINANCE:${sym}.P`;
  const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
  const rnd = (seed, i) => { const v = Math.sin(seed * 9301 + i * 49297) * 233280; return v - Math.floor(v); };
  let COINS = [], BY = { go: [], soon: [], stir: [], rest: [] }, LOADED = false;
  async function loadFav() { try { let r = await fetch('/state.json', { cache: 'no-store' }).catch(() => null); if (!r || !r.ok) r = await fetch('../output/fast_state.json', { cache: 'no-store' }); if (!r.ok) return; const d = await r.json(), F = (d.favorites || []).filter(f => f && f.sym);
      const by = { go: [], soon: [], stir: [], rest: [] }; COINS = F.map(f => { const sym = String(f.sym), c = { sym, nm: sym.replace(/USDT$/, ''), g: grpOf(f), f, seed: hash(sym), m: multOf(f) }; return c; });
      COINS.forEach(c => { c.i = by[c.g].length; by[c.g].push(c); }); BY = by; LOADED = true; } catch (e) {} }
  loadFav(); setInterval(loadFav, 30000);
  // подсказка и клик: каждую рамку сцена кладёт в HIT экранные точки монет
  // 27.10 владелец: «хинты бы поинтереснее» → из четырёх вариантов «оставь только 3й» — «Орбита»: имя по дуге сверху, группа снизу, ×N справа, КП слева, по орбите бежит спутник
  let HIT = [], MX = -1, MY = -1, HOVER = null, HPOS = null, HT0 = 0, NOW = 0;
  const TCOL = { go: '255,214,170', soon: '150,205,255', stir: '255,150,175', rest: '255,105,105' }, TF = '"Exo 2","Avenir Next",sans-serif';
  const fmtM = m => m >= 10 ? String(Math.round(m)) : m.toFixed(1).replace('.', ',');
  addEventListener('mousemove', e => { MX = e.clientX; MY = e.clientY; }); addEventListener('mouseleave', () => { MX = MY = -1; });
  addEventListener('click', () => { if (HOVER) window.open(tvUrl(HOVER.sym), '_blank', 'noopener'); });
  function hitTest() { let best = null, bd = 18 * 18; for (const h of HIT) { const dx = h.x - MX, dy = h.y - MY, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = h.c; } }
    if (!best && HOVER && HPOS) { const dx = HPOS[0] - MX, dy = HPOS[1] - MY; if (dx * dx + dy * dy < 28 * 28) best = HOVER; }   // держим подсказку, пока мышь рядом, — без мигания
    if (best !== HOVER) { HOVER = best; HT0 = NOW; } document.body.style.cursor = best ? 'pointer' : 'default';
    const h = best && HIT.find(q => q.c === best); HPOS = h ? [h.x, h.y] : null; }
  // подсказка рисуется на холсте поверх сцены
  function arcText(g, s, x, y, r, mid, top) { let tot = 0; const ws = [...s].map(ch => { const w = g.measureText(ch).width + 2.2; tot += w; return w; }); let a = mid - (top ? 1 : -1) * tot / r / 2;
    [...s].forEach((ch, i) => { const aa = a + (top ? 1 : -1) * ws[i] / r / 2; g.save(); g.translate(x + Math.cos(aa) * r, y + Math.sin(aa) * r); g.rotate(aa + (top ? Math.PI / 2 : -Math.PI / 2)); g.fillText(ch, 0, 0); g.restore(); a += (top ? 1 : -1) * ws[i] / r; }); }
  function drawTipFx(g, W, s0) { NOW = s0; if (!HOVER) return; const h = HIT.find(q => q.c === HOVER); if (!h) return; const x = h.x, y = h.y, c = HOVER, col = TCOL[c.g], dt = s0 - HT0, e = ease(clamp(dt / .45));
    const f = c.f, m = c.m, cp = capS(f), gn = GRP[GI[c.g]].name, nm = c.nm + (f.top ? ' ✦' : ''), ms = m ? '×' + fmtM(m) : ''; g.save();
    { const r = 34 * e + 4; g.fillStyle = `rgba(4,5,12,${.55 * e})`; const bg = g.createRadialGradient(x, y, r * .3, x, y, r * 2.3); bg.addColorStop(0, `rgba(4,5,12,${.6 * e})`); bg.addColorStop(1, 'rgba(4,5,12,0)'); g.fillStyle = bg; g.fillRect(x - r * 2.4, y - r * 2.4, r * 4.8, r * 4.8);
      g.setLineDash([2, 4]); g.lineDashOffset = -s0 * 10; g.strokeStyle = `rgba(${col},.8)`; g.lineWidth = .8; g.beginPath(); g.arc(x, y, r, 0, TAU); g.stroke(); g.setLineDash([]);
      g.strokeStyle = `rgba(150,200,255,${.25 * e})`; g.beginPath(); g.ellipse(x, y, r * 1.5, r * .5, -.35 + s0 * .05, 0, TAU); g.stroke();
      const sa = s0 * 1.3, sx = x + Math.cos(sa) * r, sy = y + Math.sin(sa) * r, sg = g.createRadialGradient(sx, sy, 0, sx, sy, 7); sg.addColorStop(0, `rgba(${col},1)`); sg.addColorStop(1, `rgba(${col},0)`); g.fillStyle = sg; g.fillRect(sx - 7, sy - 7, 14, 14);
      g.globalAlpha = e; g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `300 13px ${TF}`; arcText(g, nm, x, y, r + 9, -Math.PI / 2, true);
      g.font = `300 7.5px ${TF}`; g.fillStyle = `rgba(${col},.95)`; arcText(g, gn, x, y, r + 9, Math.PI / 2, false);
      g.strokeStyle = `rgba(${col},.6)`; g.lineWidth = .7; g.textBaseline = 'alphabetic';
      if (ms) { g.beginPath(); g.moveTo(x + r + 4, y); g.lineTo(x + r + 22, y); g.stroke(); g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = `200 20px ${TF}`; g.fillText(ms, x + r + 26, y + 7); g.font = `300 7px ${TF}`; g.fillStyle = 'rgba(200,215,255,.6)'; g.fillText('ОТ ДНА', x + r + 27, y + 17); }
      if (cp) { g.beginPath(); g.moveTo(x - r - 4, y); g.lineTo(x - r - 22, y); g.stroke(); g.textAlign = 'right'; g.fillStyle = 'rgba(235,240,255,.9)'; g.font = `300 11px ${TF}`; g.fillText(cp, x - r - 26, y + 4); g.font = `300 7px ${TF}`; g.fillStyle = 'rgba(200,215,255,.6)'; g.fillText('КАПИТАЛИЗАЦИЯ', x - r - 26, y + 14);
        const v = +f.v2c; if (v > 0) { g.fillStyle = 'rgba(235,240,255,.9)'; g.font = `300 11px ${TF}`; g.fillText(v >= 3 ? '×' + (v >= 10 ? Math.round(v) : v.toFixed(1).replace('.', ',')) : (v < .1 ? (v * 100).toFixed(1).replace('.', ',') : Math.round(v * 100)) + '%', x - r - 26, y + 30); g.font = `300 7px ${TF}`; g.fillStyle = 'rgba(200,215,255,.6)'; g.fillText('ОБОРОТ К КАПЕ', x - r - 26, y + 40); } } }   /* 27.10 владелец: «здесь нужно показывать оборот к капитализации тоже» — f.v2c из fast_state: оборот фьючерсов за прошлые сутки UTC к капе; ≥ ×3 — разы, ниже — % (как в очереди index.html) */
    g.restore(); }
  // HUD: точечная сетка, уголки, красные треугольники, подписи слоёв
  function hudGrid(g, W, H, a = .07) { g.fillStyle = `rgba(200,210,230,${a})`; for (let x = 24; x < W; x += 34) for (let y = 24; y < H; y += 34) g.fillRect(x, y, 1, 1); }
  function hudCross(g, x, y, s = 7, a = .4) { g.strokeStyle = `rgba(220,228,240,${a})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + s, y); g.moveTo(x, y - s); g.lineTo(x, y + s); g.stroke(); }
  function hudTri(g, x, y, s, rot, a) { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = `rgba(230,40,50,${a})`; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * .87, s * .5); g.lineTo(-s * .87, s * .5); g.closePath(); g.fill(); g.restore(); }
  function hudLabel(g, x, y, title, num, sub, align = 'left', red = true) {   // как «DEEP WEB · 19 …» на образце
    g.save(); g.textAlign = align; g.textBaseline = 'alphabetic'; g.font = '300 15px "Avenir Next", Futura, sans-serif'; try { g.letterSpacing = '3px'; } catch (e) {}
    const tw = g.measureText(title).width; g.fillStyle = 'rgba(235,240,248,.92)'; g.fillText(title, x, y);
    const nx = align === 'left' ? x + tw + 12 : x + 12; g.textAlign = 'left'; g.font = '200 22px "Avenir Next", Futura, sans-serif'; try { g.letterSpacing = '1px'; } catch (e) {} g.fillStyle = red ? 'rgba(255,90,90,.95)' : 'rgba(160,220,255,.95)'; g.fillText(num, nx, y + 1);
    if (sub) { g.font = '400 7px "Avenir Next", Futura, sans-serif'; try { g.letterSpacing = '2px'; } catch (e) {} g.fillStyle = 'rgba(220,228,240,.55)'; g.fillText(sub, nx + g.measureText(num).width + 26, y - 6); }
    g.restore(); }
  function fitCanvas(cv) { const d = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d); cv.style.width = W + 'px'; cv.style.height = H + 'px'; const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); return { W, H, g }; }

  // 2. ГАЛАКТИКА: спираль из частиц, монеты — звёзды; ядро — «идёт сейчас», внутреннее кольцо — «скоро», дальше «шевелятся», рукава — «остальные»
  const cv = document.getElementById('cv'); let S = fitCanvas(cv), G = {};
  function build() { const { W, H } = S, R = Math.min(W * .42, H * .78), P = [];
    for (let i = 0; i < 5200; i++) { const arm = i % 2, q = Math.pow(rnd(1, i), .75), sc = (rnd(2, i) + rnd(3, i) + rnd(4, i) - 1.5) * .42 * (1 - q * .45);
      P.push({ r: q * R, a: arm * Math.PI + q * 5.6 + sc, s: .6 + rnd(5, i) * 1.3, b: .25 + rnd(6, i) * .65 * (1 - q * .5), w: rnd(7, i) }); }
    for (let i = 0; i < 2000; i++) { const q = Math.pow(rnd(8, i), 2) * .32; P.push({ r: q * R, a: rnd(9, i) * TAU, s: .7 + rnd(10, i), b: .5 + rnd(11, i) * .5, w: rnd(12, i) }); }   // балдж
    G = { W, H, R, P, cx: W * .5, cy: H * .52 }; }
  addEventListener('resize', () => { S = fitCanvas(cv); build(); }); build();
  const RAD = { go: [.03, .09], soon: [.18, .26], stir: [.36, .48], rest: [.58, .86] }, COL = { go: '255,250,235', soon: '200,225,255', stir: '255,170,180', rest: '255,90,95' }, SZ = { go: 3.4, soon: 2.6, stir: 2.2, rest: 1.9 };
  const TILT = .42, INC = -.22, proj = (r, a) => { const x = r * Math.cos(a), y = r * Math.sin(a) * TILT, c = Math.cos(INC), s = Math.sin(INC); return [G.cx + x * c - y * s, G.cy + x * s + y * c]; };
  // 27.10 владелец: «скопления тех что идёт рисовать где-то в галактике» — «на ходу» не в ядре, а на рукавах спирали, по очереди на обоих, вращаются вместе с рукавами
  function goPos(c, t) { const n = Math.max(1, BY.go.length), q = .3 + .45 * (c.i + .5) / n + (rnd(c.seed, 3) - .5) * .05; return proj(q * G.R, (c.i % 2) * Math.PI + q * 5.6 + (rnd(c.seed, 4) - .5) * .15 + t / 1000 * .03); }
  function coinPos(c, t) { if (c.g === 'go') return goPos(c, t); const rr = RAD[c.g], n = BY[c.g].length, q = rr[0] + (rr[1] - rr[0]) * rnd(c.seed, 3), rot = t / 1000 * .03; return proj(q * G.R, c.seed * TAU + (n ? c.i / n * TAU * .15 : 0) + rot * (1.4 - q)); }
  function star(g, x, y, s, rgb, a) { const gl = g.createRadialGradient(x, y, 0, x, y, s * 6); gl.addColorStop(0, `rgba(${rgb},${.9 * a})`); gl.addColorStop(.25, `rgba(${rgb},${.3 * a})`); gl.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gl; g.fillRect(x - s * 6, y - s * 6, s * 12, s * 12);
    g.strokeStyle = `rgba(${rgb},${.5 * a})`; g.lineWidth = .3; g.beginPath(); g.moveTo(x - s * 5, y); g.lineTo(x + s * 5, y); g.moveTo(x, y - s * 5); g.lineTo(x, y + s * 5); g.stroke(); g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(x, y, s * .6, 0, TAU); g.fill(); }
  const dot = rgb => { const c = document.createElement('canvas'); c.width = c.height = 16; const k = c.getContext('2d'), q = k.createRadialGradient(8, 8, 0, 8, 8, 8); q.addColorStop(0, `rgba(${rgb},1)`); q.addColorStop(.35, `rgba(${rgb},.55)`); q.addColorStop(1, `rgba(${rgb},0)`); k.fillStyle = q; k.fillRect(0, 0, 16, 16); return c; };
  const DOT_W = dot('225,232,255'), DOT_R = dot('255,170,175');   // круглые мягкие звёзды

  // планета в правом нижнем углу: тело и полосы рисуются один раз в слой, каждый кадр — только дыхание атмосферы и луна
  let PLN = null;
  function planetLayer(W, H) { const d = Math.min(devicePixelRatio || 1, 2), c = document.createElement('canvas'); c.width = Math.round(W * d); c.height = Math.round(H * d); const k = c.getContext('2d'); k.setTransform(d, 0, 0, d, 0, 0);
    const R = Math.min(W, H) * .62, px = W + R * .38, py = H + R * .34, lx = -.62, ly = -.55;   // центр за углом; свет со стороны ядра галактики
    let q = k.createRadialGradient(px, py, R * .96, px, py, R * 1.22); q.addColorStop(0, 'rgba(255,90,80,.30)'); q.addColorStop(.35, 'rgba(220,50,70,.10)'); q.addColorStop(1, 'rgba(160,30,60,0)'); k.fillStyle = q; k.beginPath(); k.arc(px, py, R * 1.22, 0, TAU); k.fill();   // атмосфера
    k.save(); k.beginPath(); k.arc(px, py, R, 0, TAU); k.clip();
    q = k.createRadialGradient(px + lx * R * .55, py + ly * R * .55, R * .05, px, py, R * 1.05); q.addColorStop(0, '#d2473f'); q.addColorStop(.45, '#7d1c24'); q.addColorStop(.8, '#2c0910'); q.addColorStop(1, '#12040a'); k.fillStyle = q; k.fillRect(px - R, py - R, R * 2, R * 2);
    for (let i = 0; i < 26; i++) { const y = py - R + (i + .5) * (R * 2 / 26) + Math.sin(i * 2.3) * 6, a = .025 + .05 * Math.abs(Math.sin(i * 1.7)), wv = 5 + 9 * Math.sin(i * .9); k.strokeStyle = i % 3 ? `rgba(255,150,120,${a})` : `rgba(40,5,10,${a * 1.8})`; k.lineWidth = 8 + (i * 7) % 16; k.lineCap = 'round'; k.beginPath();
      for (let x = px - R; x <= px + R; x += 12) { const yy = y + Math.sin(x / 70 + i) * wv; x === px - R ? k.moveTo(x, yy) : k.lineTo(x, yy); } k.stroke(); }   // полосы облаков
    for (let i = 0; i < 3; i++) { const sx = px - R * (.55 - i * .12), sy = py - R * (.62 - i * .2); q = k.createRadialGradient(sx, sy, 0, sx, sy, R * .09); q.addColorStop(0, 'rgba(255,190,150,.35)'); q.addColorStop(1, 'rgba(255,190,150,0)'); k.fillStyle = q; k.beginPath(); k.ellipse(sx, sy, R * .12, R * .05, -.3, 0, TAU); k.fill(); }   // вихри
    q = k.createRadialGradient(px - lx * R * .6, py - ly * R * .6, R * .2, px - lx * R * .3, py - ly * R * .3, R * 1.2); q.addColorStop(0, 'rgba(0,0,0,.75)'); q.addColorStop(.6, 'rgba(0,0,0,.35)'); q.addColorStop(1, 'rgba(0,0,0,0)'); k.fillStyle = q; k.fillRect(px - R, py - R, R * 2, R * 2);   // тень
    k.restore();
    k.strokeStyle = 'rgba(255,200,180,.55)'; k.lineWidth = 1.2; k.beginPath(); k.arc(px, py, R, Math.PI * 1.08, Math.PI * 1.42); k.stroke();   // светлый край со стороны ядра
    return { c, px, py, R }; }
  function drawPlanet(g, W, H, s0) { if (!W || !H) return;   // окно нулевого размера — пропуск, иначе drawImage падает и анимация встаёт
    if (!PLN || PLN.W !== W || PLN.H !== H) { PLN = planetLayer(W, H); PLN.W = W; PLN.H = H; } const { c, px, py, R } = PLN;
    g.save(); g.globalAlpha = .9 + .1 * Math.sin(s0 * .8); g.drawImage(c, 0, 0, W, H); g.restore();
    g.save(); g.translate(px, py); g.lineCap = 'butt';   // 27.10 владелец: «именно кольца сами» задвигать — каждое кольцо покачивается в своём ритме, по нему скользит отлив
    // 27.10 владелец: «кольца как из кусков» — кольцо целое: задняя половина прячется за планетой по её краю, передняя идёт поверх; отлив — один гладкий мазок с плавной яркостью
    [[1.3, .45], [1.36, .25], [1.44, .4], [1.5, .18]].forEach(([k, a], n) => { const tl = .42 + .045 * Math.sin(s0 * .22 + n * 1.7), fl = .22 + .025 * Math.sin(s0 * .3 + n * 2.3), rr = R * k * (1 + .006 * Math.sin(s0 * .5 + n));
      const u = ((s0 / 9 - n * .035) % 1 + 1) % 1, h0 = Math.PI * (.3 + 1.4 * u), e = Math.min(1, u * 5, (1 - u) * 5);
      const pa = t => Math.atan2(fl * Math.sin(t), Math.cos(t)), st0 = pa(h0 - Math.PI * .3);   // отлив одним мазком: конический градиент по углу эллипса, яркость нарастает и спадает плавно
      let sh = null; if (g.createConicGradient && e > .01) { sh = g.createConicGradient(st0, 0, 0); sh.addColorStop(0, 'rgba(255,228,210,0)');
        for (let q = 1; q < 24; q++) { const t = h0 - Math.PI * .3 + q * Math.PI * .6 / 24, w = Math.exp(-(((t - h0) / (Math.PI * .1)) ** 2)) * e; sh.addColorStop(Math.min(.999, ((pa(t) - st0) % TAU + TAU) % TAU / TAU), `rgba(255,228,210,${.6 * w * a / .45})`); }
        sh.addColorStop(1, 'rgba(255,228,210,0)'); }
      const pass = back => { g.strokeStyle = `rgba(255,185,165,${a})`; g.lineWidth = .7; g.beginPath(); g.ellipse(0, 0, rr, rr * fl, 0, back ? Math.PI : 0, back ? TAU : Math.PI); g.stroke();
        if (sh) { g.globalCompositeOperation = 'lighter'; g.lineWidth = 1.6; g.strokeStyle = sh; g.beginPath(); g.ellipse(0, 0, rr, rr * fl, 0, back ? Math.PI : 0, back ? TAU : Math.PI); g.stroke(); }
        g.globalCompositeOperation = 'source-over'; };
      g.save(); g.rotate(tl); g.save(); g.beginPath(); g.rect(-R * 3, -R * 3, R * 6, R * 6); g.arc(0, 0, R, 0, TAU); g.clip('evenodd'); pass(true); g.restore(); pass(false); g.restore(); });

    // 27.10 владелец: «слева не надо эти надписи» — легенду групп и подпись «ИЗБРАННОЕ» убрал
    // 27.10 владелец: «эти крестики убери» — крестики по углам сняты
