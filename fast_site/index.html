<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Быстрый бот · Crypto Orbit</title>
<style>
  :root { --dim: rgba(150,185,225,.55); --txt: #cfe2f7; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--txt);
    background: radial-gradient(ellipse at 50% 55%, #0a1b31 0%, #050e1c 55%, #02060d 100%);
    font-family: "DIN Alternate", "DIN Condensed", "Eurostile", "Bahnschrift", "Helvetica Neue", Arial, sans-serif;
  }
  #c, #tx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #c { filter: blur(.7px); }   /* soft graphics layer; texts live on #tx and stay sharp */
  .hud { position: fixed; inset: 0; pointer-events: none; text-transform: uppercase; letter-spacing: .16em; }
  .top { position: absolute; top: 20px; left: 0; right: 0; text-align: center; }
  .top small { display: block; font-size: 9px; color: var(--dim); }
  .top h1 { margin: 10px 0 0; font-weight: 300; font-size: 22px; letter-spacing: .34em; color: #e8f2ff; }
  .btns { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 0 16px; }
  .btns span { font-size: 11px; padding: 9px 14px; border: 1px solid rgba(140,175,215,.15); color: rgba(150,180,215,.25); }
  .btns span.on { border-color: rgba(190,215,245,.7); color: #e8f2ff; }
  .btns span.exit { margin-left: 18px; border-color: rgba(190,215,245,.5); color: #cfe2f7; }
  @media (max-width: 760px) { .btns span:not(.on):not(.exit) { display: none; } .top h1 { font-size: 16px; } }
  /* coin summary card — 28.09 дизайн владельца «shatter» (crypto_card_shatter_fixed): стили ниже, под #card */
  .veil {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease;
    background:
      radial-gradient(ellipse 60% 70% at 50% 0%, rgba(var(--ac,120,180,255),.14), transparent 70%),
      radial-gradient(ellipse at 50% 50%, rgba(2,6,13,.78) 0%, rgba(2,6,13,.45) 60%, rgba(2,6,13,.25) 100%);
  }
  .veil.on { opacity: 1; }
  /* futuristic type: geometric Futura for words (wide tracking, caps), ultralight tabular digits for numbers */
  :root { --ff-disp: "Futura", "Avenir Next", "Century Gothic", sans-serif; --ff-num: "Helvetica Neue", "Avenir Next", Arial, sans-serif; }
  .top h1 { font-family: var(--ff-disp); font-weight: 500; letter-spacing: .55em; }
  .top small { font-family: var(--ff-disp); letter-spacing: .3em; }
  .btns { gap: 10px; }
  .btns span { font-family: var(--ff-disp); font-size: 10px; letter-spacing: .18em; padding: 8px 12px; white-space: nowrap; }
  @media (max-width: 980px) { .btns span:not(.on):not(.exit) { display: none; } }

  /* ── КАРТОЧКА «SHATTER» (28.09 владелец): кристалл рассыпается в луч, стеклянный блок графика, показатели на осколках ── */
  #card {
    --ac: 120,200,255;
    position: fixed; left: 50%; top: 50%; width: 1200px; height: 660px; overflow: hidden; color: #eef4ff; font-family: var(--ff-num);
    transform: translate(-50%,-50%) scale(calc(var(--sc, 1) * .96)); opacity: 0; pointer-events: none;
    transition: opacity .6s ease, transform .8s cubic-bezier(.2,.8,.2,1);
    /* no frame: edges fade into the page */
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 96%, transparent), linear-gradient(180deg, transparent, #000 9%, #000 90%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent, #000 9%, #000 96%, transparent), linear-gradient(180deg, transparent, #000 9%, #000 90%, transparent);
    mask-composite: intersect;
  }
  #card.on { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(var(--sc, 1)); }
  #card #scene { position: absolute; inset: 0; width: 1200px; height: 660px; cursor: pointer; }
  #card .left { position: absolute; left: 118px; top: 40px; pointer-events: none; }
  #card .orbit { font-family: var(--ff-disp); font-size: 6.44px; letter-spacing: .45em; color: rgba(var(--ac),.85); }
  #card .ticker {
    margin-top: 7.2px; font-family: var(--ff-disp); font-weight: 500; font-size: 37.18px; letter-spacing: .14em; line-height: 1; color: #fff;
    text-shadow: 0 0 20px rgba(var(--ac),.95), 0 0 60px rgba(var(--ac),.6);
  }
  #card .ticker { display: inline-block; }   /* 30.09: клик по названию убран — Coinglass только по значку в карточке */
  /* 28.09 владелец «а где сама позиция лонг-шорт??» — сторона крупно рядом с названием */
  #card .tline { display: flex; align-items: baseline; gap: 16px; }
  #card .side { font-family: var(--ff-disp); font-weight: 500; font-size: 17px; letter-spacing: .22em; white-space: nowrap; pointer-events: none;
    text-shadow: 0 0 3px rgba(0,4,12,.95), 0 0 14px currentColor; }
  #card .side.long { color: #7af2c0; }
  /* 28.09 владелец: «сделай иконки TradingView и Coinglass — обе на Binance» */
  #card .links { display: flex; gap: 10px; align-self: center; pointer-events: auto; }
  #card .links a { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    background: rgba(var(--ac),.12); border: 1px solid rgba(var(--ac),.4); box-shadow: 0 0 14px rgba(var(--ac),.25); transition: transform .2s, box-shadow .2s; }
  #card .links a:hover { transform: scale(1.08); box-shadow: 0 0 22px rgba(var(--ac),.6); }
  #card .links svg { width: 18px; height: 18px; fill: #fff; stroke: #fff; filter: drop-shadow(0 0 3px rgba(0,4,12,.9)); }
  #card .links svg path { stroke: none; }
  #card .side.short { color: #ff8a9c; }
  #card .side small { display: block; margin-top: 2px; font-size: 6.5px; letter-spacing: .3em; color: rgba(255,255,255,.75); text-shadow: 0 0 3px rgba(0,4,12,.95); }
  #card .mode { margin: 2.9px 0 0 4.3px; font-family: var(--ff-disp); font-style: italic; font-size: 9.29px; letter-spacing: .34em; color: rgb(var(--ac)); text-shadow: 0 0 12px rgba(var(--ac),.8); }
  #card .pill {
    margin-top: 11.4px; display: inline-flex; align-items: center; gap: 6.5px; padding: 4.4px 11px; border-radius: 999px; max-width: 420px;
    font-family: var(--ff-disp); font-size: 6.08px; letter-spacing: .2em; text-transform: uppercase; color: rgba(240,246,255,.92);
    background: rgba(var(--ac),.1); border: 1px solid rgba(var(--ac),.35); box-shadow: 0 0 20px rgba(var(--ac),.2);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #card .pill i { flex: none; width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--ac)); box-shadow: 0 0 10px rgb(var(--ac)); animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #card .now { position: absolute; left: 118px; bottom: 40px; pointer-events: none; }
  #card .now small { display: block; font-family: var(--ff-disp); font-size: 5.72px; letter-spacing: .4em; color: rgba(var(--ac),.8); }
  #card .now span { display: block; margin-top: 2.9px; font-family: var(--ff-num); font-weight: 100; font-size: 28.6px; letter-spacing: .03em; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(var(--ac),.8); }
  #card .hint { position: absolute; left: 118px; bottom: 18px; font-family: var(--ff-disp); font-size: 5.37px; letter-spacing: .3em; color: rgba(255,255,255,.3); text-transform: uppercase; pointer-events: none; }
  #card .panel { position: absolute; inset: 0; pointer-events: none; perspective: 1100px; perspective-origin: 900px 380px; }
  #card .glass {
    position: absolute; left: 662px; top: 172px; width: 500px; box-sizing: border-box; padding: 10px 10px 8px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(8,20,48,.45), rgba(3,9,24,.66));
    backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 0 40px rgba(var(--ac),.1), 0 30px 60px rgba(0,0,0,.4);
  }
  #card .shine {
    position: absolute; left: -30px; right: -30px; top: -15px; height: 30px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  #card .shine::before {
    content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(var(--ac),.95) 0%, rgba(190,140,255,.95) 16%, #fff 30%, rgba(90,240,255,1) 44%,
      rgba(120,255,210,.95) 58%, rgba(var(--ac),.95) 72%, rgba(190,140,255,.9) 86%, rgba(var(--ac),.95) 100%);
    background-size: 220% 100%; animation: iris 9s ease-in-out infinite alternate;
    box-shadow: 0 0 6px rgba(255,255,255,.6), 0 0 14px rgba(var(--ac),.95), 0 0 30px rgba(var(--ac),.55);
  }
  #card .shine::after {
    content: ""; position: absolute; top: 11px; height: 8px; width: 110px; left: -110px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,1), rgba(255,255,255,0) 70%); filter: blur(1px);
    animation: glint 6s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes iris { from { background-position: 0% 0; } to { background-position: 100% 0; } }
  @keyframes glint { 0% { left: -110px; } 55%, 100% { left: 100%; } }
  #card #cChart { display: block; width: 480px; }
  #card .foot { margin-top: 6px; font-family: var(--ff-disp); font-size: 7px; letter-spacing: .22em; line-height: 1.6; text-transform: uppercase; color: rgba(255,255,255,.85); text-align: center; text-shadow: 0 0 3px rgba(0,4,12,.95), 0 1px 2px rgba(0,4,12,.9); }
  #card .foot b { color: #fff; font-weight: 500; }
  #card .plate { position: absolute; width: var(--w); height: var(--h); }
  #card .plate .fly { width: 100%; height: 100%; animation: flyout 1.8s cubic-bezier(.16,.84,.24,1) var(--d) both; }
  @keyframes flyout {
    from { opacity: 0; transform: translate3d(var(--fx), var(--fy), 0) scale(.15) rotate(-50deg); filter: blur(6px); }
    60% { opacity: 1; filter: blur(0); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }
  #card .plate .drift { width: 100%; height: 100%; animation: sdrift var(--fl) ease-in-out calc(var(--d) + 1.8s) infinite alternate; }
  @keyframes sdrift { from { transform: translate(0, 0) rotate(var(--r0)); } to { transform: translate(var(--dx), -7px) rotate(var(--r1)); } }
  #card .plate .body { --st: var(--ac); position: relative; width: 100%; height: 100%; display: grid; place-content: center; text-align: center; }
  #card .plate .body.up { --st: 110,240,180; }
  #card .plate .body.dn { --st: 255,110,130; }
  @keyframes jitter {
    0%   { transform: translate(0, 0) rotate(0); }
    17%  { transform: translate(.6px, -.4px) rotate(.3deg); }
    33%  { transform: translate(-.5px, .5px) rotate(-.25deg); }
    50%  { transform: translate(.4px, .6px) rotate(.2deg); }
    67%  { transform: translate(-.6px, -.3px) rotate(-.3deg); }
    83%  { transform: translate(.3px, -.6px) rotate(.15deg); }
    100% { transform: translate(0, 0) rotate(0); }
  }
  #card .plate svg.cluster { position: absolute; left: -40px; top: -40px; overflow: visible; filter: drop-shadow(0 0 4px rgba(var(--st),.55)); }
  #card .plate svg.cluster .sh { transform-box: fill-box; transform-origin: center; animation: jitter 8s ease-in-out infinite; }
  #card .plate .ct { position: relative; max-width: 204px; isolation: isolate; }
  #card .plate .ct::before {
    content: ""; position: absolute; inset: -12px -18px; z-index: -1; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(2,6,16,.8), rgba(2,6,16,.35) 55%, rgba(2,6,16,0) 75%);   /* 28.09 «небольшое затемнение ко всем текстам на стёклах» */
  }
  #card .plate small { display: block; font-family: var(--ff-disp); font-size: 7.8px; letter-spacing: .3em; text-transform: uppercase; color: #fff; text-shadow: 0 0 3px rgba(0,4,12,.95), 0 1px 2px rgba(0,4,12,.9), 0 0 6px rgba(var(--ac),.6); }   /* 28.09 «мелкие надписи на стёклах — белым», с затемнением */
  #card .plate b { display: block; margin-top: 3px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 300; font-size: 11px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 0 8px rgba(var(--ac),.8); }
  #card .plate b.up { color: #9af7cf; text-shadow: 0 0 12px rgba(110,240,180,.6); }
  #card .plate b.dn { color: #ffa3ae; text-shadow: 0 0 12px rgba(255,110,130,.55); }
  #card .plate b .tx { font-family: var(--ff-disp); font-weight: 400; font-size: 12px; letter-spacing: .08em; text-shadow: 0 0 3px rgba(0,4,12,.95), 0 1px 2px rgba(0,4,12,.9); }
  #card .now span svg { display: block; overflow: visible; color: #fff; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 7px rgba(var(--ac),.9)); }
  #card .plate b svg { display: block; margin: 2px auto 1px; overflow: visible; filter: drop-shadow(0 0 2px rgba(0,4,12,.95)) drop-shadow(0 0 1.2px currentColor) drop-shadow(0 0 4px rgba(var(--ac),.85)); }
  #card .plate em { display: block; margin-top: 2px; font-style: normal; font-family: var(--ff-disp); font-size: 7.8px; line-height: 1.3; letter-spacing: .04em; color: rgba(255,255,255,.9); text-shadow: 0 0 3px rgba(0,4,12,.95), 0 1px 2px rgba(0,4,12,.9); }
  /* ---------- click panel (left zone): crystal + price line + glowing markers, bare text ---------- */
  .pz { --ac: 160,210,255; position: fixed; z-index: 3; pointer-events: none; opacity: 0; transition: opacity .9s ease; }
  .pz.on { opacity: 1; }
  #pzc { position: absolute; pointer-events: none; }
  .pz-head { position: absolute; left: 2px; top: 0; right: 0; }
  .pz-orbit { font-family: Futura, "Avenir Next", sans-serif; font-size: 8px; letter-spacing: .45em; color: rgba(var(--ac),.85); text-transform: uppercase; }
  .pz-tick { margin-top: 6px; display: flex; align-items: baseline; gap: 12px; }
  .pz-tick b { font-family: Futura, "Avenir Next", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .14em; line-height: 1; color: #fff;
    text-shadow: 0 0 18px rgba(var(--ac),.95), 0 0 50px rgba(var(--ac),.55); }
  .pz-tick span { font-family: Futura, "Avenir Next", sans-serif; font-size: 11px; letter-spacing: .32em; }
  .pz .up { color: #8ff5c8; text-shadow: 0 0 12px rgba(110,240,180,.7); }
  .pz .dn { color: #ff8d9a; text-shadow: 0 0 12px rgba(255,110,130,.7); }
  .pz-sub { margin-top: 10px; font-family: Futura, "Avenir Next", sans-serif; font-size: 8.4px; font-weight: 500; line-height: 1.75; letter-spacing: .1em; text-transform: uppercase; color: rgba(238,245,255,.97); text-shadow: 0 0 5px rgba(2,8,20,1), 0 0 12px rgba(2,8,20,.95), 0 1px 2px rgba(0,0,0,.9); }   /* 04.10 «текст не читается»: крупнее, ярче, тёмный ореол от осколков */
  .pz-times { margin-top: 8px; }   /* вход → выход прямо под названием */
  .pz-list { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; line-height: 1.4; }   /* остальное — списком: название слева приглушённо, значение ярко */
  .pz-list .r { display: flex; gap: 12px; align-items: baseline; }
  .pz-list .r > i { flex: 0 0 9.5em; }
  .pz-list.side { position: absolute; top: 20px; margin: 0; text-align: left; align-items: flex-start; gap: 9px; }   /* 04.10 владелец: «цель и стоп перенесём вправо» — колонка справа от названия и значков */
  .pz-list.side .r { display: block; max-width: 100%; }
  .pz-list.side .r > i { display: block; flex: none; margin-bottom: 2px; font-size: 7.6px; letter-spacing: .16em; }
  .pz-list.side .r > span { display: block; line-height: 1.5; }
  .pz-list .r.wide { display: block; line-height: 1.55; }   /* длинное пояснение — обычной строкой с переносом */
  .pz-list .r.wide > i { display: inline; }
  .pz-sub i { font-style: normal; color: rgba(150,200,245,.8); }
  .pz-sub i.k { color: rgba(190,225,255,.95); font-weight: 700; text-shadow: 0 0 5px rgba(2,8,20,1), 0 0 11px rgba(var(--ac),.65); }
  .pz-sub u { text-decoration: none; margin: 0 .55em; color: rgb(var(--ac)); text-shadow: 0 0 6px rgba(var(--ac),.95), 0 0 12px rgba(var(--ac),.6); }
  .pz-sub b { color: #fff; font-weight: 700; text-shadow: 0 0 5px rgba(2,8,20,1), 0 0 10px rgba(var(--ac),.5); }
  .pz-sub b.up { color: #8ff5c8; text-shadow: 0 0 5px rgba(2,8,20,1), 0 0 10px rgba(110,240,180,.55); }
  .pz-sub b.dn { color: #ff8d9a; text-shadow: 0 0 5px rgba(2,8,20,1), 0 0 10px rgba(255,110,130,.55); }
  .pz-links { display: flex; gap: 8px; align-self: center; margin-left: 6px; pointer-events: auto; }
  .pz-links a { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.28), rgba(var(--ac),.14) 60%, rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 0 14px rgba(var(--ac),.4), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .3s, box-shadow .3s; }
  .pz-links a:hover { transform: scale(1.12); box-shadow: 0 0 22px rgba(var(--ac),.75), inset 0 1px 0 rgba(255,255,255,.5); }
  .pz-links svg { width: 13px; height: 13px; fill: #fff; stroke: #fff; filter: drop-shadow(0 0 3px rgba(var(--ac),.9)); }
  .pz-links svg path { stroke: none; }
  .mk { position: absolute; color: rgb(var(--c)); opacity: 0; animation: mkin .9s ease var(--dl) forwards; transform: translate(14px, -46%); white-space: nowrap; }
  .mk.a { transform: translate(-50%, calc(-100% - 12px)); text-align: center; }
  .mk.a svg { margin-left: auto; margin-right: auto; }
  @keyframes mkin { from { opacity: 0; filter: blur(4px); } to { opacity: 1; filter: blur(0); } }
  .mk small { display: block; font-family: Futura, "Avenir Next", sans-serif; font-size: 7px; letter-spacing: .36em; color: rgb(var(--c)); text-shadow: 0 0 8px rgb(var(--c)); }
  .mk svg { display: block; margin-top: 4px; overflow: visible; color: #fff; filter: drop-shadow(0 0 1.2px currentColor) drop-shadow(0 0 5px rgb(var(--c))); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="tx"></canvas>
</div>
<div class="hud">
  <div class="top"><small id="status">подключение…</small></div><!-- 03.10 владелец: «вверху убрать надпись crypto orbit» -->
</div>
<div class="pz" id="pz">
  <canvas id="pzc"></canvas>
  <div class="pz-head"><div class="pz-orbit" id="pzOrbit"></div>
    <div class="pz-tick"><b id="pzName"></b><span id="pzDir"></span>
      <span class="pz-links">
        <a id="pzTV" target="_blank" rel="noopener" title="TradingView · Binance"><svg viewBox="0 0 36 28"><path d="M14 22H7V11H2V4h12v18zM28 22h-8L27.1 4H35l-7 18z"/><circle cx="20" cy="8" r="4"/></svg></a>
        <a id="pzCG" target="_blank" rel="noopener" title="Coinglass · Binance"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke-width="3"/><path d="M14 8a6 6 0 1 0 6 6h-6z"/></svg></a>
      </span></div><div class="pz-sub pz-times" id="pzTimes"></div><div class="pz-sub pz-list" id="pzSub"></div></div>
  <div id="pzMarks"></div>
</div>
<div class="veil" id="veil"></div>
<div class="card" id="card">
  <canvas id="scene"></canvas>
  <div class="left">
    <div class="orbit" id="cOrbit"></div>
    <div class="tline"><div class="ticker" id="cTitle"></div><span class="side" id="cSide"></span>
      <span class="links">
        <a id="cTV" target="_blank" rel="noopener" title="TradingView · Binance">
          <svg viewBox="0 0 36 28"><path d="M14 22H7V11H2V4h12v18zM28 22h-8L27.1 4H35l-7 18z"/><circle cx="20" cy="8" r="4"/></svg></a>
        <a id="cCG" target="_blank" rel="noopener" title="Coinglass · Binance">
          <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke-width="3"/><path d="M14 8a6 6 0 1 0 6 6h-6z"/></svg></a>
      </span></div>
    <div class="mode" id="cMode"></div>
    <div class="pill"><i></i><span id="cSub"></span></div>
  </div>
  <div class="now"><small>ЦЕНА СЕЙЧАС</small><span id="cNow"></span></div>
  <div class="hint">клик по кристаллу — следующая монета · клик мимо карточки или esc — закрыть</div>
  <div class="panel">
    <div class="glass">
      <div class="shine"></div>
      <canvas id="cChart"></canvas>
      <div class="foot" id="cFoot"></div>
    </div>
    <div id="cPlates"></div>
  </div>
</div>
<script>
const TAU = Math.PI * 2;
const MIN_LABELS = 10;   // 02.10: потолок подписей (был 15) снят по слову владельца — кольца показывают всё
const ANIM_SLOW = 3;   // appear / disappear speed factor

const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ease = x => 1 - Math.pow(1 - x, 3);

function makeRing(cfg) {
  const parts = [];
  while (parts.length < 4800) {
    const u = Math.random();
    let r;
    if (u < .62) r = .66 + gauss() * .1;
    else if (u < .86) r = .9 + gauss() * .05;
    else r = .46 + Math.random() * .8;
    if (r < .44 || r > 1.28) continue;
    const a = Math.random() * TAU;
    const arm = .5 + .5 * Math.cos(2 * a - r * 8);
    if (Math.random() > .3 + .7 * arm) continue;
    const z = Math.random();
    parts.push({ a, r, s: z < .05 ? 2 : z < .35 ? 1.3 : .8, b: .3 + Math.random() * .7 });
  }
  const markers = [];
  for (let i = 0; i < 14; i++) {
    const z = Math.random();
    markers.push({ a: Math.random() * TAU, r: .5 + Math.random() * .75, t: z < .5 ? 'sq' : z < .75 ? 'A' : 'B' });
  }
  const loops = [];
  for (let i = 0; i < 5; i++) loops.push({ a: Math.random() * TAU, r: .62 + Math.random() * .25, s: .04 + Math.random() * .04 });
  const styles = [];
  for (let i = 0; i <= 20; i++) styles.push(`rgba(${cfg.rgb},${(i / 20).toFixed(3)})`);
  return Object.assign({ parts, markers, loops, styles, labels: [], next: 0, cx: 0, cy: 0, R: 1 }, cfg);
}

function fmtPrice(v) {
  if (v >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 }).replace(/,/g, ' ');
  if (v >= 1) return v.toFixed(2);
  if (v >= .01) return v.toFixed(4);

// blend an "r,g,b" colour towards another
const mix = (c1, c2, k) => { const a = c1.split(',').map(Number), b = c2.split(',').map(Number); return a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(','); };

// each label gets its own accent; avoid repeating the previous one on this ring
function pickColors(g) {
  let i;
  do i = Math.random() * g.palette.length | 0; while (i === g.lastColor && g.palette.length > 1);
  g.lastColor = i;
  const c1 = g.palette[i], c2 = g.palette[(i + 1 + (Math.random() * (g.palette.length - 1) | 0)) % g.palette.length];
  return { c1, c2: mix(c2, c1, .3), cp: mix(c1, '240,248,255', .6) };
}

const omega = (g, r) => g.w * (1.35 - .55 * r);
let RIVL = null;   // 04.10: в режиме «реки» — где на русле стоит рисуемая подпись {x, y}
const ang = (g, a, r, t) => RIVL ? Math.PI / 2 : a + t * omega(g, r);
const proj = (g, a, r) => RIVL ? [RIVL.x, RIVL.y] : [g.cx + Math.cos(a) * r * g.R, g.cy + Math.sin(a) * r * g.R * g.k];

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, innerWidth); H = Math.max(400, innerHeight);
  for (const c of [cv, tcv]) { c.width = W * dpr; c.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 03.10 19:50 владелец (прототип): заголовок убран — кольца выше; подписи вход/выход сбоку — кольца ближе друг к другу; над лентой дня полоса линий доски (LINES_H)
  const top = 34, bot = H - 30 - (W >= 900 ? RIB_H + LINES_H : 0), hh = (bot - top) / 2;   // снизу — лента дня (27.09), кнопок нет
  rings.forEach((g, i) => {                                            // 04.10 владелец: «давай оставим одно кольцо» — оба набора (вход и выход) на одном кольце по центру
    g.cx = W / 2;
    g.R = Math.max(40, Math.min(W * .36, hh * .46 / (1.3 * g.k)));       // 04.10 00:15 владелец: «давай нижний круг только оставим»; 00:20: «только ниже его опусти» —
    g.cy = bot - g.R * g.k * 1.36 - 4;                                   //   кольцо стоит вплотную над строками трёхчасовых блоков
  });
}

// ── ЖИВЫЕ ДАННЫЕ (27.09): монеты колец — из output/fast_state.json по сокету; монета живёт, пока она в данных,
//    и гаснет родным затуханием, когда её нет (вход сработал / позиция закрыта). Новые выходят по одной, как в дизайне.
function spawn(g, t) {
  const it = g.queue.shift();
  if (!it) return;
  const name = it.name;
  // pick the spot whose label box overlaps least with the ones already shown
  const tips = g.labels.map(l => { const [x, y] = proj(g, ang(g, l.a, l.r, t), l.r); return [x, y - l.h]; });
  let best = null, bestD = -1;
  for (let i = 0; i < 40; i++) {
    const r = .58 + Math.random() * .4, sa = Math.random() * TAU, h = (.1 + Math.random() * .16) * g.R;
    const [x, y] = proj(g, sa, r);
    let d = 9;
    for (const [tx, ty] of tips) d = Math.min(d, Math.max(Math.abs(x - tx) / 170, Math.abs(y - h - ty) / 44));
    if (d > bestD) { bestD = d; best = { r, sa, h }; }
    if (d >= 1.1) break;
  }
  g.labels.push({
    ...pickColors(g), name, side: it.side, key: it.key, item: it.item, price: it.price, r: best.r, a: best.sa - t * omega(g, best.r), born: t,
    life: Infinity, h: best.h,
  });
}

function ellipse(g, r, rot = 0, sy = 1) {
  ctx.beginPath();
  ctx.ellipse(g.cx, g.cy, r * g.R, r * g.R * g.k * sy, rot, 0, TAU);
}

// тусклый слой — яркость частицы в тени, яркий — прибавка на свету; сектора: полуширина (рад) и доля яркого слоя, в сумме к центру света ≈ 1
const LIT_WEDGES = [[.5, .35], [1.0, .3], [1.6, .2], [2.2, .15]];
function ringCache(g) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), key = g.R + '|' + dpr;
  if (g.pc && g.pc.key === key) return g.pc;
  const S = Math.ceil(2 * 1.3 * g.R) + 4;
  const mk = Lb => {
    const c = document.createElement('canvas'); c.width = c.height = S * dpr;
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, S / 2 * dpr, S / 2 * dpr);
    for (const p of g.parts) {
      const i = (p.b * Lb * 34) | 0;
      if (i < 1) continue;
      x.fillStyle = g.styles[i > 20 ? 20 : i];
      x.fillRect(Math.cos(p.a) * p.r * g.R, Math.sin(p.a) * p.r * g.R, p.s * 1.15, p.s * 1.15 / Math.sqrt(g.k));
    }
    return c;
  };
  g.pc = { key, S, dim: mk(.32), bright: mk(1.3) };
  return g.pc;
}

function drawRing(g, t) {
  const { cx, cy, R, k } = g;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, k);
  const hz = ctx.createRadialGradient(0, 0, R * .4, 0, 0, R * 1.2);
  hz.addColorStop(0, 'rgba(0,0,0,0)');
  hz.addColorStop(.35, `rgba(${g.rgb},.10)`);
  hz.addColorStop(.6, `rgba(${g.rgb},.04)`);
  hz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hz; ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, TAU); ctx.fill();
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, R * .47);
  core.addColorStop(0, 'rgba(24,38,58,.95)');
  core.addColorStop(.85, 'rgba(12,22,38,.9)');
  core.addColorStop(1, 'rgba(12,22,38,0)');
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, R * .47, 0, TAU); ctx.fill();
  ctx.restore();

  // thin guide orbits
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(${g.rgb},.10)`;
  ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.45, R * .55, -.22, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.25, R * .7, .35, 0, TAU); ctx.stroke();
  ctx.setLineDash([2, 6]); ctx.strokeStyle = `rgba(${g.rgb},.25)`; ellipse(g, 1.3); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = `rgba(${g.rgb},.18)`; ellipse(g, .98); ctx.stroke();
  ctx.strokeStyle = `rgba(${g.rgb},.3)`; ellipse(g, .47); ctx.stroke();
  ctx.strokeStyle = `rgba(${g.rgb},.2)`; ellipse(g, .22); ctx.stroke();

  // spokes
  ctx.strokeStyle = `rgba(${g.rgb},.07)`;
  for (let i = 0; i < 6; i++) {
    const a = i * TAU / 6 + t * .01;
    const [x, y] = proj(g, a, 1.35);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
  }

  // particles — 28.09 владелец: «зачем пересчитывать частицы, сделай просто rotate»: диск частиц рисуется один раз (тусклый и яркий слой),
  // на кадре слой поворачивается целиком; подсветка стоит на месте — яркий слой виден только в секторах вокруг g.light
  ctx.globalCompositeOperation = 'lighter';
  const pc = ringCache(g), th = t * omega(g, .69), S2 = pc.S / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(1, k);
  ctx.save(); ctx.rotate(th); ctx.drawImage(pc.dim, -S2, -S2, pc.S, pc.S); ctx.restore();
  for (const [span, al] of LIT_WEDGES) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, S2, g.light - span, g.light + span); ctx.closePath(); ctx.clip();
    ctx.globalAlpha = al; ctx.rotate(th); ctx.drawImage(pc.bright, -S2, -S2, pc.S, pc.S);
    ctx.restore();
  }
  ctx.restore();

  // outer bright rim
  // rim: faint all round, bright only on the lit arc (stacked arcs fade towards the ends)
  ctx.strokeStyle = `rgba(${g.hot},.16)`; ctx.lineWidth = 1.2; ellipse(g, 1.12); ctx.stroke();
  ctx.shadowColor = `rgba(${g.rgb},1)`; ctx.shadowBlur = 12;
  ctx.lineWidth = 1.6;
  for (let j = 0; j < 6; j++) {
    const span = 1.15 - j * .19;
    ctx.strokeStyle = `rgba(${g.hot},.14)`;
    ctx.beginPath(); ctx.ellipse(cx, cy, 1.12 * R, 1.12 * R * k, 0, g.light - span, g.light + span); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';

  // core
  ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(${g.hot},.8)`; ellipse(g, .1); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = `rgba(${g.hot},.5)`; ellipse(g, .065); ctx.stroke();
  ctx.fillStyle = 'rgba(230,245,255,.9)'; ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);

  // наклонная ось с засечками, буквы A/B и квадратики убраны (28.09 владелец: «непонятные лучи и буквы какие-то»)

  // ring caption
  // над кольцом, по центру (28.09 владелец: «надписи давай вверх перенесём, а то непонятно»)
  // 03.10 19:50 владелец: «над каждым кругом вход/выход можно перенести вбок» — справа от кольца, на уровне центра
  const ty = cy - 4, cxl = cx + R * 1.06 + 18;
  tctx.save(); tctx.textAlign = 'left'; tctx.letterSpacing = '4px';
  tctx.font = `500 11px Futura, "Avenir Next", sans-serif`; tctx.shadowColor = `rgba(${g.hot},.8)`; tctx.shadowBlur = 8; tctx.fillStyle = `rgba(${g.hot},.95)`;
  // 04.10 00:20 владелец: «и уберём надпись справа „выход“» — подпись кольца не рисуется; где вход и где выход, видно по метке у каждой монеты
  tctx.restore();
}

const backOut = p => 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);

// ===== РЕКА (04.10 00:30, владелец: «а может не круг сделаем, а типа реку горизонтально, и пусть сплывают»; 01:00: «вот прям сделай как было кольцо, просто горизонтально,
// один в один всё»; «там синеватый оттенок был, разная яркость, и точек много, и всё чуть двигалось») — кольцо, развёрнутое в горизонтальную полосу: те же 4800 частиц кольца
// (угол → положение по длине, радиус → расстояние от середины полосы, по обе стороны), те же два слоя яркости, те же линии-орбиты, обод со свечением на подсвеченном участке,
// тёмная сердцевина; полоса сдвигается со скоростью вращения кольца. Подписи монет — те же, что на кольце (drawLabel0), стоят на полосе и за 15 минут сплывают слева направо.
// 04.10 01:20, владелец: «только она сильно прямая получилась, как будто не очень на реку похоже», «и полоса по центру какая-то», «сделай появление ближе к центру, иначе когда
// заходишь в монету, наезжает описание на неё» — одно русло без тёмной сердцевины, изгибается и чуть «дышит»; монеты появляются у середины экрана (там же подсвеченный участок)
// и сплывают вправо. RIVER = false возвращает кольцо.
const RIVER = true, RIV_KEEP = 15 * 60, RIV_SL = 4, RIV_START = .42;
function riverGeom() {
  const bot = H - 30 - RIB_H - LINES_H, x0 = 130, x1 = W - 90, hh = clamp((bot - 150) * .15, 38, 70) || 50, amp = hh * .8;
  return { x0, x1, w: x1 - x0, hh, amp, cy: bot - hh * 1.35 - amp - 14 };
}
// середина русла в точке x: две медленные волны
const riverY = (R, x, t) => { const u = (x - R.x0) / R.w; return R.cy + R.amp * (.62 * Math.sin(u * TAU * .9 + .4 + t * .05) + .38 * Math.sin(u * TAU * 1.9 + 1.3 - t * .035)); };
function riverCache(R, g) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), key = Math.round(R.w) + '|' + Math.round(R.hh) + '|' + dpr;
  if (g.rv && g.rv.key === key) return g.rv;
  const Wd = Math.ceil(R.w / RIV_SL) * RIV_SL, Hd = Math.round(R.hh * 2 + 8);
  const mk = Lb => {
    const c = document.createElement('canvas'); c.width = Wd * dpr; c.height = Hd * dpr;
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    g.parts.forEach((p, n) => {
      const i = (p.b * Lb * 34) | 0; if (i < 1) return;
      x.fillStyle = g.styles[i > 20 ? 20 : i];
      x.fillRect(p.a / TAU * Wd, Hd / 2 + (n % 2 ? 1 : -1) * (p.r - .44) / .84 * R.hh, p.s * 1.15, p.s * 1.15);
    });
    return c;
  };
  g.rv = { key, Wd, Hd, dpr, dim: mk(.32), bright: mk(1.3) };
  return g.rv;
}
function drawRiver(t) {
  if (W < 900) return;
  const R = riverGeom(), g = rings[0], nowS = Date.now() / 1000, { x0, x1, w, hh } = R, xl = x0 + w * RIV_START;
  const curve = (v, xa = x0, xb = x1) => { ctx.beginPath(); for (let x = xa; x <= xb + 7; x += 8) { const xx = Math.min(x, xb); ctx.lineTo(xx, riverY(R, xx, t) + v * hh); } ctx.stroke(); };
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, R.cy - R.amp - hh * 1.4 - 14, w, (R.amp + hh * 1.4 + 14) * 2); ctx.clip();
  // дымка вдоль русла
  for (const [lw, al] of [[2.5, .03], [1.7, .035], [.9, .045]]) { ctx.strokeStyle = `rgba(${g.rgb},${al})`; ctx.lineWidth = hh * lw; curve(0); }
  // линии-орбиты: внешняя пунктиром и две внутренние
  ctx.lineWidth = 1;
  const hl = (v, al, dash) => { ctx.strokeStyle = `rgba(${g.rgb},${al})`; ctx.setLineDash(dash || []); curve(v); curve(-v); ctx.setLineDash([]); };
  hl(1.3, .22, [2, 6]); hl(.55, .1);
  // частицы: полоса режется на узкие ломтики, каждый ставится на свою высоту русла; тусклый слой по всей длине, яркий — на подсвеченном участке
  const off = (t * omega(g, .69) / TAU * w) % w;
  ctx.globalCompositeOperation = 'lighter';
  const pc = riverCache(R, g), d = pc.dpr;
  const lit = x => { let s = 0; const dx = Math.abs(x - xl); for (const [span, al] of LIT_WEDGES) if (dx < span / TAU * w) s += al; return s; };
  for (let sx = 0; sx < pc.Wd; sx += RIV_SL) {
    let dx = (sx + off) % pc.Wd; if (dx > w) continue;
    const x = x0 + dx, y = riverY(R, x + RIV_SL / 2, t) - pc.Hd / 2, al = lit(x);
    ctx.drawImage(pc.dim, sx * d, 0, RIV_SL * d, pc.Hd * d, x, y, RIV_SL, pc.Hd);
    if (al > 0) { ctx.globalAlpha = Math.min(1, al); ctx.drawImage(pc.bright, sx * d, 0, RIV_SL * d, pc.Hd * d, x, y, RIV_SL, pc.Hd); ctx.globalAlpha = 1; }
  }
  // берега: тусклые по всей длине, яркие со свечением — на подсвеченном участке
  ctx.strokeStyle = `rgba(${g.hot},.16)`; ctx.lineWidth = 1.2; curve(1.1); curve(-1.1);
  ctx.shadowColor = `rgba(${g.rgb},1)`; ctx.shadowBlur = 12; ctx.lineWidth = 1.6; ctx.strokeStyle = `rgba(${g.hot},.14)`;
  for (let j = 0; j < 6; j++) {
    const hw = (1.15 - j * .19) / TAU * w, xa = Math.max(x0, xl - hw), xb = Math.min(x1, xl + hw);
    curve(1.1, xa, xb); curve(-1.1, xa, xb);
  }
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  // подписи монет — те же, что на кольце
  layoutRiverLabels(R, t, nowS);
  for (const gg of rings) {

function faceBuild(cw, ch, nc, nr) {
  if (!FACE.map) { const s = atob(GIRL_B64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); FACE.map = a; }
  const m = FACE.map, cells = [], cols = [], sx = GIRL_W / nc, sy = GIRL_H / nr;
  const at = (x, y) => m[clamp(y | 0, 0, GIRL_H - 1) * GIRL_W + clamp(x | 0, 0, GIRL_W - 1)];
  for (let i = 0; i < nc; i++) {
    cols.push({ sp: .05 + Math.random() * .09, ph: Math.random(), ph2: Math.random() });   // 04.10 01:10 владелец: «сделай побольше рядов перетекающих» — по две капли на столбец; 01:20: «потоки быстрее, но выглядит, как будто тормозит анимация, давай вернём и как-то плавнее» — скорость прежняя, у капли мягкий передний край и длинный хвост, яркость в 40 ступеней, цвет переходит плавно
    for (let j = 0; j < nr; j++) {
      let v = 0; for (const a of [.25, .75]) for (const b of [.2, .5, .8]) v += at((i + a) * sx, (j + b) * sy);
      v = Math.min(1, v / (6 * 255) * 1.3); if (v < .05) continue;
      cells.push({ x: (i + .5) * cw, y: (j + .5) * ch, v, col: i, yn: j / nr, ph: Math.random() * TAU, tw: .5 + Math.random() * 1.6 });
    }
  }
  return { cells, cols };
}
function faceSprites(g, fs, n = 20) {   // цифры 0 и 1 в 20 ступенях яркости, двух цветов
  const dpr = Math.min(window.devicePixelRatio || 1, 2), sz = Math.ceil(fs) + 3;
  const mk = (rgb, chr, al) => {
    const c = document.createElement('canvas'); c.width = c.height = Math.ceil(sz * dpr);
    const x = c.getContext('2d'); x.scale(dpr, dpr); x.font = `${fs}px Menlo, Consolas, monospace`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = `rgba(${rgb},${al})`; x.fillText(chr, sz / 2, sz / 2 + .5);
    return c;
  };
  return { sz, dim: [0, 1].map(d => Array.from({ length: n + 1 }, (_, i) => mk(g.rgb, '' + d, i / n))), hot: [0, 1].map(d => Array.from({ length: n + 1 }, (_, i) => mk(g.hot, '' + d, i / n))) };
}

const inRect = (h, pad) => mouse.x >= h.x - pad && mouse.x <= h.x + h.w + pad && mouse.y >= h.y - pad && mouse.y <= h.y + h.h + pad;
const overCard = () => false;   // боковая панель кликов не ловит: клик мимо монеты закрывает её

// coin under the cursor: its plate, its wavy leader or its point on the ring
function findHover() {
  if (!mouse || overCard()) return null;
  for (let r = rings.length - 1; r >= 0; r--) {
    for (const l of rings[r].labels) {
      const h = l.hit;
      if (!h) continue;
      if (inRect(h, 4)) return l;
      if (Math.abs(mouse.x - h.ax) < 8 && mouse.y > h.y + h.h - 4 && mouse.y < h.ay + 4) return l;
      if (Math.hypot(mouse.x - h.ax, mouse.y - h.ay) < 12) return l;
    }
  }
  let best = null, bd = 1e9;   // название на ленте (28.09): столбик по часу, строки по 11 px — берём строку, ближайшую к курсору по высоте
  for (const a of RIB.arcs) {
    const h = a.hit; if (!h) continue;
    if (mouse.x < h.x - 2 || mouse.x > h.x + h.w + 2 || mouse.y < h.y - 2 || mouse.y > h.y + h.h + 2) continue;
    const dy = Math.abs(mouse.y - (h.y + h.h / 2));

}

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pctStr = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(v !== 0 && Math.abs(v) < 1 ? 2 : 1) + '%';

function demoDetail(g, l) {
  let seed = Math.round(l.born * 1000);
  for (const c of l.name) seed = seed * 31 + c.charCodeAt(0) | 0;
  const R = rng(seed), gs = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };

  // prices for the text block
  const d = { ring: g.mode };
  if (g.mode === 'entry') {
    d.entry = l.price; d.now = l.price * (1 - (.003 + R() * .015));
    d.left = (d.entry / d.now - 1) * 100;
  } else {
    d.target = l.price; d.entry = l.price / 1.05; d.now = d.entry * (1 + (R() * .04 - .01));
    d.left = (d.target / d.now - 1) * 100;
  }
  d.volPct = 8 + R() * 80 | 0; d.bar = (R() - .4) * .6; d.oi = (R() - .3) * 4; d.funding = (R() - .4) * .02;
  d.status = g.mode === 'entry'
    ? ['кандидат на всплеск · ждём объём', 'кандидат на всплеск · вход открыт', 'кандидат на всплеск · вход закрыт: поздно в сессии'][R() * 3 | 0]
    : 'в позиции · ' + (d.left != null ? 'до цели ещё ' + pctStr(d.left) : 'цели нет: выход по выносу / стопу / сроку');

  // 120 bars of 3m = 6h, with a couple of impulse moves late in the window
  const n = 120, jumps = new Set([70 + R() * 20 | 0, 95 + R() * 15 | 0]);
  let p = 1, cf = 0, cs = 0, oi = 1;
  d.candles = []; d.vol = []; d.cvdF = []; d.cvdS = []; d.oiS = []; d.liqL = []; d.liqS = [];
  for (let i = 0; i < n; i++) {
    const jump = jumps.has(i);
    const r = gs() * .004 + (jump ? .02 + R() * .03 : 0) + .0003;
    const o = p, c = p * (1 + r);
    const hi = Math.max(o, c) * (1 + Math.abs(gs()) * .002), lo = Math.min(o, c) * (1 - Math.abs(gs()) * .002);
    d.candles.push([o, hi, lo, c]); p = c;
    const v = Math.exp(gs() * .5) * (jump ? 6 + R() * 6 : 1);
    d.vol.push(v);
    cf += Math.sign(r) * v * (.5 + R()); cs += Math.sign(r) * v * (jump ? 1.5 : .3) * R();
    oi *= 1 + r * .6 + gs() * .002;
    d.cvdF.push(cf); d.cvdS.push(cs); d.oiS.push(oi);
    d.liqL.push(r < -.006 || (R() < .02) ? v * R() : 0);
    d.liqS.push(jump ? v * (.5 + R()) : 0);
  }
  const k = d.now / p;   // scale the walk so the last close equals the current price
  d.candles = d.candles.map(c => c.map(v => v * k));
  return d;
}

// настоящая карточка: цифры и ряды из fast_state.json (charts: bars [t,o,h,l,c,оборот,CVD], spot, oi 5м, liq [лонги, шорты])
const hmT = s => new Date(s * 1000).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
// 28.09 владелец: «время входа точное — дата, часы, минуты»
const dmhT = s => { const d = new Date(s * 1000); return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ' ' + hmT(s); };
// 28.09 владелец: «сделка 9 минут — не видно ни входа на графике, ни выхода, обе линии выше: график обновился, а не тот, что был на входе».
// У закрытой сделки график — окно вокруг самой сделки (3 ч до входа … 3 ч после выхода, не дальше «сейчас»), берётся с Binance при открытии
// карточки и кэшируется; ликвидации — из нашего потока, где окно с ним совпадает. Вход и выход — вертикали на графике цены.
const TRADE_CH = new Map();
function tradeChart(it, l) {
  const key = it.sym + '|' + Math.round(it.t_in);
  if (TRADE_CH.has(key)) return TRADE_CH.get(key);
  TRADE_CH.set(key, null);                           // запрос ушёл
  const nowMs = Date.now(), t0 = Math.round((it.t_in - 3 * 3600) * 1000), t1 = Math.min(nowMs, Math.round(((it.t_out || nowMs / 1000) + 3 * 3600) * 1000));
  const q = u => fetch(u).then(r => r.ok ? r.json() : []).catch(() => []);
  Promise.all([
    q(`https://fapi.binance.com/fapi/v1/klines?symbol=${it.sym}&interval=3m&startTime=${t0}&endTime=${t1}&limit=1000`),
    q(`https://api.binance.com/api/v3/klines?symbol=${it.sym}&interval=3m&startTime=${t0}&endTime=${t1}&limit=1000`),
    q(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${it.sym}&period=5m&startTime=${t0}&endTime=${t1}&limit=500`),
  ]).then(([k, sk, oi]) => {
    if (!Array.isArray(k) || !k.length) return;
    let cvd = 0, scvd = 0; const spot = {};
    const bars = k.map(x => { const qv = +x[7], tb = +x[10]; cvd += 2 * tb - qv; return [+x[0], +x[1], +x[2], +x[3], +x[4], Math.round(qv), Math.round(cvd)]; });
    if (Array.isArray(sk)) for (const x of sk) { const qv = +x[7], tb = +x[10]; scvd += 2 * tb - qv; spot[+x[0]] = Math.round(scvd); }
    const live = ((window.STATE || {}).charts || {})[it.sym], lq = {};
    if (live && live.liq) live.bars.forEach((b, i) => { lq[b[0]] = live.liq[i]; });
    TRADE_CH.set(key, { bars, spot: sk && sk.length ? bars.map(b => spot[b[0]] != null ? spot[b[0]] : null) : null,
      oi: Array.isArray(oi) ? oi.map(x => [+x.timestamp, Math.round(+x.sumOpenInterestValue)]) : [],
      liq: bars.map(b => lq[b[0]] || [0, 0]), funding: live ? live.funding : null });
    if (selected === l) refreshPanel(l);
  });
  return null;
}

}

function drawCardChart(d, l) {
  const secs = [['цена', 160], ['объём', 34], ['CVD фьюч', 46], ['CVD спот', 46], ['интерес', 46], ['ликвидации', 38]];
  const Wc = 480, Hc = secs.reduce((s, q) => s + q[1], 0), padR = 92;
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * 1.5;
  cChart.width = Wc * dpr; cChart.height = Hc * dpr; cChart.style.height = Hc + 'px';
  const c = cChart.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, Wc, Hc);
  const n = d.candles.length, pw = Wc - padR, bw = pw / n;
  const X = i => i * bw + bw / 2;
  const glow = (col, blur) => { c.shadowColor = col; c.shadowBlur = blur; };
  const noGlow = () => { c.shadowBlur = 0; };

  // glowing line with a fading area under it
  const line = (arr, y0, h, rgb) => {
    const mn = Math.min(...arr), mx = Math.max(...arr), sp = mx - mn || 1;
    const pts = arr.map((v, i) => [X(i), y0 + h - 5 - (v - mn) / sp * (h - 24)]);
    const gr = c.createLinearGradient(0, y0 + 14, 0, y0 + h);
    gr.addColorStop(0, `rgba(${rgb},.22)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
    c.lineTo(pts[n - 1][0], y0 + h); c.lineTo(pts[0][0], y0 + h); c.closePath();
    c.fillStyle = gr; c.fill();
    glow(`rgba(${rgb},.9)`, 8);
    c.strokeStyle = `rgb(${rgb})`; c.lineWidth = 1.3;
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
    noGlow();
    const [lx, ly] = pts[n - 1];
    glow(`rgb(${rgb})`, 10); c.fillStyle = '#fff'; c.beginPath(); c.arc(lx, ly, 2.2, 0, TAU); c.fill(); noGlow();
  };
  const tag = (y, text, rgb, solid) => {
    c.font = `8px ${FONT}`;
    const w = c.measureText(text).width + 8;
    c.fillStyle = solid ? `rgba(${rgb},.9)` : 'rgba(6,12,24,.9)';
    c.fillRect(Wc - padR + 6, y - 8, w, 16);
    c.strokeStyle = `rgba(${rgb},.8)`; c.lineWidth = 1; c.strokeRect(Wc - padR + 6.5, y - 7.5, w - 1, 15);
    c.fillStyle = solid ? '#04101c' : `rgb(${rgb})`; c.textAlign = 'left';
    c.fillText(text, Wc - padR + 11, y + 3.5);
  };

  let y0 = 0;
  secs.forEach(([name, h], si) => {
    // grid
    c.strokeStyle = 'rgba(140,175,220,.05)'; c.lineWidth = 1;
    for (let gx = 0; gx <= pw; gx += pw / 6) { c.beginPath(); c.moveTo(Math.round(gx) + .5, y0 + 2); c.lineTo(Math.round(gx) + .5, y0 + h - 2); c.stroke(); }
    if (si) {
      const sep = c.createLinearGradient(0, 0, Wc, 0);
      sep.addColorStop(0, `rgba(${l.c1},.28)`); sep.addColorStop(1, `rgba(${l.c1},0)`);
      c.strokeStyle = sep; c.beginPath(); c.moveTo(0, y0 + .5); c.lineTo(Wc, y0 + .5); c.stroke();
    }
    c.font = '500 7px Futura, "Avenir Next", sans-serif'; c.textAlign = 'left'; c.letterSpacing = '2.5px';
    c.shadowColor = 'rgba(0,4,12,.95)'; c.shadowBlur = 4; c.fillStyle = '#fff'; c.fillText(name.toUpperCase(), 3, y0 + 14);
    c.shadowColor = `rgba(${l.c1},.8)`; c.shadowBlur = 8;
    c.fillText(name.toUpperCase(), 3, y0 + 14); c.shadowBlur = 0; c.letterSpacing = '0px';

    if (name === 'цена') {
      const levels = [d.entry].concat(d.target ? [d.target] : [], d.stop ? [d.stop] : [], d.exitPx ? [d.exitPx] : []);
      const lo = Math.min(...d.candles.map(q => q[2]), ...levels), hi = Math.max(...d.candles.map(q => q[1]), ...levels), sp = hi - lo || 1;
      const Y = v => y0 + h - 8 - (v - lo) / sp * (h - 30);
      // levels
      const tagYs = [];
      const lvl = (v, rgb, label) => {
        tagYs.push(Y(v));
        c.setLineDash([3, 4]); c.strokeStyle = `rgba(${rgb},.65)`; c.beginPath(); c.moveTo(0, Y(v)); c.lineTo(pw, Y(v)); c.stroke(); c.setLineDash([]);
        tag(Y(v), label + ' ' + fmtPrice(v), rgb, false);
      };
      lvl(d.entry, l.c1, d.ring === 'entry' ? 'ВХОД' : 'ВХ');
      if (d.target) lvl(d.target, '134,240,192', 'ЦЕЛЬ');
      if (d.stop) lvl(d.stop, '240,98,116', 'СТОП');
      if (d.exitPx) lvl(d.exitPx, '235,240,250', 'ВЫХ');
      // вертикали входа и выхода — по времени сделки, если оно в окне графика
      const vt = (t, rgb, lab, al) => {
        if (!t || !d.times || !d.times.length || t * 1000 < d.times[0] || t * 1000 > d.times[n - 1] + 180000) return;
        let i = 0; while (i < n - 1 && d.times[i + 1] <= t * 1000) i++;
        c.setLineDash([2, 3]); c.strokeStyle = `rgba(${rgb},.75)`; c.beginPath(); c.moveTo(X(i), y0 + 16); c.lineTo(X(i), y0 + h - 4); c.stroke(); c.setLineDash([]);
        c.font = `7px ${FONT}`; c.fillStyle = `rgb(${rgb})`; c.textAlign = al; c.fillText(lab, X(i) + (al === 'right' ? -2 : 2), y0 + 13); c.textAlign = 'left';
      };
      vt(d.tIn, l.c1, 'ВХ', 'right'); vt(d.tOut, '235,240,250', 'ВЫХ', 'left');   // подписи в разные стороны — короткая сделка не слипается
      // candles with a soft glow
      d.candles.forEach(([o, hh, ll, cl], i) => {
        const up = cl >= o, col = up ? '111,224,168' : '240,98,116';
        glow(`rgba(${col},.8)`, 5);
        c.strokeStyle = c.fillStyle = `rgb(${col})`;
        c.lineWidth = 1; c.beginPath(); c.moveTo(X(i), Y(hh)); c.lineTo(X(i), Y(ll)); c.stroke();
        const top = Y(Math.max(o, cl)), bot = Y(Math.min(o, cl));
        c.fillRect(X(i) - bw * .3, top, bw * .6, Math.max(1, bot - top));
      });
      noGlow();
      const ly = Y(d.now);
      c.strokeStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.moveTo(0, ly); c.lineTo(pw, ly); c.stroke();
      glow('#fff', 12); c.fillStyle = '#fff'; c.beginPath(); c.arc(X(n - 1), ly, 2.6, 0, TAU); c.fill(); noGlow();
      let tyNow = ly;   // keep the price tag clear of level tags
      for (const ty of tagYs) if (Math.abs(tyNow - ty) < 17) tyNow = ty + (ly >= ty ? 17 : -17);
      tag(tyNow, fmtPrice(d.now), l.c1, true);
    } else if (name === 'объём') {
      const mx = Math.max(...d.vol) || 1;
      // 30.09: шкала объёма = шкала бота — порог «всплеска» на каждом баре: ×5 медианы предыдущих 30 баров и не меньше 50K$ (FAST3_SPIKE_X / FAST3_SPIKE_MINQ); раньше подсвечивалось «больше 4 медиан всего окна»
      const thr = d.vol.map((v, i) => { const w = d.vol.slice(Math.max(0, i - 30), i).sort((a, b) => a - b); return Math.max(5 * (w.length ? w[w.length >> 1] : 0), 50000); });
      c.save(); c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath();
      thr.forEach((t, i) => { const yy = y0 + h - 2 - Math.min(1, t / mx) * (h - 18); i ? c.lineTo(X(i), yy) : c.moveTo(X(i), yy); });
      c.stroke(); c.restore();
      d.vol.forEach((v, i) => {
        const hv = v / mx * (h - 18), big = v >= thr[i];
        if (big) glow(`rgba(${l.c1},.9)`, 8);
        c.fillStyle = big ? `rgb(${l.c1})` : 'rgba(160,178,205,.45)';
        c.fillRect(X(i) - bw * .3, y0 + h - 2 - hv, bw * .6, hv);
        noGlow();
      });
    } else if (name === 'CVD фьюч') line(d.cvdF, y0, h, '245,170,70');
    else if (name === 'CVD спот') line(d.cvdS, y0, h, '124,196,245');
    else if (name === 'интерес') line(d.oiS, y0, h, '235,240,250');
    else {
      const mx = Math.max(...d.liqL, ...d.liqS) || 1, mid = y0 + h / 2 + 5, hh = h / 2 - 9;
      c.strokeStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.moveTo(0, mid + .5); c.lineTo(pw, mid + .5); c.stroke();
      d.liqS.forEach((v, i) => { if (v) { glow('rgba(111,224,168,.9)', 8); c.fillStyle = 'rgb(111,224,168)'; c.fillRect(X(i) - bw * .35, mid - v / mx * hh, bw * .7, v / mx * hh); } });
      d.liqL.forEach((v, i) => { if (v) { glow('rgba(240,98,116,.9)', 8); c.fillStyle = 'rgb(240,98,116)'; c.fillRect(X(i) - bw * .35, mid, bw * .7, v / mx * hh); } });
      noGlow();
    }
    y0 += h;
  });
}

// ---------- scene: shattering crystal, circuit traces, light stream ----------
// low-poly crystal: subdivided icosahedron with jittered vertices
const PHI = (1 + Math.sqrt(5)) / 2;

for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) if (Math.hypot(...SV[i].map((q, k) => q - SV[j][k])) < 1.1) SE.push([i, j]);
const sadj = (a, b) => SE.some(([i, j]) => (i === a && j === b) || (i === b && j === a));
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) for (let k = j + 1; k < 12; k++) if (sadj(i, j) && sadj(j, k) && sadj(i, k)) SF.push([i, j, k]);
{
  const cache = {};
  const mid = (a, b) => {
    const key = a < b ? a + '_' + b : b + '_' + a;
    if (cache[key] !== undefined) return cache[key];
    const m = SV[a].map((q, i) => (q + SV[b][i]) / 2), n = Math.hypot(...m);
    SV.push(m.map(q => q / n)); return (cache[key] = SV.length - 1);

  const F2 = [];
  for (const [a, b, c] of SF) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); F2.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
  SF = F2;
  SV = SV.map(v => { const s = 1 + (Math.random() - .5) * .14; return v.map(q => q * s); });
}
const FACE_SEED = SF.map(() => Math.random());

// shards
const shards = [];

  const r0 = burst ? SR * .5 : SR * (.55 + Math.random() * .35);

    pts: [0, 1, 2].map(i => { const a = i * TAU / 3 + (Math.random() - .5) * 1.2; return [Math.cos(a) * (.6 + Math.random() * .5), Math.sin(a) * (.6 + Math.random() * .5)]; }),

// circuit traces converging on the crystal (static layer + travelling pulses)
let traceLayer = null, traces = [];
function buildTraces() {
  traces = [];
  for (let i = 0; i < 38; i++) {
    const side = Math.random();
    const a = Math.PI + (Math.random() - .5) * 2.1;            // arrive on the left half of the crystal
    const tx = SX + Math.cos(a) * SR * 1.02, ty = SY + Math.sin(a) * SR * .95;
    const sy = side < .7 ? Math.random() * CH : (Math.random() < .5 ? -10 : CH + 10);
    const sx0 = side < .7 ? -10 : Math.random() * 220;
    const pts = [[sx0, sy]];

    pts.push([x, sy < 0 || sy > CH ? (sy < 0 ? 40 + Math.random() * 80 : CH - 40 - Math.random() * 80) : sy]);
    y = pts[1][1];

    const x2 = Math.min(tx - 8, x + run);

    pts.push([tx, ty]);

    traces.push({ pts, segs, L, speed: 60 + Math.random() * 90, off: Math.random(), hue: Math.random() < .15 ? '190,140,255' : SCN_AC });
  }

  traceLayer.width = CW * SCN_DPR; traceLayer.height = CH * SCN_DPR;
  const t = traceLayer.getContext('2d');
  t.setTransform(SCN_DPR, 0, 0, SCN_DPR, 0, 0);
  // blurred tech lights in the background
  t.filter = 'blur(10px)';
  for (let i = 0; i < 26; i++) {
    t.fillStyle = `rgba(${SCN_AC},${.03 + Math.random() * .08})`;
    const w = 20 + Math.random() * 90, h = 4 + Math.random() * 40;

}
buildTraces();
function pointOn(tr, dist) {

// particles riding the light stream
const beamParts = Array.from({ length: 140 }, () => ({ x: SX + Math.random() * (CW - SX), y: SY + gauss() * 14, v: 40 + Math.random() * 180, s: Math.random() < .1 ? 2 : 1 }));

let scLast = performance.now() / 1000, emit = 0;

  sx.setTransform(SCN_DPR, 0, 0, SCN_DPR, 0, 0);

    const u = (p.x - SX) / (CW - SX);

    const g = sx.createLinearGradient(P[0][0], P[0][1], P[1][0], P[1][1]);
