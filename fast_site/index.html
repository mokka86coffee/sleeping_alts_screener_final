<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Быстрый бот · Crypto Orbit</title>
<style>
  :root { --dim: rgba(150,185,225,.55); --txt: #cfe2f7; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--txt);
    background: radial-gradient(ellipse at 50% 55%, #0a1b31 0%, #050e1c 55%, #02060d 100%);
    font-family: "DIN Alternate", "DIN Condensed", "Eurostile", "Bahnschrift", "Helvetica Neue", Arial, sans-serif;
  }
  #c, #tx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #c { filter: blur(.7px); }   /* soft graphics layer; texts live on #tx and stay sharp */
  .hud { position: fixed; inset: 0; pointer-events: none; text-transform: uppercase; letter-spacing: .16em; }
  .top { position: absolute; top: 20px; left: 0; right: 0; text-align: center; }
  .top small { display: block; font-size: 9px; color: var(--dim); }
  .top h1 { margin: 10px 0 0; font-weight: 300; font-size: 22px; letter-spacing: .34em; color: #e8f2ff; }
  .btns { position: absolute; bottom: 22px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 0 16px; }
  .btns span { font-size: 11px; padding: 9px 14px; border: 1px solid rgba(140,175,215,.15); color: rgba(150,180,215,.25); }
  .btns span.on { border-color: rgba(190,215,245,.7); color: #e8f2ff; }
  .btns span.exit { margin-left: 18px; border-color: rgba(190,215,245,.5); color: #cfe2f7; }
  @media (max-width: 760px) { .btns span:not(.on):not(.exit) { display: none; } .top h1 { font-size: 16px; } }
  /* coin summary card: centred glass panel (light rays, stacked glass layers, glossy edges) */
  .veil {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease;
    background:
      radial-gradient(ellipse 60% 70% at 50% 0%, rgba(var(--ac,120,180,255),.14), transparent 70%),
      radial-gradient(ellipse at 50% 50%, rgba(2,6,13,.78) 0%, rgba(2,6,13,.45) 60%, rgba(2,6,13,.25) 100%);
  }
  .veil.on { opacity: 1; }
  .card, .ghost {
    --ac: 160,210,255;
    position: fixed; left: 50%; top: 50%; box-sizing: border-box; border-radius: 26px;
  }
  .card {
    width: 580px; padding: 26px 24px 18px; overflow: hidden; isolation: isolate;
    background:
      linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 28%),
      linear-gradient(165deg, rgba(20,34,62,.72) 0%, rgba(8,14,30,.82) 55%, rgba(5,9,20,.9) 100%);
    backdrop-filter: blur(26px) saturate(160%); -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow: 0 0 80px rgba(var(--ac),.16), 0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.06);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #eef3fb;
    pointer-events: none; opacity: 0; filter: blur(8px);
    transform: translate(-50%,-50%) scale(calc(var(--sc,1) * .94)) translateY(16px);
    transition: opacity .6s ease, filter .6s ease, transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .card.on { pointer-events: auto; opacity: 1; filter: blur(0); transform: translate(-50%,-50%) scale(var(--sc,1)); }
  /* glossy gradient rim */
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 3;
    background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(var(--ac),.45) 22%, rgba(255,255,255,.04) 50%, rgba(var(--ac),.35) 85%, rgba(255,255,255,.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* glass layers stacked behind the card */
  .ghost {
    pointer-events: none; opacity: 0;
    background: linear-gradient(160deg, rgba(var(--ac),.10), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 20px 50px rgba(0,0,0,.35);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .7s ease, transform 1s cubic-bezier(.2,.8,.2,1);
    transform: translate(-50%,-50%) scale(calc(var(--sc,1) * .94));
  }
  .ghost.g1.on { opacity: .75; transform: translate(-50%,-50%) scale(var(--sc,1)) translate(-18px, 14px) rotate(-3.2deg); }
  .ghost.g2.on { opacity: .45; transform: translate(-50%,-50%) scale(var(--sc,1)) translate(22px, 24px) rotate(2.6deg); }
  /* volumetric light rays from the top */
  .rays {
    position: absolute; left: -20%; right: -20%; top: -60px; height: 420px; z-index: -1; pointer-events: none;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,.07) 0 3px, transparent 3px 34px),
      repeating-linear-gradient(76deg, rgba(var(--ac),.10) 0 6px, transparent 6px 52px),
      radial-gradient(ellipse 45% 70% at 50% 0%, rgba(var(--ac),.55), rgba(var(--ac),.12) 45%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 50% 80% at 50% 0%, #000 20%, transparent 75%);
    mask-image: radial-gradient(ellipse 50% 80% at 50% 0%, #000 20%, transparent 75%);
    filter: blur(1.5px); mix-blend-mode: screen; animation: rays 14s ease-in-out infinite alternate;
  }
  @keyframes rays { from { background-position: 0 0, 0 0, 0 0; opacity: .85; } to { background-position: 60px 0, -80px 0, 0 0; opacity: 1; } }
  /* drifting bokeh */
  .bk { position: absolute; border-radius: 50%; z-index: -1; pointer-events: none; filter: blur(1px);
    background: radial-gradient(circle, rgba(255,255,255,.55), rgba(var(--ac),.25) 40%, transparent 70%); animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(24px, -30px); opacity: .4; } }
  .card .x {
    position: absolute; right: 18px; top: 18px; width: 34px; height: 34px; border-radius: 50%; z-index: 4; cursor: pointer;
    display: grid; place-items: center; color: #fff; font-size: 12.8px; line-height: 1;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(var(--ac),.18) 55%, rgba(255,255,255,.04));
    border: 1px solid rgba(255,255,255,.3); box-shadow: 0 0 18px rgba(var(--ac),.45), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .card .x:hover { transform: scale(1.08); box-shadow: 0 0 28px rgba(var(--ac),.7), inset 0 1px 0 rgba(255,255,255,.5); }
  .card .c-orbit { font-size: 8px; letter-spacing: .3em; color: rgba(255,255,255,.55); text-transform: uppercase; }
  .card .c-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 8px; padding-right: 44px; }
  .card .c-title { position: relative; line-height: .9; }
  .card .c-title b {
    display: block; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 51.2px; letter-spacing: -.02em; color: #fff;
    text-shadow: 0 0 24px rgba(var(--ac),.9), 0 0 60px rgba(var(--ac),.55), 0 2px 0 rgba(255,255,255,.25);
  }
  .card .c-title span {
    display: block; margin-top: -10px; margin-left: 4px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 20.8px;
    letter-spacing: -.01em; color: rgb(var(--ac)); text-shadow: 0 0 16px rgba(var(--ac),.8);
  }
  /* hologram capsule with a rotating crystal */
  .card .holo { position: relative; width: 150px; margin: -18px 0 -6px; text-align: center; }
  .card .holo canvas { width: 150px; height: 150px; }
  .card .holo .c-now { margin-top: 4px; padding: 6px 12px; text-align: center; }
  /* scanning light sweeping down the panel */
  .sweep {
    position: absolute; left: 0; right: 0; height: 90px; top: -90px; z-index: 2; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(180deg, transparent, rgba(var(--ac),.07) 60%, rgba(255,255,255,.22) 96%, transparent);
    animation: sweep 8s cubic-bezier(.45,0,.55,1) infinite;
  }
  @keyframes sweep { 0% { top: -90px; } 60%, 100% { top: 105%; } }
  .card .c-now {
    text-align: right; padding: 10px 16px; border-radius: 16px;
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .card .c-now small { display: block; font-size: 7.2px; letter-spacing: .2em; color: rgba(255,255,255,.5); text-transform: uppercase; }
  .card .c-now span { font-weight: 300; font-size: 17.6px; color: #fff; text-shadow: 0 0 16px rgba(var(--ac),.7); }
  .card .c-sub {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 9px; font-size: 8.8px; letter-spacing: .04em; color: rgba(240,246,255,.9);
    padding: 7px 14px; border-radius: 999px; background: rgba(var(--ac),.12); border: 1px solid rgba(var(--ac),.35);
    box-shadow: 0 0 20px rgba(var(--ac),.2), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .card .c-sub i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--ac)); box-shadow: 0 0 10px rgb(var(--ac)); animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  /* metrics: bare text, emphasis by glowing light strips */
  .card .hero, .card .minor { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 22px; margin-top: 18px; padding-top: 14px; }
  .card .minor { margin-top: 4px; }
  .card .hero::before {   /* light streak across the block */
    content: ""; position: absolute; left: -24px; right: -24px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--ac),.6) 20%, #fff 50%, rgba(var(--ac),.6) 80%, transparent);
    box-shadow: 0 0 12px rgba(var(--ac),.9), 0 0 30px rgba(var(--ac),.5);
  }
  .card .tile { --st: var(--ac); position: relative; padding: 4px 0 14px; }
  .card .tile.up { --st: 110,240,180; }
  .card .tile.dn { --st: 255,110,130; }
  .card .tile::before {   /* faint track */
    content: ""; position: absolute; left: 0; right: 0; bottom: 5px; height: 1px; background: rgba(255,255,255,.08);
  }
  .card .tile::after {    /* bright strip; its length can carry a value (bar volume) */
    content: ""; position: absolute; left: 0; bottom: 4px; height: 3px; width: var(--w, 45%); border-radius: 2px;
    background: linear-gradient(90deg, #fff, rgb(var(--st)) 25%, rgba(var(--st),.0));
    box-shadow: 0 0 10px rgba(var(--st),.9), 0 0 22px rgba(var(--st),.45);
  }
  .card .tile small { display: block; font-family: "DIN Alternate", "Helvetica Neue", sans-serif; font-size: 6.8px; letter-spacing: .26em; text-transform: uppercase; color: rgba(var(--ac),.85); }
  .card .tile b {
    display: block; margin-top: 2px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 200; font-size: 20.8px; letter-spacing: .01em; color: #fff;
    text-shadow: 0 0 16px rgba(var(--ac),.6);
  }
  .card .minor .tile b { font-size: 16px; }
  .card .tile b.up { color: #9af7cf; text-shadow: 0 0 16px rgba(110,240,180,.6); }
  .card .tile b.dn { color: #ffa3ae; text-shadow: 0 0 16px rgba(255,110,130,.55); }
  .card .tile em { display: block; margin-top: 1px; font-style: normal; font-size: 7.6px; color: rgba(210,225,245,.5); }
  .card .chart {
    margin-top: 14px; padding: 12px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.18));
    border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .card canvas { display: block; width: 100%; }
  .card .c-foot { margin-top: 10px; font-size: 8px; letter-spacing: .03em; line-height: 1.5; color: rgba(210,222,240,.5); text-align: center; }
  .card .c-foot b { color: rgba(240,246,255,.85); font-weight: 600; }
  /* futuristic type: geometric Futura for words (wide tracking, caps), ultralight tabular digits for numbers */
  :root { --ff-disp: "Futura", "Avenir Next", "Century Gothic", sans-serif; --ff-num: "Helvetica Neue", "Avenir Next", Arial, sans-serif; }
  .top h1 { font-family: var(--ff-disp); font-weight: 500; letter-spacing: .55em; }
  .top small { font-family: var(--ff-disp); letter-spacing: .3em; }
  .btns { gap: 10px; }
  .btns span { font-family: var(--ff-disp); font-size: 10px; letter-spacing: .18em; padding: 8px 12px; white-space: nowrap; }
  @media (max-width: 980px) { .btns span:not(.on):not(.exit) { display: none; } }
  .card .c-orbit { font-family: var(--ff-disp); font-size: 7.6px; letter-spacing: .45em; }
  .card .c-title b {
    font-family: var(--ff-disp); font-weight: 500; font-size: 44.8px; letter-spacing: .12em; text-transform: uppercase;
  }
  .card .c-title span {
    font-family: var(--ff-disp); font-weight: 500; font-style: italic; font-size: 13.6px; letter-spacing: .32em; margin-top: 2px; margin-left: 6px;
  }
  .card .c-now small, .card .tile small { font-family: var(--ff-disp); font-weight: 500; letter-spacing: .34em; }
  .card .c-now span, .card .tile b { font-family: var(--ff-num); font-weight: 100; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .card .c-sub { font-family: var(--ff-disp); font-size: 7.6px; letter-spacing: .2em; text-transform: uppercase; }
  .card .tile em { font-family: var(--ff-disp); font-size: 7.2px; letter-spacing: .06em; }
  .card .c-foot { font-family: var(--ff-disp); font-size: 6.8px; letter-spacing: .22em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="tx"></canvas>
</div>
<div class="hud">
  <div class="top"><small id="status">подключение…</small><h1>Crypto Orbit</h1></div>
</div>
<div class="veil" id="veil"></div>
<div class="ghost g2" id="ghost2"></div>
<div class="ghost g1" id="ghost1"></div>
<div class="card" id="card">
  <div class="rays"></div>
  <div class="bk" style="left:8%;top:22%;width:10px;height:10px"></div>
  <div class="bk" style="left:84%;top:14%;width:6px;height:6px;animation-delay:-5s"></div>
  <div class="bk" style="left:70%;top:46%;width:14px;height:14px;animation-delay:-9s;opacity:.5"></div>
  <div class="bk" style="left:18%;top:64%;width:7px;height:7px;animation-delay:-3s"></div>
  <div class="bk" style="left:52%;top:82%;width:9px;height:9px;animation-delay:-11s;opacity:.6"></div>
  <div class="sweep"></div>
  <div class="x" id="cClose">✕</div>
  <div class="c-orbit" id="cOrbit"></div>
  <div class="c-head">
    <div class="c-title"><b id="cTitle"></b><span id="cMode"></span></div>
    <div class="holo"><canvas id="cHolo"></canvas><div class="c-now"><small>цена сейчас</small><span id="cNow"></span></div></div>
  </div>
  <div class="c-sub"><i></i><span id="cSub"></span></div>
  <div class="hero" id="cHero"></div>
  <div class="minor" id="cMinor"></div>
  <div class="chart"><canvas id="cChart"></canvas></div>
  <div class="c-foot" id="cFoot"></div>
</div>
<script>
const TAU = Math.PI * 2;
const MAX_LABELS = 15, MIN_LABELS = 10;
const ANIM_SLOW = 3;   // appear / disappear speed factor
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const tcv = document.getElementById('tx'), tctx = tcv.getContext('2d');
const TIME_SLOW = 2;   // global animation speed factor

// texts go to the sharp layer, using the current style of the graphics context
function text(str, x, y) {
  tctx.font = ctx.font; tctx.fillStyle = ctx.fillStyle; tctx.textAlign = ctx.textAlign;
  tctx.fillText(str, x, y);
}
let W = 0, H = 0;
const RIB_H = 118;   // высота ленты дня под кольцами

const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ease = x => 1 - Math.pow(1 - x, 3);
// DIN Alternate on macOS exists only in bold, so ticker names use a family with a light weight
const THIN_FONT = '"Helvetica Neue","Avenir Next","Segoe UI",Arial,sans-serif';
const FONT = '"DIN Alternate","DIN Condensed","Eurostile","Bahnschrift","Helvetica Neue",Arial,sans-serif';

function makeRing(cfg) {
  const parts = [];
  while (parts.length < 4800) {
    const u = Math.random();
    let r;
    if (u < .62) r = .66 + gauss() * .1;
    else if (u < .86) r = .9 + gauss() * .05;
    else r = .46 + Math.random() * .8;
    if (r < .44 || r > 1.28) continue;
    const a = Math.random() * TAU;
    const arm = .5 + .5 * Math.cos(2 * a - r * 8);
    if (Math.random() > .3 + .7 * arm) continue;
    const z = Math.random();
    parts.push({ a, r, s: z < .05 ? 2 : z < .35 ? 1.3 : .8, b: .3 + Math.random() * .7 });
  }
  const markers = [];
  for (let i = 0; i < 14; i++) {
    const z = Math.random();
    markers.push({ a: Math.random() * TAU, r: .5 + Math.random() * .75, t: z < .5 ? 'sq' : z < .75 ? 'A' : 'B' });
  }
  const loops = [];
  for (let i = 0; i < 5; i++) loops.push({ a: Math.random() * TAU, r: .62 + Math.random() * .25, s: .04 + Math.random() * .04 });
  const styles = [];
  for (let i = 0; i <= 20; i++) styles.push(`rgba(${cfg.rgb},${(i / 20).toFixed(3)})`);
  return Object.assign({ parts, markers, loops, styles, labels: [], next: 0, cx: 0, cy: 0, R: 1 }, cfg);
}

const rings = [
  makeRing({
    title: 'ORBIT A · ВХОД', mode: 'entry',   // 27.09 владелец: «только вход и выход; вход держится до выхода, закрытие — 15 минут»
    palette: ['140,200,255', '185,160,255', '255,205,120', '120,235,255', '255,150,190', '170,255,200'], rgb: '70,150,255', hot: '160,210,255', w: .037, k: .27, light: .35,
    names: [], queue: [],
  }),
  makeRing({
    title: 'ORBIT B · ВЫХОД', mode: 'target',
    palette: ['90,240,210', '200,255,120', '255,130,200', '255,175,100', '130,180,255', '120,230,255'], rgb: '40,195,235', hot: '150,240,255', w: .03, k: .27, light: 2.6,
    names: [], queue: [],
  }),
];

// demo prices; replace with real entry / exit
const PRICE = { BTC: 64000, ETH: 3100, SOL: 150, BNB: 580, XRP: .55, ADA: .42, DOGE: .12, TON: 5.4, AVAX: 28, DOT: 5.8,
  LINK: 13, TRX: .15, LTC: 70, BCH: 360, NEAR: 4.6, ATOM: 6.2, XLM: .1, ICP: 9, ETC: 20, HBAR: .07,
  PEPE: .0000095, WIF: 1.9, ARB: .6, OP: 1.5, SUI: 1.4, APT: 7, INJ: 20, TIA: 5, SEI: .3, JUP: .8, RNDR: 5.5, FET: 1.2,
  ONDO: .9, ENA: .35, BONK: .00002, STRK: .4, PYTH: .3, WLD: 1.8, LDO: 1.1, AAVE: 140, UNI: 7, GALA: .02, SAND: .27, FLOKI: .00014 };
function fmtPrice(v) {
  if (v >= 1000) return v.toLocaleString('en-US', { maximumFractionDigits: 0 }).replace(/,/g, ' ');
  if (v >= 1) return v.toFixed(2);
  if (v >= .01) return v.toFixed(4);
  return v.toPrecision(3);
}

// blend an "r,g,b" colour towards another
const mix = (c1, c2, k) => { const a = c1.split(',').map(Number), b = c2.split(',').map(Number); return a.map((v, i) => Math.round(v + (b[i] - v) * k)).join(','); };

// each label gets its own accent; avoid repeating the previous one on this ring
function pickColors(g) {
  let i;
  do i = Math.random() * g.palette.length | 0; while (i === g.lastColor && g.palette.length > 1);
  g.lastColor = i;
  const c1 = g.palette[i], c2 = g.palette[(i + 1 + (Math.random() * (g.palette.length - 1) | 0)) % g.palette.length];
  return { c1, c2: mix(c2, c1, .3), cp: mix(c1, '240,248,255', .6) };
}

const omega = (g, r) => g.w * (1.35 - .55 * r);
const ang = (g, a, r, t) => a + t * omega(g, r);
const proj = (g, a, r) => [g.cx + Math.cos(a) * r * g.R, g.cy + Math.sin(a) * r * g.R * g.k];

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, innerWidth); H = Math.max(400, innerHeight);
  for (const c of [cv, tcv]) { c.width = W * dpr; c.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const top = 96, bot = H - 30 - (W >= 900 ? RIB_H : 0), hh = (bot - top) / 2;   // снизу — лента дня (27.09), кнопок нет
  rings.forEach((g, i) => {
    g.cx = W / 2;
    g.cy = top + hh * i + hh * .6;
    g.R = Math.max(40, Math.min(W * .36, hh * .4 / (1.3 * g.k)));
  });
}
addEventListener('resize', () => { layout(); if (typeof fitCard === 'function') fitCard(); });
layout();

// ── ЖИВЫЕ ДАННЫЕ (27.09): монеты колец — из output/fast_state.json по сокету; монета живёт, пока она в данных,
//    и гаснет родным затуханием, когда её нет (вход сработал / позиция закрыта). Новые выходят по одной, как в дизайне.
function spawn(g, t) {
  const it = g.queue.shift();
  if (!it) return;
  const name = it.name;
  // pick the spot whose label box overlaps least with the ones already shown
  const tips = g.labels.map(l => { const [x, y] = proj(g, ang(g, l.a, l.r, t), l.r); return [x, y - l.h]; });
  let best = null, bestD = -1;
  for (let i = 0; i < 40; i++) {
    const r = .58 + Math.random() * .4, sa = Math.random() * TAU, h = (.1 + Math.random() * .16) * g.R;
    const [x, y] = proj(g, sa, r);
    let d = 9;
    for (const [tx, ty] of tips) d = Math.min(d, Math.max(Math.abs(x - tx) / 170, Math.abs(y - h - ty) / 44));
    if (d > bestD) { bestD = d; best = { r, sa, h }; }
    if (d >= 1.1) break;
  }
  g.labels.push({
    ...pickColors(g), name, side: it.side, key: it.key, item: it.item, price: it.price, r: best.r, a: best.sa - t * omega(g, best.r), born: t,
    life: Infinity, h: best.h,
  });
}

function ellipse(g, r, rot = 0, sy = 1) {
  ctx.beginPath();
  ctx.ellipse(g.cx, g.cy, r * g.R, r * g.R * g.k * sy, rot, 0, TAU);
}

function drawRing(g, t) {
  const { cx, cy, R, k } = g;

  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, k);
  const hz = ctx.createRadialGradient(0, 0, R * .4, 0, 0, R * 1.2);
  hz.addColorStop(0, 'rgba(0,0,0,0)');
  hz.addColorStop(.35, `rgba(${g.rgb},.10)`);
  hz.addColorStop(.6, `rgba(${g.rgb},.04)`);
  hz.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = hz; ctx.beginPath(); ctx.arc(0, 0, R * 1.2, 0, TAU); ctx.fill();

  core.addColorStop(0, 'rgba(24,38,58,.95)');

  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(${g.rgb},.10)`;
  ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.45, R * .55, -.22, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.25, R * .7, .35, 0, TAU); ctx.stroke();
  ctx.setLineDash([2, 6]); ctx.strokeStyle = `rgba(${g.rgb},.25)`; ellipse(g, 1.3); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = `rgba(${g.rgb},.18)`; ellipse(g, .98); ctx.stroke();
  ctx.strokeStyle = `rgba(${g.rgb},.3)`; ellipse(g, .47); ctx.stroke();
  ctx.strokeStyle = `rgba(${g.rgb},.2)`; ellipse(g, .22); ctx.stroke();

  // spokes
  ctx.strokeStyle = `rgba(${g.rgb},.07)`;
  for (let i = 0; i < 6; i++) {

    const [x, y] = proj(g, a, 1.35);

  ctx.strokeStyle = `rgba(${g.hot},.16)`; ctx.lineWidth = 1.2; ellipse(g, 1.12); ctx.stroke();
  ctx.shadowColor = `rgba(${g.rgb},1)`; ctx.shadowBlur = 12;
  ctx.lineWidth = 1.6;

    const span = 1.15 - j * .19;
    ctx.strokeStyle = `rgba(${g.hot},.14)`;
    ctx.beginPath(); ctx.ellipse(cx, cy, 1.12 * R, 1.12 * R * k, 0, g.light - span, g.light + span); ctx.stroke();

  ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(${g.hot},.8)`; ellipse(g, .1); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = `rgba(${g.hot},.5)`; ellipse(g, .065); ctx.stroke();
  ctx.fillStyle = 'rgba(230,245,255,.9)'; ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);

  // tilted axis with ticks
  const len = R * k * 2.2, dx = len * .12;
  ctx.strokeStyle = 'rgba(225,235,150,.35)';

  }

  ctx.font = `9px ${FONT}`;
  for (const m of g.markers) {
    const [x, y] = proj(g, ang(g, m.a, m.r, t), m.r);
    if (m.t === 'sq') {
      ctx.strokeStyle = 'rgba(170,210,255,.45)'; ctx.strokeRect(x - 4, y - 4, 8, 8);
      ctx.fillStyle = 'rgba(200,230,255,.7)'; ctx.fillRect(x - 1, y - 1, 2, 2);
    } else {
      ctx.fillStyle = 'rgba(170,210,255,.45)'; text(m.t, x, y);
    }
  }
  ctx.strokeStyle = 'rgba(210,235,120,.35)';
  for (const l of g.loops) {
    const [x, y] = proj(g, ang(g, l.a, l.r, t), l.r);
    ctx.beginPath(); ctx.ellipse(x, y, l.s * R, l.s * R * k * 1.6, 0, 0, TAU); ctx.stroke();
  }

  const lx = Math.max(16, cx - R * 1.3);

  ctx.font = `10px ${FONT}`; ctx.fillStyle = 'rgba(190,215,245,.75)';

  ctx.fillStyle = 'rgba(150,185,225,.5)';

}

function drawHUD(t) {
  ctx.lineWidth = 1;
  ctx.font = `9px ${FONT}`;
  ctx.textAlign = 'left';

  // center vertical line

  ctx.beginPath(); ctx.moveTo(W / 2 + .5, 70); ctx.lineTo(W / 2 + .5, H - 70); ctx.stroke();

  if (W < 700) return;

  // corner scopes
  if (W >= 1000) {
    drawEventScope(W * .14 + 40, 175, 72, t);   // 27.09 владелец: «давай в кольцо перенесём и показываем только 1 событие ближайшее»

      ctx.beginPath(); ctx.arc(cx, cy, r * .55, 0, TAU); ctx.stroke();

      ctx.fillStyle = 'rgba(150,185,225,.55)';

// ---------- hover summary card (demo data; replace demoDetail with real series) ----------
let hovered = null, mouse = null;
const card = document.getElementById('card'), cChart = document.getElementById('cChart');

addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; });
addEventListener('mouseleave', () => { mouse = null; });

let selected = null;   // coin whose card is open (opened by click)
const inRect = (h, pad) => mouse.x >= h.x - pad && mouse.x <= h.x + h.w + pad && mouse.y >= h.y - pad && mouse.y <= h.y + h.h + pad;
const overCard = () => {
  if (!selected || !mouse) return false;
  const r = card.getBoundingClientRect();
  return mouse.x > r.left && mouse.x < r.right && mouse.y > r.top && mouse.y < r.bottom;
};

// coin under the cursor: its plate, its wavy leader or its point on the ring
function findHover() {
  if (!mouse || overCard()) return null;
  for (let r = rings.length - 1; r >= 0; r--) {
    for (const l of rings[r].labels) {
      const h = l.hit;
      if (!h) continue;
      if (inRect(h, 4)) return l;
      if (Math.abs(mouse.x - h.ax) < 8 && mouse.y > h.y + h.h - 4 && mouse.y < h.ay + 4) return l;
      if (Math.hypot(mouse.x - h.ax, mouse.y - h.ay) < 12) return l;
    }
  }
  let best = null;   // дуга ленты: курсор внутри её пролёта и между вершиной и основанием; узкая — приоритетнее
  for (const a of RIB.arcs) {
    const h = a.hit; if (!h) continue;
    if (mouse.x >= h.x - 3 && mouse.x <= h.x + h.w + 3 && mouse.y >= h.y - 6 && mouse.y <= h.y + h.h + 4 && (!best || h.w < best.hit.w)) best = a;
  }
  return best;
}

function openCard(l) {
  selected = l;
  renderCard(l.closed ? RIB_G : rings.find(g => g.labels.includes(l)), l);
  fitCard();
  for (const el of [card, ghost1, ghost2, veil]) el.classList.add('on');
}
function closeCard() {
  selected = null;
  for (const el of [card, ghost1, ghost2, veil]) el.classList.remove('on');
}
document.getElementById('cClose').addEventListener('click', e => { e.stopPropagation(); closeCard(); });
addEventListener('click', e => {
  mouse = { x: e.clientX, y: e.clientY };
  if (overCard()) return;
  const l = findHover();
  if (l && l !== selected) openCard(l); else closeCard();

addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pctStr = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(v !== 0 && Math.abs(v) < 1 ? 2 : 1) + '%';

function demoDetail(g, l) {
  let seed = Math.round(l.born * 1000);
  for (const c of l.name) seed = seed * 31 + c.charCodeAt(0) | 0;
  const R = rng(seed), gs = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };

  // prices for the text block
  const d = { ring: g.mode };
  if (g.mode === 'entry') {
    d.entry = l.price; d.now = l.price * (1 - (.003 + R() * .015));
    d.left = (d.entry / d.now - 1) * 100;
  } else {
    d.target = l.price; d.entry = l.price / 1.05; d.now = d.entry * (1 + (R() * .04 - .01));
    d.left = (d.target / d.now - 1) * 100;
  }
  d.volPct = 8 + R() * 80 | 0; d.bar = (R() - .4) * .6; d.oi = (R() - .3) * 4; d.funding = (R() - .4) * .02;
  d.status = g.mode === 'entry'
    ? ['кандидат на всплеск · ждём объём', 'кандидат на всплеск · вход открыт', 'кандидат на всплеск · вход закрыт: поздно в сессии'][R() * 3 | 0]
    : 'в позиции · до цели ещё ' + pctStr(d.left);

  // 120 bars of 3m = 6h, with a couple of impulse moves late in the window
  const n = 120, jumps = new Set([70 + R() * 20 | 0, 95 + R() * 15 | 0]);
  let p = 1, cf = 0, cs = 0, oi = 1;
  d.candles = []; d.vol = []; d.cvdF = []; d.cvdS = []; d.oiS = []; d.liqL = []; d.liqS = [];
  for (let i = 0; i < n; i++) {
    const jump = jumps.has(i);
    const r = gs() * .004 + (jump ? .02 + R() * .03 : 0) + .0003;
    const o = p, c = p * (1 + r);
    const hi = Math.max(o, c) * (1 + Math.abs(gs()) * .002), lo = Math.min(o, c) * (1 - Math.abs(gs()) * .002);
    d.candles.push([o, hi, lo, c]); p = c;
    const v = Math.exp(gs() * .5) * (jump ? 6 + R() * 6 : 1);
    d.vol.push(v);
    cf += Math.sign(r) * v * (.5 + R()); cs += Math.sign(r) * v * (jump ? 1.5 : .3) * R();
    oi *= 1 + r * .6 + gs() * .002;
    d.cvdF.push(cf); d.cvdS.push(cs); d.oiS.push(oi);
    d.liqL.push(r < -.006 || (R() < .02) ? v * R() : 0);
    d.liqS.push(jump ? v * (.5 + R()) : 0);
  }

  d.candles = d.candles.map(c => c.map(v => v * k));
  return d;
}

// настоящая карточка: цифры и ряды из fast_state.json (charts: bars [t,o,h,l,c,оборот,CVD], spot, oi 5м, liq [лонги, шорты])

function realDetail(g, l) {
  const it = l.item || {}, S = window.STATE || {}, M = S.meta || {};

  const kind = it.t_out ? 'closed' : (it.target != null && it.entry != null ? 'open' : 'entry');
  const d = { ring: kind, funding: ch && ch.funding != null ? ch.funding : 0 };
  if (kind === 'closed') {
    const rv = it.review || null;
    d.entry = it.entry; d.exitPx = it.exit; d.res = it.res; d.usd = it.usd; d.rv = rv; d.item = it;
    d.now = ch && ch.bars && ch.bars.length ? ch.bars[ch.bars.length - 1][4] : it.exit;
    d.status = rv ? rv.verdict : `${it.book} · ${it.why} · разбор придёт через 2 ч после выхода`;
  } else if (kind === 'entry') {
    d.entry = it.level; d.now = it.px; d.left = it.dist != null ? it.dist : (it.level / it.px - 1) * 100;
    d.volPct = Math.round((it.vol_x || 0) * 100); d.bar = it.bar || 0; d.oi = it.oi1h || 0;
    d.status = M.open_gate ? (it.flip ? 'кандидат · интерес ≥ +6% за час → всплеск будет перевёрнут в шорт' : 'кандидат на всплеск · вход открыт')
                           : 'кандидат на всплеск · вход закрыт: ' + (M.gate_why || '');

  } else {

    d.left = (it.target / d.now - 1) * 100 * (it.side || 1);
    d.pnl = (d.now / it.entry - 1) * 100 * (it.side || 1);
    d.oi = it.oi1h_in || 0; d.side = it.side;

    d.exitNote = `стоп ${fmtPrice(it.stop)} · срок ${hmT(it.exit_at)}`;
  }
  if (ch && ch.bars && ch.bars.length) {
    const B = ch.bars;
    d.candles = B.map(b => [b[1], b[2], b[3], b[4]]); d.vol = B.map(b => b[5]); d.cvdF = B.map(b => b[6]);
    let last = 0; d.cvdS = (ch.spot || B.map(() => 0)).map(v => (v == null ? last : (last = v)));
    let k = 0, o = ch.oi && ch.oi.length ? ch.oi[0][1] : 0;
    d.oiS = B.map(b => { while (ch.oi && k < ch.oi.length && ch.oi[k][0] <= b[0]) o = ch.oi[k++][1]; return o; });

function drawCardChart(d, l) {
  const secs = [['цена', 158], ['объём', 38], ['CVD фьюч', 48], ['CVD спот', 48], ['интерес', 48], ['ликвидации', 42]];
  const Wc = 508, Hc = secs.reduce((s, q) => s + q[1], 0), padR = 78;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cChart.width = Wc * dpr; cChart.height = Hc * dpr; cChart.style.height = Hc + 'px';
  const c = cChart.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, Wc, Hc);
  const n = d.candles.length, pw = Wc - padR, bw = pw / n;
  const X = i => i * bw + bw / 2;
  const glow = (col, blur) => { c.shadowColor = col; c.shadowBlur = blur; };
  const noGlow = () => { c.shadowBlur = 0; };

  // glowing line with a fading area under it
  const line = (arr, y0, h, rgb) => {
    const mn = Math.min(...arr), mx = Math.max(...arr), sp = mx - mn || 1;
    const pts = arr.map((v, i) => [X(i), y0 + h - 5 - (v - mn) / sp * (h - 24)]);
    const gr = c.createLinearGradient(0, y0 + 14, 0, y0 + h);
    gr.addColorStop(0, `rgba(${rgb},.22)`); gr.addColorStop(1, `rgba(${rgb},0)`);
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
    c.lineTo(pts[n - 1][0], y0 + h); c.lineTo(pts[0][0], y0 + h); c.closePath();
    c.fillStyle = gr; c.fill();
    glow(`rgba(${rgb},.9)`, 8);
    c.strokeStyle = `rgb(${rgb})`; c.lineWidth = 1.3;
    c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
    noGlow();
    const [lx, ly] = pts[n - 1];
    glow(`rgb(${rgb})`, 10); c.fillStyle = '#fff'; c.beginPath(); c.arc(lx, ly, 2.2, 0, TAU); c.fill(); noGlow();
  };
  const tag = (y, text, rgb, solid) => {
    c.font = `8px ${FONT}`;
    const w = c.measureText(text).width + 8;
    c.fillStyle = solid ? `rgba(${rgb},.9)` : 'rgba(6,12,24,.9)';
    c.fillRect(Wc - padR + 6, y - 8, w, 16);
    c.strokeStyle = `rgba(${rgb},.8)`; c.lineWidth = 1; c.strokeRect(Wc - padR + 6.5, y - 7.5, w - 1, 15);
    c.fillStyle = solid ? '#04101c' : `rgb(${rgb})`; c.textAlign = 'left';
    c.fillText(text, Wc - padR + 11, y + 3.5);
  };

  let y0 = 0;
  secs.forEach(([name, h], si) => {
    // grid
    c.strokeStyle = 'rgba(140,175,220,.05)'; c.lineWidth = 1;
    for (let gx = 0; gx <= pw; gx += pw / 6) { c.beginPath(); c.moveTo(Math.round(gx) + .5, y0 + 2); c.lineTo(Math.round(gx) + .5, y0 + h - 2); c.stroke(); }
    if (si) {
      const sep = c.createLinearGradient(0, 0, Wc, 0);
      sep.addColorStop(0, `rgba(${l.c1},.28)`); sep.addColorStop(1, `rgba(${l.c1},0)`);
      c.strokeStyle = sep; c.beginPath(); c.moveTo(0, y0 + .5); c.lineTo(Wc, y0 + .5); c.stroke();
    }
    c.font = '500 7px Futura, "Avenir Next", sans-serif'; c.textAlign = 'left'; c.letterSpacing = '2.5px';
    c.shadowColor = `rgba(${l.c1},.8)`; c.shadowBlur = 8; c.fillStyle = `rgba(${mix(l.c1, '255,255,255', .5)},.9)`;
    c.fillText(name.toUpperCase(), 3, y0 + 14); c.shadowBlur = 0; c.letterSpacing = '0px';

    if (name === 'цена') {
      const levels = [d.entry].concat(d.target ? [d.target] : [], d.stop ? [d.stop] : [], d.exitPx ? [d.exitPx] : []);
      const lo = Math.min(...d.candles.map(q => q[2]), ...levels), hi = Math.max(...d.candles.map(q => q[1]), ...levels), sp = hi - lo || 1;
      const Y = v => y0 + h - 8 - (v - lo) / sp * (h - 30);
      // levels
      const tagYs = [];
      const lvl = (v, rgb, label) => {
        tagYs.push(Y(v));
        c.setLineDash([3, 4]); c.strokeStyle = `rgba(${rgb},.65)`; c.beginPath(); c.moveTo(0, Y(v)); c.lineTo(pw, Y(v)); c.stroke(); c.setLineDash([]);
        tag(Y(v), label + ' ' + fmtPrice(v), rgb, false);
      };
      lvl(d.entry, l.c1, d.ring === 'entry' ? 'ВХОД' : 'ВХ');
      if (d.target) lvl(d.target, '134,240,192', 'ЦЕЛЬ');
      if (d.stop) lvl(d.stop, '240,98,116', 'СТОП');
      if (d.exitPx) lvl(d.exitPx, '235,240,250', 'ВЫХ');
      // candles with a soft glow
      d.candles.forEach(([o, hh, ll, cl], i) => {
        const up = cl >= o, col = up ? '111,224,168' : '240,98,116';
        glow(`rgba(${col},.8)`, 5);
        c.strokeStyle = c.fillStyle = `rgb(${col})`;
        c.lineWidth = 1; c.beginPath(); c.moveTo(X(i), Y(hh)); c.lineTo(X(i), Y(ll)); c.stroke();
        const top = Y(Math.max(o, cl)), bot = Y(Math.min(o, cl));
        c.fillRect(X(i) - bw * .3, top, bw * .6, Math.max(1, bot - top));
      });
      noGlow();
      const ly = Y(d.now);
      c.strokeStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.moveTo(0, ly); c.lineTo(pw, ly); c.stroke();
      glow('#fff', 12); c.fillStyle = '#fff'; c.beginPath(); c.arc(X(n - 1), ly, 2.6, 0, TAU); c.fill(); noGlow();
      let tyNow = ly;   // keep the price tag clear of level tags
      for (const ty of tagYs) if (Math.abs(tyNow - ty) < 17) tyNow = ty + (ly >= ty ? 17 : -17);
      tag(tyNow, fmtPrice(d.now), l.c1, true);
    } else if (name === 'объём') {
      const mx = Math.max(...d.vol), med = [...d.vol].sort((a, b) => a - b)[n >> 1];
      d.vol.forEach((v, i) => {
        const hv = v / mx * (h - 18), big = v > med * 4;
        if (big) glow(`rgba(${l.c1},.9)`, 8);
        c.fillStyle = big ? `rgb(${l.c1})` : 'rgba(160,178,205,.45)';
        c.fillRect(X(i) - bw * .3, y0 + h - 2 - hv, bw * .6, hv);
        noGlow();
      });
    } else if (name === 'CVD фьюч') line(d.cvdF, y0, h, '245,170,70');
    else if (name === 'CVD спот') line(d.cvdS, y0, h, '124,196,245');
    else if (name === 'интерес') line(d.oiS, y0, h, '235,240,250');
    else {
      const mx = Math.max(...d.liqL, ...d.liqS) || 1, mid = y0 + h / 2 + 5, hh = h / 2 - 9;
      c.strokeStyle = 'rgba(255,255,255,.08)'; c.beginPath(); c.moveTo(0, mid + .5); c.lineTo(pw, mid + .5); c.stroke();
      d.liqS.forEach((v, i) => { if (v) { glow('rgba(111,224,168,.9)', 8); c.fillStyle = 'rgb(111,224,168)'; c.fillRect(X(i) - bw * .35, mid - v / mx * hh, bw * .7, v / mx * hh); } });
      d.liqL.forEach((v, i) => { if (v) { glow('rgba(240,98,116,.9)', 8); c.fillStyle = 'rgb(240,98,116)'; c.fillRect(X(i) - bw * .35, mid, bw * .7, v / mx * hh); } });
      noGlow();
    }
    y0 += h;
  });
}

  const qx = clamp(px, r.left, r.right), qy = clamp(py, r.top, r.bottom);

// icosahedron for the hologram crystal
const PHI = (1 + Math.sqrt(5)) / 2;
const ICO_V = [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0], [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
  [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]].map(v => { const m = Math.hypot(...v); return v.map(q => q / m); });
const ICO_E = [], ICO_F = [];
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
  const d = Math.hypot(...ICO_V[i].map((q, k) => q - ICO_V[j][k]));
  if (d < 1.1) ICO_E.push([i, j]);
}
const adj = (a, b) => ICO_E.some(([i, j]) => (i === a && j === b) || (i === b && j === a));
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) for (let k = j + 1; k < 12; k++)
  if (adj(i, j) && adj(j, k) && adj(i, k)) ICO_F.push([i, j, k]);

const holo = document.getElementById('cHolo'), hctx = holo.getContext('2d');
function drawHolo(l) {
  const S = 150, dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (holo.width !== S * dpr || holo.height !== S * dpr) { holo.width = S * dpr; holo.height = S * dpr; }
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hctx.clearRect(0, 0, S, S);
  const now = performance.now() / 1000, ac = l.c1;
  const cx = S / 2, top = 20, base = 128, R = 50, ry = 11;
  hctx.globalCompositeOperation = 'lighter';

  // vertical light beam
  const beam = hctx.createLinearGradient(cx - 18, 0, cx + 18, 0);
  beam.addColorStop(0, `rgba(${ac},0)`); beam.addColorStop(.5, `rgba(${ac},.28)`); beam.addColorStop(1, `rgba(${ac},0)`);
  hctx.fillStyle = beam; hctx.fillRect(cx - 18, 0, 36, base);
  hctx.fillStyle = 'rgba(255,255,255,.55)'; hctx.fillRect(cx - .5, 0, 1, base);

  // glass cylinder
  const glass = hctx.createLinearGradient(cx - R, 0, cx + R, 0);
  glass.addColorStop(0, `rgba(${ac},.16)`); glass.addColorStop(.2, `rgba(${ac},.03)`);
  glass.addColorStop(.8, `rgba(${ac},.03)`); glass.addColorStop(1, `rgba(${ac},.16)`);
  hctx.fillStyle = glass; hctx.fillRect(cx - R, top, 2 * R, base - top);
  hctx.strokeStyle = `rgba(${ac},.45)`; hctx.lineWidth = 1;
  hctx.beginPath(); hctx.moveTo(cx - R, top); hctx.lineTo(cx - R, base); hctx.moveTo(cx + R, top); hctx.lineTo(cx + R, base); hctx.stroke();
  hctx.strokeStyle = `rgba(255,255,255,.18)`;
  hctx.beginPath(); hctx.moveTo(cx - R + 7, top + 6); hctx.lineTo(cx - R + 7, base - 6); hctx.stroke();
  hctx.strokeStyle = `rgba(${ac},.6)`;
  hctx.beginPath(); hctx.ellipse(cx, top, R, ry, 0, 0, TAU); hctx.stroke();
  hctx.beginPath(); hctx.ellipse(cx, top, R * .72, ry * .72, 0, 0, TAU); hctx.stroke();

  // holo base rings
  for (let i = 0; i < 3; i++) {
    const rr = R * (.55 + i * .25), pulse = .35 + .35 * Math.sin(now * 1.6 - i);
    hctx.strokeStyle = `rgba(${ac},${pulse})`; hctx.setLineDash(i === 1 ? [4, 5] : []); hctx.lineDashOffset = -now * 12;
    hctx.beginPath(); hctx.ellipse(cx, base, rr, rr * ry / R, 0, 0, TAU); hctx.stroke();
  }
  hctx.setLineDash([]);
  const pad = hctx.createRadialGradient(cx, base, 0, cx, base, R);
  pad.addColorStop(0, `rgba(${ac},.5)`); pad.addColorStop(1, `rgba(${ac},0)`);
  hctx.save(); hctx.translate(cx, base); hctx.scale(1, ry / R); hctx.fillStyle = pad;
  hctx.beginPath(); hctx.arc(0, 0, R, 0, TAU); hctx.fill(); hctx.restore();

  // rising particles
  for (let i = 0; i < 14; i++) {
    const u = (now * .18 + i * .137) % 1;
    const x = cx + Math.sin(i * 2.4 + now * .5) * R * .8 * (1 - u * .4), y = base - u * (base - top);
    hctx.fillStyle = `rgba(255,255,255,${(1 - u) * .8})`;
    hctx.fillRect(x, y, 1.4, 1.4);
  }

  // rotating crystal
  const ccy = 74 + Math.sin(now * 1.1) * 3, CR = 38;
  const ay = now * .55, ax = .42 + Math.sin(now * .3) * .12;
  const P = ICO_V.map(([x, y, z]) => {
    const x1 = x * Math.cos(ay) + z * Math.sin(ay), z1 = -x * Math.sin(ay) + z * Math.cos(ay);
    const y2 = y * Math.cos(ax) - z1 * Math.sin(ax), z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
    const f = 3.2 / (3.2 - z2);
    return [cx + x1 * CR * f, ccy + y2 * CR * f, z2];
  });
  const core = hctx.createRadialGradient(cx, ccy, 0, cx, ccy, CR * 1.3);
  core.addColorStop(0, `rgba(255,255,255,.45)`); core.addColorStop(.35, `rgba(${ac},.25)`); core.addColorStop(1, `rgba(${ac},0)`);
  hctx.fillStyle = core; hctx.fillRect(cx - CR * 1.4, ccy - CR * 1.4, CR * 2.8, CR * 2.8);
  ICO_F.map(f => [f, (P[f[0]][2] + P[f[1]][2] + P[f[2]][2]) / 3]).sort((a, b) => a[1] - b[1]).forEach(([f, z]) => {
    hctx.fillStyle = `rgba(${ac},${.03 + .07 * (z + 1) / 2})`;
    hctx.beginPath(); hctx.moveTo(P[f[0]][0], P[f[0]][1]); hctx.lineTo(P[f[1]][0], P[f[1]][1]); hctx.lineTo(P[f[2]][0], P[f[2]][1]); hctx.closePath(); hctx.fill();
  });
  hctx.shadowColor = `rgb(${ac})`; hctx.shadowBlur = 8;
  for (const [i, j] of ICO_E) {
    const z = (P[i][2] + P[j][2]) / 2, k = (z + 1) / 2;
    hctx.strokeStyle = k > .5 ? `rgba(${mix(ac, '255,255,255', .6)},${.35 + .6 * k})` : `rgba(${ac},${.15 + .4 * k})`;
    hctx.lineWidth = .6 + .8 * k;
    hctx.beginPath(); hctx.moveTo(P[i][0], P[i][1]); hctx.lineTo(P[j][0], P[j][1]); hctx.stroke();
  }
  hctx.fillStyle = '#fff';
  for (const [x, y, z] of P) if (z > -.2) { hctx.beginPath(); hctx.arc(x, y, .8 + z, 0, TAU); hctx.fill(); }
  hctx.shadowBlur = 0;
  hctx.globalCompositeOperation = 'source-over';
}

const RIB_G = { title: 'ЗАКРЫТО СЕГОДНЯ', mode: 'closed', labels: [] };

  RIB.arcs = (S.closed || []).map(c => {

    if (!RIB.seen.has(key)) RIB.seen.set(key, first ? t - 99 : t);

}
function ribGeom() {

  const d0 = new Date(S.meta.t * 1000); d0.setHours(0, 0, 0, 0); const t0 = d0.getTime() / 1000;

  });
  rctx.strokeStyle = 'rgba(120,170,230,.3)'; rctx.lineWidth = 1;
  for (let h = 0; h <= 24; h += 3) { const x = G.X(G.t0 + h * 3600); rctx.beginPath(); rctx.moveTo(x + .5, G.yb + 10); rctx.lineTo(x + .5, G.yb + 14); rctx.stroke(); }
  rctx.globalCompositeOperation = 'lighter';
  for (const a of RIB.arcs) {
    if (t - a.born < ANIM_SLOW) continue;              // ещё прорисовывается — рисуется на кадре
    rctx.shadowColor = `rgba(${a.c1},.9)`; rctx.shadowBlur = 6;
    rctx.strokeStyle = `rgba(${a.c1},.55)`; rctx.lineWidth = 1.1;

}
function drawRibbon(t) {
  if (W < 900 || !window.STATE) return;
  const G = ribGeom(), { S, yb, x0, x1 } = G;
  const settled = RIB.arcs.filter(a => t - a.born >= ANIM_SLOW).length;
  const key = [W, H, S.meta.t, RIB.arcs.length, settled, new Date().getHours()].join('|');
  if (key !== ribKey) { ribStatic(G, t); ribKey = key; }
  ctx.drawImage(RIBC, 0, yb - RIB_H, W, RIB_H + 20);
  // подписи (резкий слой)
  const sc = S.score || {}, n = (S.closed || []).length;
  ctx.font = `9px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(150,185,225,.4)';
  text(`${n} сделок · ` + Object.entries(sc).map(([b, v]) => `${b} ${v.usd >= 0 ? '+' : '−'}${Math.abs(Math.round(v.usd))} $`).join(' · '), x1, yb - RIB_H + 34);
  ctx.fillStyle = 'rgba(150,185,225,.6)';
  text('CLOSED TODAY · ЗАКРЫТО СЕГОДНЯ', x1, yb - RIB_H + 20); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(150,185,225,.5)';
  [[0, 3, 'SYDNEY'], [3, 10, 'TOKYO'], [10, 16, 'LONDON'], [16, 24, 'NEW YORK']].forEach(([a, b, nm]) => text(nm, (G.X(G.t0 + a * 3600) + G.X(G.t0 + b * 3600)) / 2, yb + 24));
  ctx.textAlign = 'left';
  // на кадре: прорисовка новых дуг и дуга под курсором
  ctx.globalCompositeOperation = 'lighter';
  for (const a of RIB.arcs) {
    const p = ease(clamp((t - a.born) / ANIM_SLOW)), on = a === hovered || a === selected;
    if (p >= 1 && !on) continue;
    ctx.shadowColor = `rgba(${a.c1},.9)`; ctx.shadowBlur = on ? 14 : 6;
    ctx.strokeStyle = `rgba(${a.c1},${on ? .95 : .55})`; ctx.lineWidth = on ? 2 : 1.1;
    const g2 = arcPath(ctx, a, G, p); ctx.stroke();
    if (p < 1 && p > 0) {
      const px = g2.xa + (g2.xb - g2.xa) * p, py = yb - g2.hh * Math.sin(Math.PI * p) * .75;
      const gr = ctx.createRadialGradient(px, py, 0, px, py, 10);
      gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(.35, `rgba(${a.c1},.6)`); gr.addColorStop(1, `rgba(${a.c1},0)`);

    }
    if (on) { ctx.shadowBlur = 0; ctx.fillStyle = `rgb(${a.c1})`; ctx.textAlign = 'center'; ctx.font = `9px ${FONT}`; text(`${a.name} ${a.item.res >= 0 ? '+' : ''}${a.item.res.toFixed(1)}%`, (g2.xa + g2.xb) / 2, yb - g2.hh * .75 - 8); ctx.textAlign = 'left'; }
  }
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over'; ctx.lineWidth = 1;
  const nx = G.X(Date.now() / 1000);
  ctx.strokeStyle = 'rgba(225,235,150,.55)'; ctx.beginPath(); ctx.moveTo(nx + .5, yb - G.maxH - 6); ctx.lineTo(nx + .5, yb + 12); ctx.stroke();
  ctx.fillStyle = 'rgba(225,235,150,.8)'; ctx.textAlign = 'center'; text(hmT(Date.now() / 1000), nx, yb + 36); ctx.textAlign = 'left';
}

let lastT = 0;
function frame() {
  const t = performance.now() / 1000 / TIME_SLOW;
  // hovered and opened coins pause their life so they don't fade away
  if (hovered) hovered.born += t - lastT;
  if (selected && selected !== hovered) selected.born += t - lastT;
  lastT = t;
  ctx.clearRect(0, 0, W, H);
  tctx.clearRect(0, 0, W, H);
  drawHUD(t);
  for (const g of rings) {
    if (g.queue.length && g.labels.filter(l => !l.dying).length < MAX_LABELS && t >= g.next) {
      spawn(g, t);
      g.next = t + (g.labels.length < MIN_LABELS ? .12 + Math.random() * .35 : .7 + Math.random() * 1.4);
    }
    drawRing(g, t);
    g.labels = g.labels.filter(l => drawLabel(g, l, t));
  }
  drawRibbon(t);
  hovered = findHover();
  document.body.style.cursor = hovered ? 'pointer' : '';
  if (selected) { drawLink(selected); drawHolo(selected); }
  requestAnimationFrame(frame);
}
// ── ПРИЁМ ДАННЫХ: кольцо A — 15 ближайших к входу кандидатов (цена — уровень входа), кольцо B — открытые позиции (цена — цель).
function applyState(S) {
  window.STATE = S;
  try { announce(S); } catch (e) {}
  const t = performance.now() / 1000 / TIME_SLOW;
  syncRibbon(S, t);
  layout();
  const nowS = Date.now() / 1000;
  const sets = [
    (S.open || []).filter(p => nowS - p.t_in < ENTRY_KEEP).map(p => ({ key: 'in|' + p.book + '|' + p.sym + '|' + Math.round(p.t_in), name: p.sym.replace(/USDT$/, ''), side: p.side, price: p.entry, item: p })),
    (S.closed || []).filter(c => nowS - c.t_out < EXIT_KEEP).map(c => ({ key: 'out|' + c.book + '|' + c.sym + '|' + Math.round(c.t_out), name: c.sym.replace(/USDT$/, ''), side: c.side, price: c.exit, item: c })),
  ];
  rings.forEach((g, i) => {
    const want = new Map(sets[i].map(x => [x.key, x]));
    for (const l of g.labels) {
      const x = want.get(l.key);
      if (!x) { if (!l.dying) { l.dying = true; l.life = (t - l.born) + 1.1 * ANIM_SLOW; } continue; }   // гаснет родным затуханием
      if (Math.abs(x.price - l.price) > 1e-12) { l.price = x.price; l.glyphs = null; }
      l.item = x.item;
    }
    const shown = new Set(g.labels.filter(l => !l.dying).map(l => l.key));
    g.queue = g.queue.filter(q => want.has(q.key));
    const queued = new Set(g.queue.map(q => q.key));
    for (const x of sets[i]) if (!shown.has(x.key) && !queued.has(x.key)) { g.queue.push(x); queued.add(x.key); }
  });
  const M = S.meta || {};
  const st = document.getElementById('status');
  if (st) st.textContent = `${M.ses || ''} · ${M.open_gate ? 'вход открыт · выход ' + hmT(M.exit_at) : 'вход закрыт: ' + (M.gate_why || '')} · данные ${hmT(M.t)}`;
  if (selected) renderCard(selected.closed ? RIB_G : (rings.find(g => g.labels.includes(selected)) || rings[0]), selected);
}
window.applyState = applyState;
// ── ЗВУК И ЗАГОЛОВОК (27.09 владелец: «звук, когда монета появляется на вход или закрытие, чтобы с соседней вкладки переключиться»).
//    Браузер даёт играть звук только после первого клика по странице — клик включает звук и спрашивает про системные уведомления.
let AC = null, knownKeys = null;
addEventListener('click', () => {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}, { capture: true });
function tone(freqs, dur = .18, gap = .05, type = 'sine', vol = .12) {
  if (!AC) return;
  let t0 = AC.currentTime;
  for (const f of freqs) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur); o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .02);
    t0 += dur + gap;
  }
}
let titleT = null;
function flashTitle(msg) {
  const base = 'Быстрый бот · Crypto Orbit'; let on = true, n = 0;
  clearInterval(titleT);
  titleT = setInterval(() => { document.title = on ? msg : base; on = !on; if (++n > 12) { clearInterval(titleT); document.title = base; } }, 800);
}
function announce(S) {
  const nowS = Date.now() / 1000;
  const ins = (S.open || []).filter(p => nowS - p.t_in < ENTRY_KEEP), outs = (S.closed || []).filter(c => nowS - c.t_out < EXIT_KEEP);
  const cur = new Map([...ins.map(p => ['in|' + p.book + '|' + p.sym + '|' + Math.round(p.t_in), ['in', p]]),
                       ...outs.map(c => ['out|' + c.book + '|' + c.sym + '|' + Math.round(c.t_out), ['out', c]])]);
  if (knownKeys === null) { knownKeys = new Set(cur.keys()); return; }        // первая загрузка — без звука
  const fresh = [...cur.entries()].filter(([k]) => !knownKeys.has(k)).map(([, v]) => v);
  for (const k of cur.keys()) knownKeys.add(k);
  if (!fresh.length) return;
  const ev = fresh[0], nm = ev[1].sym.replace(/USDT$/, ''), side = ev[1].side < 0 ? '▼' : '▲';
  let msg;
  if (ev[0] === 'in') { tone([660, 990]); msg = `${side} ВХОД · ${nm}`; }
  else { const up = ev[1].res >= 0; if (up) tone([523, 659, 784], .22, .02, 'triangle'); else tone([220, 165], .3, .04, 'sine', .14);
         msg = `${up ? '✓' : '✕'} ВЫХОД · ${nm} ${up ? '+' : ''}${ev[1].res.toFixed(1)}%`; }
  if (fresh.length > 1) msg += ` · и ещё ${fresh.length - 1}`;
  flashTitle(msg);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { const nt = new Notification('Быстрый бот', { body: msg, tag: 'fastbot' }); nt.onclick = () => { window.focus(); nt.close(); }; } catch (e) {}
  }
}
const EXIT_KEEP = 15 * 60;   // закрытая сделка держится на кольце «выход» 15 минут
const ENTRY_KEEP = 6 * 60;   // вход — 6 минут, два прохода бота (владелец 27.09: «скрывать входы через 6 минут, а то новые не видно»)
// между обновлениями данных: у закрытых истекли 15 минут — гаснут сразу, не ждут следующей рассылки
setInterval(() => {
  const t = performance.now() / 1000 / TIME_SLOW, nowS = Date.now() / 1000;
  for (const l of rings[1].labels) if (!l.dying && l.item && nowS - l.item.t_out >= EXIT_KEEP) { l.dying = true; l.life = (t - l.born) + 1.1 * ANIM_SLOW; }
  for (const l of rings[0].labels) if (!l.dying && l.item && nowS - l.item.t_in >= ENTRY_KEEP) { l.dying = true; l.life = (t - l.born) + 1.1 * ANIM_SLOW; }
  rings[0].queue = rings[0].queue.filter(q => nowS - q.item.t_in < ENTRY_KEEP);
  rings[1].queue = rings[1].queue.filter(q => nowS - q.item.t_out < EXIT_KEEP);
}, 5000);
let ws = null, lastStateT = 0;
function connect() {
  if (location.protocol === 'file:') return;
  try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); } catch (e) { return setTimeout(connect, 5000); }
  ws.onmessage = m => { try { const S = JSON.parse(m.data); lastStateT = S.meta.t; applyState(S); } catch (e) {} };
  ws.onclose = () => { const st = document.getElementById('status'); if (st) st.textContent = 'нет связи — переподключаюсь'; setTimeout(connect, 4000); };
}
async function poll() {
  if (location.protocol === 'file:' || (ws && ws.readyState === 1)) return;
  try { const r = await fetch('/state.json', { cache: 'no-store' }); if (r.ok) { const S = await r.json(); if (S.meta.t !== lastStateT) { lastStateT = S.meta.t; applyState(S); } } } catch (e) {}
}
setInterval(poll, 60000); connect(); poll();
requestAnimationFrame(frame);
</script>
