<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хитрая машина</title>
<!-- 26.10 владелец: «вот такую игру хочу» — по образцу The Incredible Machine 2 (1994): собрать цепочку из деталей, чтобы сделать простое дело.
     «графика слишком убогая», «сделай более реалистично всё», «добавь побольше задач». Графика, текстуры и физика свои (из оригинала ничего не копируется).
     Пять задач; стрелки на табличке — выбрать задачу. Детали тащить мышью из шкафа справа; колесо мыши или Q / E — повернуть доску;
     правая кнопка — развернуть вентилятор и транспортёр; ПУСК / СТОП — пробел; вернуть деталь — утащить её обратно в шкаф. -->
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #2a2219, #0d0a07 75%); overflow: hidden; }
canvas { position: fixed; left: 50%; top: calc(50% - 16px); transform: translate(-50%, -50%); display: block; cursor: default; border-radius: 6px; box-shadow: 0 0 0 1px #000, 0 24px 70px rgba(0,0,0,.75); }
#help { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); color: #9a8c76; font: 500 12px Rubik, sans-serif; white-space: nowrap; letter-spacing: .02em; }
#help b { color: #f1e6cc; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"><b>мышь</b> — тащить деталь &nbsp;·&nbsp; <b>колесо / Q E</b> — повернуть доску &nbsp;·&nbsp; <b>правая кнопка</b> — развернуть &nbsp;·&nbsp; <b>пробел</b> — пуск / стоп &nbsp;·&nbsp; <b>M</b> — звук</div>
<script>
(() => {
  const LW = 640, LH = 400, PW = 500, G = 600, FLOOR = 384;
  const cv = document.getElementById('c'), M = cv.getContext('2d'); let g = M, SC = 2;
  function fit() { const k = Math.min(innerWidth / LW, (innerHeight - 44) / LH); cv.style.width = LW * k + 'px'; cv.style.height = LH * k + 'px'; SC = Math.min(2, Math.max(1, Math.ceil(k * (devicePixelRatio || 1)))); cv.width = LW * SC; cv.height = LH * SC; }
  addEventListener('resize', fit); fit();
  const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rad = d => d * Math.PI / 180;

  // ── задачи: предметы уровня, мячи, цель, детали в шкафу
  const BALL = { bowl: { r: 12, m: 5, e: .15 }, basket: { r: 11, m: 1, e: .72 }, tennis: { r: 6.5, m: .3, e: .78 } };
  const LEVELS = [
    { title: 'ЗАГОНИ БАСКЕТБОЛЬНЫЙ МЯЧ В КОРЗИНУ', goal: { type: 'hoop', x: 425, y: 160, ball: 'basket' },
      objs: [{ kind: 'rail', cx: 64, cy: 78, w: 108, h: 8, ang: 6 }, { kind: 'shelf', cx: 245, cy: 105, w: 110, h: 10 }, { kind: 'brick', cx: 340, cy: 330, w: 22, h: 108 }],
      balls: [['bowl', 30, 57], ['basket', 245, 89]], inv: { ramp: 3, tramp: 1, fan: 1, belt: 1, pin: 2, spring: 1, saw: 1, funnel: 1, wall: 1, ball: 1 } },
    { title: 'СБЕЙ ВСЕ КЕГЛИ ЗА СТЕНКОЙ', goal: { type: 'pins' },
      objs: [{ kind: 'rail', cx: 436, cy: 80, w: 108, h: 8, ang: -6 }, { kind: 'brick', cx: 230, cy: 350, w: 22, h: 68 }],
      pins: [[60, FLOOR], [84, FLOOR], [108, FLOOR]], balls: [['bowl', 470, 58]], inv: { ramp: 2, tramp: 1, fan: 1, belt: 1, spring: 1, wall: 1 } },
    { title: 'ПОЛОЖИ ТЕННИСНЫЙ МЯЧ В ВЕДРО', goal: { type: 'bucket', x: 420, y: 240, ball: 'tennis' },
      objs: [{ kind: 'shelf', cx: 90, cy: 130, w: 120, h: 10 }, { kind: 'brick', cx: 420, cy: 330, w: 70, h: 108 }],
      balls: [['tennis', 125, 118.5]], inv: { fan: 1, ramp: 2, tramp: 1, pin: 1, spring: 1, funnel: 1, wall: 1 } },
    { title: 'МЯЧ ВЫПАДЕТ ИЗ ТРУБЫ — ПОПАДИ В КОРЗИНУ', goal: { type: 'hoop', x: 330, y: 150, ball: 'basket' },
      objs: [{ kind: 'pipe', cx: 70, cy: 22, w: 30, h: 44 }, { kind: 'brick', cx: 190, cy: 318, w: 22, h: 132 }],
      balls: [['basket', 70, 58]], inv: { tramp: 1, ramp: 2, fan: 1, spring: 1, funnel: 1, wall: 1 } },
    { title: 'СБЕЙ КЕГЛИ НА ДАЛЬНЕЙ ПОЛКЕ', goal: { type: 'pins' },
      objs: [{ kind: 'rail', cx: 64, cy: 78, w: 108, h: 8, ang: 6 }, { kind: 'shelf', cx: 385, cy: 170, w: 170, h: 10 }, { kind: 'brick', cx: 300, cy: 300, w: 22, h: 168 }],
      pins: [[400, 165], [424, 165], [448, 165]], balls: [['bowl', 30, 57]], inv: { ramp: 3, tramp: 1, fan: 1, saw: 1, spring: 1, wall: 1 } },
    { title: 'ПОДБРОСЬ МЯЧ КАЧЕЛЯМИ', goal: { type: 'hoop', x: 400, y: 200, ball: 'basket' },
      objs: [{ kind: 'pipe', cx: 100, cy: 22, w: 30, h: 44 }],
      saws: [[250, 362, .3]], balls: [['bowl', 100, 58], ['basket', 288, 357]], inv: { ramp: 2, fan: 1, spring: 1, wall: 1, funnel: 1 } },
  ];
  let LI = 0, LV, LEVEL, BALLS0, HOOP;
  function loadLevel(i) { LI = clamp(i, 0, LEVELS.length - 1); LV = LEVELS[LI]; HOOP = LV.goal.type === 'hoop' ? LV.goal : null;
    LEVEL = [{ cx: PW / 2, cy: 392, w: PW, h: 16, kind: 'floor' }, { cx: 6, cy: 200, w: 12, h: 400, kind: 'brick' }, { cx: 494, cy: 200, w: 12, h: 400, kind: 'brick' }].concat(LV.objs.map(o => ({ ...o, ang: rad(o.ang || 0) })));
    if (HOOP) LEVEL.push({ cx: HOOP.x + 30, cy: HOOP.y - 22, w: 6, h: 70, kind: 'board' }, { cx: HOOP.x + 30, cy: (HOOP.y + 14 + FLOOR) / 2, w: 6, h: FLOOR - HOOP.y - 14, kind: 'pole' }, { cx: HOOP.x - 24, cy: HOOP.y, w: 4, h: 4, kind: 'rim' }, { cx: HOOP.x + 24, cy: HOOP.y, w: 4, h: 4, kind: 'rim' });
    for (const [x, y] of LV.saws || []) LEVEL.push({ cx: x, cy: y + 11, w: 12, h: 22, kind: 'stand' });
    if (LV.goal.type === 'bucket') { const { x, y } = LV.goal; LEVEL.push({ cx: x - 23, cy: y + 17, w: 4, h: 36, kind: 'bucketwall' }, { cx: x + 23, cy: y + 17, w: 4, h: 36, kind: 'bucketwall' }, { cx: x, cy: y + 34, w: 50, h: 4, kind: 'bucketwall' }); }
    LEVEL = LEVEL.map(o => ({ ang: 0, e: o.kind === 'rim' ? .5 : o.kind === 'bucketwall' ? .2 : .3, ...o }));
    BALLS0 = LV.balls.map(([kind, x, y]) => ({ kind, x, y, lv: true, ...BALL[kind] }));
    parts = []; mode = 'edit'; won = 0; confetti = []; drag = null; hover = null; pins = levelPins(); bgScale = 0; }
  const levelPins = () => (LV.pins || []).map(([x, y]) => ({ type: 'pin', fixed: true, bx: x, by: y, a: 0, w: 0, fallen: false, I: 2 * 34 * 34 / 3 })).concat((LV.saws || []).map(([x, y, a]) => ({ type: 'saw', fixed: true, bx: x, by: y, a, w: 0, fallen: false, I: 2304 })));
  let SOLVED = {}; try { SOLVED = JSON.parse(localStorage.getItem('tim_solved') || '{}'); } catch (e) {}

  // ── детали
  const TYPES = {
    ramp: { name: 'ДОСКА', w: 84, h: 8 },
    tramp: { name: 'БАТУТ', w: 48, h: 22 },
    fan: { name: 'ВЕНТИЛЯТОР', w: 30, h: 36 },
    belt: { name: 'ТРАНСПОРТЁР', w: 96, h: 30 },
    pin: { name: 'КЕГЛЯ', w: 12, h: 34 },
    spring: { name: 'ПРУЖИНА', w: 30, h: 22 },
    saw: { name: 'КАЧЕЛИ', w: 100, h: 30 },
    funnel: { name: 'ВОРОНКА', w: 64, h: 34 },
    wall: { name: 'СТЕНКА', w: 20, h: 40 },
    ball: { name: 'МЯЧИК', w: 14, h: 14 },
  };
  const ORDER = ['ramp', 'tramp', 'fan', 'belt', 'pin', 'spring', 'saw', 'funnel', 'wall', 'ball'];
  let parts = [], mode = 'edit', balls = [], world = [], pins = [], won = 0, tRun = 0, drag = null, hover = null, mouse = { x: 0, y: 0 }, confetti = [], bgScale = 0;
  const left = t => (LV.inv[t] || 0) - parts.filter(p => p.type === t).length;

  // каждая деталь — набор твёрдых прямоугольников для физики
  function bodies(p) {
    if (p.type === 'ramp') return [{ cx: p.x, cy: p.y, w: 84, h: 8, ang: p.ang, e: .25, kind: 'ramp' }];
    if (p.type === 'tramp') return [{ cx: p.x, cy: p.y - 8, w: 46, h: 4, ang: 0, e: 1, kind: 'tramp', part: p }, { cx: p.x, cy: p.y + 9, w: 48, h: 4, ang: 0, e: .2, kind: 'frame' }];
    if (p.type === 'fan') return [{ cx: p.x, cy: p.y, w: 26, h: 34, ang: 0, e: .2, kind: 'fan' }];
    if (p.type === 'belt') return [{ cx: p.x, cy: p.y + 8, w: 96, h: 12, ang: 0, e: .1, kind: 'belt', speed: p.dir * 120 }];
    if (p.type === 'spring') { const s = Math.sin(p.ang), c = Math.cos(p.ang); return [{ cx: p.x, cy: p.y, w: 28, h: 5, ang: p.ang, e: .3, kind: 'spring', part: p }, { cx: p.x - s * 12, cy: p.y + c * 12, w: 30, h: 4, ang: p.ang, e: .2, kind: 'frame' }]; }
    if (p.type === 'saw') return [{ cx: p.x, cy: p.y + 11, w: 12, h: 22, ang: 0, e: .2, kind: 'stand' }];
    if (p.type === 'funnel') { const a = Math.atan2(24, 16); return [{ cx: p.x - 22, cy: p.y, w: 28.8, h: 3, ang: a, e: .2, kind: 'tin' }, { cx: p.x + 22, cy: p.y, w: 28.8, h: 3, ang: -a, e: .2, kind: 'tin' }, { cx: p.x - 15.5, cy: p.y + 16, w: 3, h: 8, ang: 0, e: .2, kind: 'tin' }, { cx: p.x + 15.5, cy: p.y + 16, w: 3, h: 8, ang: 0, e: .2, kind: 'tin' }]; }
    if (p.type === 'wall') return [{ cx: p.x, cy: p.y, w: 20, h: 40, ang: 0, e: .3, kind: 'brick' }];
    return []; }

  // ── физика: мяч против повёрнутого прямоугольника
  function hitBox(b, o) { const c = Math.cos(o.ang), s = Math.sin(o.ang), dx = b.x - o.cx, dy = b.y - o.cy, lx = dx * c + dy * s, ly = -dx * s + dy * c, hw = o.w / 2, hh = o.h / 2;
    const qx = clamp(lx, -hw, hw), qy = clamp(ly, -hh, hh); let nx = lx - qx, ny = ly - qy, d = Math.hypot(nx, ny);
    if (d >= b.r) return null;
    if (d < 1e-6) { const px = hw - Math.abs(lx), py = hh - Math.abs(ly); if (px < py) { nx = Math.sign(lx) || 1; ny = 0; d = -px; } else { nx = 0; ny = Math.sign(ly) || -1; d = -py; } } else { nx /= d; ny /= d; }
    return { nx: nx * c - ny * s, ny: nx * s + ny * c, pen: b.r - d, top: ny < -.7, tx: c, ty: s }; }
  const inBox = (x, y, o, m = 0) => { const c = Math.cos(o.ang), s = Math.sin(o.ang), dx = x - o.cx, dy = y - o.cy; return Math.abs(dx * c + dy * s) < o.w / 2 + m && Math.abs(-dx * s + dy * c) < o.h / 2 + m; };
  const pinBox = p => ({ cx: p.bx + Math.sin(p.a) * 17, cy: p.by - Math.cos(p.a) * 17, w: 10, h: 34, ang: p.a });
  function hingeBoxes(p) { if (p.type !== 'saw') return [pinBox(p)]; const c = Math.cos(p.a), s = Math.sin(p.a), at = (lx, ly, w, h) => ({ cx: p.bx + lx * c - ly * s, cy: p.by + lx * s + ly * c, w, h, ang: p.a });
    return [at(0, 0, 96, 6), at(-46.5, -6.5, 3, 8), at(46.5, -6.5, 3, 8)]; }   // качели: доска и два бортика

  function resolve(b, h, o, dt) { b.x += h.nx * h.pen; b.y += h.ny * h.pen; const vn = b.vx * h.nx + b.vy * h.ny;
    if (vn < 0) { if (o.kind === 'spring' && h.top) { const k = Math.max(-vn * .9, 430) - vn; b.vx += k * h.nx; b.vy += k * h.ny; o.part.hit = 1; beep(240, .2, 'sine', .09, 2.4); return; }   // пружина подбрасывает
      let e = Math.min(b.e, o.e); if (o.kind === 'tramp' && h.top) { e = .97; o.part.hit = 1; if (-vn > 60) beep(180 + Math.random() * 40, .12, 'triangle', .07, 2); } else if (-vn < 45) e = 0; else if (-vn > 90) beep(o.kind === 'rim' ? 900 : b.kind === 'bowl' ? 90 : 220, .05, 'triangle', Math.min(.08, -vn / 4000));
      if (-vn > 170 && o.kind !== 'tramp') puff(b.x - h.nx * b.r, b.y - h.ny * b.r);
      b.vx -= (1 + e) * vn * h.nx; b.vy -= (1 + e) * vn * h.ny; }
    const tx = -h.ny, ty = h.nx, sv = o.kind === 'belt' && h.top ? o.speed : 0, vt = (b.vx - h.tx * sv) * tx + (b.vy - h.ty * sv) * ty, k = sv ? .06 : .002;   // трение мало — мячи катятся; лента тянет за собой
    b.vx -= tx * vt * k; b.vy -= ty * vt * k; if (h.ny < -.5) b.ground = true; }

  function start() { mode = 'run'; won = 0; tRun = 0; confetti = []; puffs = [];
    balls = BALLS0.concat(parts.filter(p => p.type === 'ball').map(p => ({ kind: 'tennis', x: p.x, y: p.y, ...BALL.tennis }))).map(b => ({ ...b, vx: 0, vy: 0, rot: 0, py: b.y }));
    world = LEVEL.concat(...parts.map(bodies));
    pins = levelPins().concat(parts.filter(p => p.type === 'pin').map(p => ({ type: 'pin', part: p, bx: p.x, by: p.y + 17, a: 0, w: 0, fallen: false, I: 2 * 34 * 34 / 3 })), parts.filter(p => p.type === 'saw').map(p => ({ type: 'saw', part: p, bx: p.x, by: p.y, a: 0, w: 0, fallen: false, I: 2304 }))); }
  function stop() { mode = 'edit'; won = 0; parts.forEach(p => p.hit = 0); pins = levelPins(); }
  function win() { won = tRun; SOLVED[LI] = 1; try { localStorage.setItem('tim_solved', JSON.stringify(SOLVED)); } catch (e) {} winTune();
    const gx = HOOP ? HOOP.x : LV.goal.type === 'bucket' ? LV.goal.x : 250, gy = HOOP ? HOOP.y : LV.goal.type === 'bucket' ? LV.goal.y : 200;
    for (let i = 0; i < 110; i++) confetti.push({ x: gx, y: gy, vx: (Math.random() - .5) * 280, vy: -Math.random() * 320 - 60, c: ['#ffd23f', '#ff5e5b', '#3bceac', '#fff', '#7aa2ff'][i % 5], t: 0 }); }

  function sim(dt) { tRun += dt;
    for (const p of pins) if (p.type === 'saw') { p.w *= .998; p.a += p.w * dt; if (Math.abs(p.a) > .3) { p.a = Math.sign(p.a) * .3; if (p.w * Math.sign(p.a) > 0) p.w = -p.w * .15; } }   // качели упираются в ±17°
    else if (!p.fallen) { p.w += 3 * G / (2 * 34) * Math.sin(p.a) * dt; p.w *= .9995; p.a += p.w * dt;
      const tx = p.bx + Math.sin(p.a) * 34, ty = p.by - Math.cos(p.a) * 34;
      if (Math.abs(p.a) > 1.5 || (Math.abs(p.a) > .15 && world.some(o => inBox(tx, ty, o)))) { p.fallen = true; p.w = 0; beep(130, .08, 'triangle', .06); }
      if (Math.abs(p.w) > .3) for (const q of pins) if (q !== p && q.type === 'pin' && !q.fallen && inBox(tx, ty, pinBox(q), 1)) { q.w += p.w * .8; p.w *= .5; } }   // кегля валит кеглю
    for (const b of balls) { b.ground = false; b.py = b.y; b.vy += G * dt;
      for (const f of parts) if (f.type === 'fan') { const d = (b.x - f.x) * f.dir; if (d > 10 && d < 230 && Math.abs(b.y - f.y) < 18 + b.r) b.vx += f.dir * 900 * (1 - d / 230) / b.m * dt; }   // ветер, лёгкий мяч сдувает сильнее
      b.x += b.vx * dt; b.y += b.vy * dt;
      for (const o of world) { const h = hitBox(b, o); if (h) resolve(b, h, o, dt); }
      for (const p of pins) for (const hb of hingeBoxes(p)) { const h = hitBox(b, hb); if (!h) continue; b.x += h.nx * h.pen; b.y += h.ny * h.pen;
        const rx = b.x - h.nx * b.r - p.bx, ry = b.y - h.ny * b.r - p.by, vpx = -p.w * ry, vpy = p.w * rx, vn = (b.vx - vpx) * h.nx + (b.vy - vpy) * h.ny;
        if (vn < 0) { const cr = rx * h.ny - ry * h.nx, j = -(1.3) * vn / (1 / b.m + (p.fallen ? 0 : cr * cr / p.I)); b.vx += j * h.nx / b.m; b.vy += j * h.ny / b.m; if (!p.fallen) p.w -= j * cr / p.I; if (-vn > 60) beep(520, .04, 'triangle', .05); } }
      if (b.ground) b.vx *= .9993; b.rot += b.vx / b.r * dt;
      if (!won && HOOP && b.lv && b.kind === HOOP.ball && b.py < HOOP.y && b.y >= HOOP.y && Math.abs(b.x - HOOP.x) < 21) win();
      if (HOOP && b.kind === HOOP.ball && Math.abs(b.x - HOOP.x) < 22 && b.y > HOOP.y && b.y < HOOP.y + 26) { b.vx *= .985; }   // сетка гасит мяч
      if (!won && LV.goal.type === 'bucket' && b.lv && b.kind === LV.goal.ball && Math.abs(b.x - LV.goal.x) < 21 && b.y > LV.goal.y + 8 && b.y < LV.goal.y + 34) win();
      b.x = clamp(b.x, 12 + b.r, PW - 12 - b.r); }
    if (!won && LV.goal.type === 'pins' && pins.filter(p => p.fixed && p.type === 'pin').every(p => p.fallen)) win();
    for (let i = 0; i < balls.length; i++) for (let j = i + 1; j < balls.length; j++) { const a = balls[i], c = balls[j], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), R = a.r + c.r;
      if (d > 0 && d < R) { const nx = dx / d, ny = dy / d, ia = 1 / a.m, ic = 1 / c.m, pen = R - d; a.x -= nx * pen * ia / (ia + ic); a.y -= ny * pen * ia / (ia + ic); c.x += nx * pen * ic / (ia + ic); c.y += ny * pen * ic / (ia + ic);
        const vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny; if (vn < 0) { const jj = -(1.5) * vn / (ia + ic); a.vx -= jj * nx * ia; a.vy -= jj * ny * ia; c.vx += jj * nx * ic; c.vy += jj * ny * ic; if (-vn > 40) beep(300, .06, 'triangle', .06); } } }
    parts.forEach(p => { if (p.hit) p.hit = Math.max(0, p.hit - dt * 4); }); }

  // ── звук
  let AC = null, SND = true;
  function beep(f, d = .08, type = 'triangle', vol = .05, slide = 0) { if (!SND || !AC) return; const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d); v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(v); v.connect(AC.destination); o.start(t); o.stop(t + d + .02); }
  function winTune() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .08), i * 110)); }

  // ── процедурные текстуры (один раз): шум, дерево, мячи
  const hash = (x, y) => { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const md = (a, p) => ((a % p) + p) % p;
  function vn(x, y, px, py) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(md(xi, px), md(yi, py)), b = hash(md(xi + 1, px), md(yi, py)), c = hash(md(xi, px), md(yi + 1, py)), d = hash(md(xi + 1, px), md(yi + 1, py)); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }

      if (ty === 'ramp') drawRamp(cx, cy, rad(-25), 42); else if (ty === 'tramp') drawTramp(cx, cy + 2, 0); else if (ty === 'fan') drawFan(cx, cy - 1, 1, 0, false); else if (ty === 'belt') drawBelt(cx + 4, cy - 2, 1, t, false); else if (ty === 'pin') drawPin(cx, cy + 12, 0);
      else if (ty === 'spring') drawSpring(cx, cy - 4, 0, 0); else if (ty === 'saw') drawSaw(cx, cy - 6, -.25); else if (ty === 'funnel') drawFunnel(cx, cy - 4); else if (ty === 'wall') brickWall(cx - 10, cy - 20, 20, 40, 9); else drawBall({ kind: 'tennis', x: cx, y: cy, r: 9, rot: .6 });
      g.restore(); g.font = '600 7px Rubik, sans-serif'; g.textAlign = 'right'; g.fillStyle = n > 0 ? 'rgba(241,230,204,.9)' : 'rgba(241,230,204,.3)'; g.fillText('×' + n, s.x + s.w - 3, s.y + s.h - 5); });
    if (tip) { const [s, nm] = tip; g.font = '600 8px Rubik, sans-serif'; const w = g.measureText(nm).width + 12, x = clamp(s.x + s.w / 2 - w / 2, PW + 3, LW - 3 - w), y = s.y + s.h - 2;
      g.save(); g.textAlign = 'center'; g.shadowColor = 'rgba(0,0,0,.9)'; g.shadowBlur = 3 * SC; g.fillStyle = '#ffe3a0'; g.fillText(nm, x + w / 2, y + 9.2); g.restore(); }
    const run = mode === 'run'; button(BTN.run, run ? 'СТОП' : 'ПУСК', run ? '#ff6a55' : '#5fd37a', run ? '#8e1d12' : '#1d6b32', true);
    g.fillStyle = '#fff'; const bx = BTN.run.x + 30, byy = BTN.run.y + BTN.run.h / 2; if (run) g.fillRect(bx - 4, byy - 4, 8, 8); else { g.beginPath(); g.moveTo(bx - 3.5, byy - 5); g.lineTo(bx + 5, byy); g.lineTo(bx - 3.5, byy + 5); g.fill(); }
    button(BTN.clr, 'УБРАТЬ ВСЁ', '#8b929c', '#3a3f46', mode === 'edit' && parts.length > 0); }

  // ── кадр: фон → слой предметов с мягкой тенью → ветер, пыль, конфетти, шкаф
  const OBJ = document.createElement('canvas'), O = OBJ.getContext('2d'); let puffs = [];
  const puff = (x, y) => { for (let i = 0; i < 5; i++) puffs.push({ x, y, vx: (Math.random() - .5) * 30, vy: -Math.random() * 20, r: 1.5 + Math.random() * 2, t: 0 }); };
  // мягкая тень без размытия: силуэт слоя в 1/6 размера, растянутый обратно
  const SH = document.createElement('canvas'), SHc = SH.getContext('2d');
  function softShadow() { const w = Math.ceil(OBJ.width / 6), hh = Math.ceil(OBJ.height / 6); if (SH.width !== w || SH.height !== hh) { SH.width = w; SH.height = hh; }
    SHc.globalCompositeOperation = 'source-over'; SHc.clearRect(0, 0, w, hh); SHc.imageSmoothingEnabled = true; SHc.drawImage(OBJ, 0, 0, w, hh); SHc.globalCompositeOperation = 'source-in'; SHc.fillStyle = 'rgb(25,15,5)'; SHc.fillRect(0, 0, w, hh);
    M.save(); M.setTransform(1, 0, 0, 1, 0, 0); M.globalAlpha = .5; M.imageSmoothingEnabled = true; M.imageSmoothingQuality = 'high'; M.drawImage(SH, 5 * SC, 7 * SC, OBJ.width, OBJ.height); M.restore(); }
  function draw(t) { if (bgScale !== SC) paintBG(); if (OBJ.width !== cv.width || OBJ.height !== cv.height) { OBJ.width = cv.width; OBJ.height = cv.height; }
    M.setTransform(1, 0, 0, 1, 0, 0); M.drawImage(BG, 0, 0); const run = mode === 'run';
    O.setTransform(1, 0, 0, 1, 0, 0); O.clearRect(0, 0, OBJ.width, OBJ.height); O.setTransform(SC, 0, 0, SC, 0, 0); g = O;
    for (const p of parts) if (!drag || p !== drag.part) drawPart(p, t, run);
    for (const p of pins) if (p.fixed) p.type === 'saw' ? drawSaw(p.bx, p.by, p.a) : drawPin(p.bx, p.by, p.a);
    const bl = run ? balls : BALLS0.map(b => ({ ...b, rot: 0, vx: 0 })); hoopBack(); bucketBack(); bl.forEach(drawBall); hoopFront(bl); bucketFront();
    g = M; softShadow(); M.setTransform(1, 0, 0, 1, 0, 0); M.drawImage(OBJ, 0, 0); M.setTransform(SC, 0, 0, SC, 0, 0);
    if (!run && hover && !drag) { M.save(); M.shadowColor = 'rgba(255,214,110,.95)'; M.shadowBlur = 9 * SC; drawPart(hover, t, false); M.restore(); }
    if (run) for (const f of parts) if (f.type === 'fan') { for (let i = 0; i < 7; i++) { const u = (t * 1.4 + i / 7) % 1, x0 = f.x + f.dir * (14 + u * 200), yy = f.y - 14 + (i * 9) % 26; g.strokeStyle = `rgba(255,255,255,${.22 * (1 - u)})`; g.lineWidth = .8; g.beginPath(); g.moveTo(x0, yy); g.quadraticCurveTo(x0 + f.dir * 8, yy - 1.5, x0 + f.dir * 16, yy); g.stroke(); } }
    for (const p of puffs) { p.t += 1 / 60; p.x += p.vx / 60; p.y += p.vy / 60; p.r += .15; g.fillStyle = `rgba(235,225,205,${.35 * (1 - p.t / .6)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); } puffs = puffs.filter(p => p.t < .6);
    const v = g.createRadialGradient(PW / 2, LH * .45, LH * .35, PW / 2, LH * .45, LH * .85); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,6,2,.45)'); g.fillStyle = v; g.fillRect(0, 0, PW, LH);
    if (drag) { const p = drag.part, bad = !okPlace(p) && p.x < PW; M.save(); M.shadowColor = bad ? 'rgba(255,40,40,.9)' : 'rgba(25,15,5,.45)'; M.shadowBlur = (bad ? 10 : 12) * SC; M.shadowOffsetX = (bad ? 0 : 10) * SC; M.shadowOffsetY = (bad ? 0 : 14) * SC; drawPart(p, t, false); M.restore(); }
    for (const c of confetti) { c.t += 1 / 60; c.vy += 300 / 60; c.vx *= .99; c.x += c.vx / 60; c.y += c.vy / 60; g.save(); g.translate(c.x, c.y); g.rotate(c.t * 9 + c.vx); g.fillStyle = c.c; g.fillRect(-1.6, -.9, 3.2, 1.8); g.restore(); } confetti = confetti.filter(c => c.t < 3);
    for (const [r, d] of [[BTN.prev, -1], [BTN.next, 1]]) { const on = LI + d >= 0 && LI + d < LEVELS.length; g.fillStyle = on ? '#5d4210' : 'rgba(93,66,16,.25)'; const cx = r.x + r.w / 2, cy = r.y + r.h / 2; g.beginPath(); g.moveTo(cx + d * 5, cy); g.lineTo(cx - d * 3, cy - 5.5); g.lineTo(cx - d * 3, cy + 5.5); g.fill(); }
    drawPanel(t);
    if (won) { g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 14 * SC; g.shadowOffsetY = 6 * SC; brass(150, 168, 200, 62, 6); g.restore(); brass(150, 168, 200, 62, 6); engrave('ГОТОВО!', 250, 194, 16); engrave('деталей: ' + parts.length + '  ·  время: ' + won.toFixed(1) + ' с', 250, 210, 9, '#5d4210'); if (LI < LEVELS.length - 1) { const r = BTN.go; button(r, 'ДАЛЬШЕ  ▶', '#5fd37a', '#1d6b32', true); } }
    if (!SND) { g.font = '500 8px Rubik, sans-serif'; g.textAlign = 'left'; g.fillStyle = 'rgba(241,230,204,.5)'; g.fillText('звук выкл', PW + 14, LH - 5); } }

  // ── мышь
  const okPlace = p => p.x > 18 && p.x < PW - 18 && p.y > 18 && p.y < FLOOR - 4;
  function partAt(x, y) { for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i], T = TYPES[p.type]; if (inBox(x, y, { cx: p.x, cy: p.y, w: T.w + 6, h: Math.max(T.h, 14) + 6, ang: p.type === 'ramp' || p.type === 'spring' ? p.ang : 0 })) return p; } return null; }
  const at = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  function pos(e) { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / b.width * LW, y: (e.clientY - b.top) / b.height * LH }; }
  const audio = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (x) {} } };
  cv.addEventListener('pointerdown', e => { audio(); const m = pos(e); if (e.button === 2 || (e.button === 0 && e.ctrlKey)) { e.preventDefault(); flipAt(m); return; } if (e.button !== 0) return;
    if (at(BTN.run, m.x, m.y)) { mode === 'run' ? stop() : start(); beep(mode === 'run' ? 660 : 330, .08); return; }
    if (at(BTN.clr, m.x, m.y) && mode === 'edit') { parts = []; beep(200, .1); return; }
    if (won && LI < LEVELS.length - 1 && at(BTN.go, m.x, m.y)) { loadLevel(LI + 1); save(); beep(700, .08); return; }
    for (const [r, d] of [[BTN.prev, -1], [BTN.next, 1]]) if (at(r, m.x, m.y) && LI + d >= 0 && LI + d < LEVELS.length) { loadLevel(LI + d); save(); beep(600, .06); return; }
    if (mode !== 'edit') return;
    const i = ORDER.findIndex((ty, k) => at(SLOT(k), m.x, m.y)); if (i >= 0 && left(ORDER[i]) > 0) { const ty = ORDER[i]; drag = { part: { type: ty, x: m.x, y: m.y, ang: ty === 'ramp' ? rad(15) : 0, dir: 1, hit: 0 }, dx: 0, dy: 0 }; cv.setPointerCapture(e.pointerId); beep(500, .04); return; }
    const p = partAt(m.x, m.y); if (p) { parts = parts.filter(q => q !== p); drag = { part: p, dx: p.x - m.x, dy: p.y - m.y }; cv.setPointerCapture(e.pointerId); beep(500, .04); } });
  cv.addEventListener('pointermove', e => { const m = pos(e); mouse = m; if (drag) { drag.part.x = Math.round(m.x + drag.dx); drag.part.y = Math.round(m.y + drag.dy); } hover = mode === 'edit' && !drag ? partAt(m.x, m.y) : null;
    cv.style.cursor = drag ? 'grabbing' : hover || (mode === 'edit' && m.x > PW && ORDER.some((ty, k) => at(SLOT(k), m.x, m.y) && left(ty) > 0)) ? 'grab' : at(BTN.run, m.x, m.y) || at(BTN.clr, m.x, m.y) || at(BTN.prev, m.x, m.y) || at(BTN.next, m.x, m.y) || (won && at(BTN.go, m.x, m.y)) ? 'pointer' : 'default'; });
  cv.addEventListener('pointerup', e => { if (!drag) return; const p = drag.part; drag = null; if (p.x < PW && okPlace(p)) { parts.push(p); beep(380, .05); hover = p; } else beep(160, .08); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  function flipAt(m) { if (mode !== 'edit') return; const p = drag ? drag.part : partAt(m.x, m.y); if (!p) return;
    if (p.type === 'fan' || p.type === 'belt') { if (p.vd === undefined) p.vd = p.dir; p.dir = -p.dir; beep(440, .05); } else if (p.type === 'ramp' || p.type === 'spring') { p.ang = -p.ang; beep(440, .05); } }
  function turn(sgn) { const p = drag ? drag.part : hover; if (mode !== 'edit' || !p || (p.type !== 'ramp' && p.type !== 'spring')) return false; p.ang = clamp(p.ang + sgn * rad(5), rad(p.type === 'spring' ? -90 : -80), rad(p.type === 'spring' ? 90 : 80)); beep(600 + sgn * 40, .03); return true; }
  cv.addEventListener('wheel', e => { if (turn(Math.sign(e.deltaY))) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === ' ') { e.preventDefault(); audio(); mode === 'run' ? stop() : start(); }
    if (k === 'q' || k === 'й') turn(-1); if (k === 'e' || k === 'у') turn(1); if (k === 'm' || k === 'ь') SND = !SND; });
  document.fonts && document.fonts.ready.then(() => { bgScale = 0; panelKey = ''; });

  const save = () => { try { localStorage.setItem('tim_level', String(LI)); } catch (e) {} };
  let L0 = 0; try { L0 = +localStorage.getItem('tim_level') || 0; } catch (e) {} loadLevel(L0);

  // ── цикл: физика мелким шагом 1/240 с
  let last = performance.now(), acc = 0, T = 0;
  function loop(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; T += dt;
    if (mode === 'run') { acc += dt; while (acc >= 1 / 240) { sim(1 / 240); acc -= 1 / 240; } }
    for (const p of parts.concat(drag ? [drag.part] : [])) if (p.vd !== undefined) { p.vd += (p.dir - p.vd) * Math.min(1, dt * 14); if (Math.abs(p.dir - p.vd) < .01) p.vd = p.dir; }
    draw(T); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  window.TIM = { load: i => loadLevel(i), parts: () => parts, add: (type, x, y, ang = 0, dir = 1) => parts.push({ type, x, y, ang: rad(ang), dir, hit: 0 }), clear: () => { parts = []; }, start, stop, sim: (sec) => { for (let i = 0; i < sec * 240; i++) sim(1 / 240); return { won, balls: balls.map(b => [b.kind, b.x | 0, b.y | 0]) }; }, draw: () => draw(T) };   // для проверки уровня из консоли
})();
