<!-- 26.10 владелец: «вот такую игру хочу» — по образцу The Incredible Machine 2 (1994): собрать цепочку из деталей, чтобы сделать простое дело.
     «графика слишком убогая», «сделай более реалистично всё», «добавь побольше задач», «добавь ещё 20 предметов вообще разных»,
     «там были кислоты, шарики надувать», «всё всегда можно использовать», «двигать предмет одним вентилятором неинтересно — что-то может падать,
     течь, шестерёнки что-то крутить, чтобы подуло, и дуть нужно включить», «интереснее изобретать, а не втупую использовать очевидное».
     Поэтому машины сами не работают: вентилятор, пылесос, магнит, мотор, перчатка, ускоритель берут ток по проводу от включённого выключателя
     или крутящегося генератора; транспортёр и генератор крутятся только от шестерёнок, а шестерёнки — от хомяка (бежит, если его напугать мячом),
     мотора, ветряка (дует включённый вентилятор) или водяного колеса (открыть кран). Все детали доступны во всех задачах.
     Графика, текстуры и физика свои (из оригинала ничего не копируется). Мышь — тащить; колесо / Q E — наклон; правая кнопка — развернуть; пробел — пуск. -->
